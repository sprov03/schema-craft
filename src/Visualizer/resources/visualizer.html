        function genLoadSelectorData(generatorDef, selectorKey, schemaClass, loadColumns, loadRelationships) {
            var colSection = document.getElementById('genr-selector-cols-' + selectorKey);
            var colList = document.getElementById('genr-selector-cols-list-' + selectorKey);
            var relSection = document.getElementById('genr-selector-rels-' + selectorKey);
            var relList = document.getElementById('genr-selector-rels-list-' + selectorKey);

            if (!schemaClass) {
                if (colSection) { colSection.style.display = 'none'; }
                if (relSection) { relSection.style.display = 'none'; }
                genUpdateColumnPickers(generatorDef, selectorKey, []);
                return;
            }

            var params = new URLSearchParams({ generator: generatorDef.class });
            params.set('selectors[' + selectorKey + ']', schemaClass);

            fetch('/_schema-craft/api/generators/detail?' + params.toString())
                .then(handleResponse)
                .then(function(data) {
                    var sData = (data.selectorData && data.selectorData[selectorKey]) ? data.selectorData[selectorKey] : {};
                    var columns = sData.columns || [];
                    var relationships = sData.relationships || [];

                    if (loadColumns && colList) {
                        var colHtml = '';
                        columns.forEach(function(col) {
                            colHtml += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:2px;">' +
                                '<input type="checkbox" class="genr-col-check" data-selector="' + escapeAttr(selectorKey) + '" data-col="' + escapeAttr(col.name) + '" checked>' +
                                '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(col.name) + '</span>' +
                                '<span style="font-size:11px;color:var(--text-muted);">' + escapeHtml(col.type) + '</span>' +
                            '</label>';
                        });
                        colList.innerHTML = colHtml || '<div style="font-size:12px;color:var(--text-muted);">No columns found</div>';
                        colSection.style.display = columns.length ? 'block' : 'none';

                        // Wire select all / deselect all buttons
                        colSection.querySelectorAll('.genr-select-all-cols').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                colList.querySelectorAll('.genr-col-check').forEach(function(cb) { cb.checked = true; });
                            });
                        });
                        colSection.querySelectorAll('.genr-deselect-all-cols').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                colList.querySelectorAll('.genr-col-check').forEach(function(cb) { cb.checked = false; });
                            });
                        });
                    }

                    if (loadRelationships && relList) {
                        var relHtml = '';
                        relationships.forEach(function(rel) {
                            relHtml += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:2px;">' +
                                '<input type="checkbox" class="genr-rel-check" data-selector="' + escapeAttr(selectorKey) + '" data-rel="' + escapeAttr(rel.name) + '" checked>' +
                                '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(rel.name) + '</span>' +
                                '<span style="font-size:11px;color:var(--text-muted);">' + escapeHtml(rel.type) + ' → ' + escapeHtml(rel.relatedModel) + '</span>' +
                            '</label>';
                        });
                        relList.innerHTML = relHtml || '<div style="font-size:12px;color:var(--text-muted);">No relationships found</div>';
                        relSection.style.display = relationships.length ? 'block' : 'none';

                        // Wire select all / deselect all buttons
                        relSection.querySelectorAll('.genr-select-all-rels').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                relList.querySelectorAll('.genr-rel-check').forEach(function(cb) { cb.checked = true; });
                            });
                        });
                        relSection.querySelectorAll('.genr-deselect-all-rels').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                relList.querySelectorAll('.genr-rel-check').forEach(function(cb) { cb.checked = false; });
                            });
                        });
                    }

                    genUpdateColumnPickers(generatorDef, selectorKey, columns);
                })
                .catch(function(e) { showToast('Failed to load schema data: ' + e.message, 'error'); });
        }

        function genUpdateColumnPickers(generatorDef, selectorKey, columns) {
            // Update schemaColumn / schemaColumns pickers whose selectorKey matches
            var content = document.getElementById('genr-content');
            if (!content) return;

            content.querySelectorAll('.genr-schema-col-picker[data-selector-key="' + selectorKey + '"]').forEach(function(select) {
                var current = select.value;
                var opts = '<option value="">-- Select a column --</option>';
                columns.forEach(function(col) {
                    opts += '<option value="' + escapeAttr(col.name) + '"' + (current === col.name ? ' selected' : '') + '>' +
                        escapeHtml(col.name) + ' (' + escapeHtml(col.type) + ')' +
                    '</option>';
                });
                select.innerHTML = opts;
            });

            content.querySelectorAll('.genr-schema-cols-picker[data-selector-key="' + selectorKey + '"]').forEach(function(div) {
                var html = '';
                columns.forEach(function(col) {
                    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:2px;">' +
                        '<input type="checkbox" class="genr-cols-check" data-col="' + escapeAttr(col.name) + '" data-key="' + escapeAttr(div.dataset.key) + '">' +
                        '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(col.name) + '</span>' +
                        '<span style="font-size:11px;color:var(--text-muted);">' + escapeHtml(col.type) + '</span>' +
                    '</label>';
                });
                div.innerHTML = html || '<div style="font-size:12px;color:var(--text-muted);">Select a schema first</div>';
            });
        }

        function genBuildPayload(generatorDef) {
            var content = document.getElementById('genr-content');
            var payload = {
                generator: generatorDef.class,
                inputs: {},
            };

            // Schema selectors → send as { class, selectedColumns, selectedRelationships }
            content.querySelectorAll('.genr-schema-selector').forEach(function(select) {
                var key = select.dataset.key;
                if (!select.value) return;

                var selectedCols = [];
                content.querySelectorAll('.genr-col-check[data-selector="' + key + '"]:checked').forEach(function(cb) {
                    selectedCols.push(cb.dataset.col);
                });

                var selectedRels = [];
                content.querySelectorAll('.genr-rel-check[data-selector="' + key + '"]:checked').forEach(function(cb) {
                    selectedRels.push(cb.dataset.rel);
                });

                payload.inputs[key] = {
                    class: select.value,
                    selectedColumns: selectedCols,
                    selectedRelationships: selectedRels,
                };
            });

            // Regular inputs
            content.querySelectorAll('.genr-input').forEach(function(el) {
                var key = el.dataset.key;
                if (!key) return;
                if (el.type === 'checkbox') {
                    payload.inputs[key] = el.checked;
                } else {
                    payload.inputs[key] = el.value;
                }
            });

            // schemaColumns multi-select
            var colsByKey = {};
            content.querySelectorAll('.genr-cols-check:checked').forEach(function(cb) {
                var key = cb.dataset.key;
                if (!colsByKey[key]) colsByKey[key] = [];
                colsByKey[key].push(cb.dataset.col);
            });
            Object.keys(colsByKey).forEach(function(key) {
                payload.inputs[key] = colsByKey[key];
            });

            return payload;
        }

        function genPreview(generatorDef) {
            var payload = genBuildPayload(generatorDef);

            fetch('/_schema-craft/api/generators/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify(payload),
            })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }
                    showFilePreviewModal(data.files, 'Run Generator', function() {
                        genRun(generatorDef);
                    });
                })
                .catch(function(e) { showToast('Preview error: ' + e.message, 'error'); });
        }

        function genRun(generatorDef) {
            var payload = genBuildPayload(generatorDef);
            payload.force = false;

            fetch('/_schema-craft/api/generators/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify(payload),
            })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Generation failed.', 'error'); return; }
                    showToast(data.message || 'Files generated.', 'success');
                })
                .catch(function(e) { showToast('Generation error: ' + e.message, 'error'); });
        }

        // ── Docs Tab ──────────────────────────────────────
        var docsInitialized = false;
        var docsDocuments = null; // array of { name, slug, sections: [{title, slug, content}] }
        var docsSearchTerm = '';
        var docsSearchTimeout = null;

        function initDocsTab() {
            if (docsInitialized) return;
            docsInitialized = true;

            var section = document.getElementById('docs-tab');
            section.innerHTML =
                '<div class="docs-sidebar">' +
                    '<div class="docs-search">' +
                        '<input type="search" id="docs-search-input" placeholder="Search documentation...">' +
                    '</div>' +
                    '<div class="docs-toc-count" id="docs-toc-count"></div>' +
                    '<ul class="docs-toc-list" id="docs-toc-list"></ul>' +
                '</div>' +
                '<div class="docs-content" id="docs-content">' +
                    '<div class="docs-empty">Loading documentation...</div>' +
                '</div>';

            document.getElementById('docs-search-input').addEventListener('input', function(e) {
                clearTimeout(docsSearchTimeout);
                docsSearchTimeout = setTimeout(function() {
                    docsSearchTerm = e.target.value.trim().toLowerCase();
                    renderDocsToc();
                    renderDocsContent();
                }, 200);
            });

            document.getElementById('docs-content').addEventListener('scroll', docsTrackScroll);

            loadDocsData();
        }

        function loadDocsData() {
            fetch('/_schema-craft/api/docs')
                .then(handleResponse)
                .then(function(data) {
                    docsDocuments = data.documents || [];
                    renderDocsToc();
                    renderDocsContent();
                })
                .catch(function(e) {
                    document.getElementById('docs-content').innerHTML =
                        '<div class="docs-empty">Failed to load documentation: ' + escapeHtml(e.message) + '</div>';
                });
        }

        /** Build a flat list of all sections across all documents, with doc context. */
        function docsAllSections() {
            if (!docsDocuments) return [];
            var all = [];
            docsDocuments.forEach(function(doc) {
                doc.sections.forEach(function(s) {
                    all.push({
                        docName: doc.name,
                        docSlug: doc.slug,
                        title: s.title,
                        slug: doc.slug + '--' + s.slug,
                        content: s.content
                    });
                });
            });
            return all;
        }

        /** Filter documents and their sections by search term. Returns filtered doc array. */
        function docsFilteredDocuments() {
            if (!docsDocuments) return [];
            if (!docsSearchTerm) return docsDocuments;

            var filtered = [];
            docsDocuments.forEach(function(doc) {
                var matchingSections = doc.sections.filter(function(s) {
                    return s.title.toLowerCase().indexOf(docsSearchTerm) !== -1 ||
                           s.content.toLowerCase().indexOf(docsSearchTerm) !== -1;
                });
                if (matchingSections.length > 0) {
                    filtered.push({
                        name: doc.name,
                        slug: doc.slug,
                        sections: matchingSections
                    });
                }
            });
            return filtered;
        }

        function renderDocsToc() {
            var list = document.getElementById('docs-toc-list');
            var countEl = document.getElementById('docs-toc-count');
            var filteredDocs = docsFilteredDocuments();

            if (!docsDocuments) {
                list.innerHTML = '';
                countEl.textContent = '';
                return;
            }

            var allSections = docsAllSections();
            var filteredTotal = 0;
            filteredDocs.forEach(function(d) { filteredTotal += d.sections.length; });

            if (docsSearchTerm) {
                countEl.textContent = filteredTotal + ' of ' + allSections.length + ' sections';
            } else {
                countEl.textContent = allSections.length + ' sections';
            }

            var html = '';
            filteredDocs.forEach(function(doc) {
                html += '<li class="docs-toc-group" data-doc-slug="' + escapeAttr(doc.slug) + '">';
                html += '<div class="docs-toc-group-header">' +
                    '<span class="docs-toc-chevron">&#9660;</span> ' +
                    escapeHtml(doc.name) +
                    '</div>';
                html += '<ul class="docs-toc-group-items">';
                doc.sections.forEach(function(s) {
                    var fullSlug = doc.slug + '--' + s.slug;
                    html += '<li class="docs-toc-item" data-slug="' + escapeAttr(fullSlug) + '">' +
                        escapeHtml(s.title) + '</li>';
                });
                html += '</ul></li>';
            });
            list.innerHTML = html;

            // Group header click → toggle collapse
            list.querySelectorAll('.docs-toc-group-header').forEach(function(header) {
                header.addEventListener('click', function() {
                    header.parentElement.classList.toggle('collapsed');
                });
            });

            // Section item click → scroll to section
            list.querySelectorAll('.docs-toc-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    var slug = item.dataset.slug;
                    var target = document.getElementById('doc-' + slug);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        }

        function renderDocsContent() {
            var container = document.getElementById('docs-content');
            var filteredDocs = docsFilteredDocuments();

            if (!docsDocuments) {
                container.innerHTML = '<div class="docs-empty">Loading documentation...</div>';
                return;
            }

            if (filteredDocs.length === 0) {
                container.innerHTML = '<div class="docs-empty">No sections match &ldquo;' +
                    escapeHtml(docsSearchTerm) + '&rdquo;</div>';
                return;
            }

            if (typeof marked === 'undefined') {
                container.innerHTML = '<div class="docs-empty">Documentation requires an internet connection for markdown rendering.<br><br>The <code>marked.js</code> library could not be loaded from CDN.</div>';
                return;
            }

            marked.setOptions({ gfm: true, breaks: false });

            var html = '';
            filteredDocs.forEach(function(doc) {
                html += '<div class="docs-doc-divider">';
                html += '<div class="docs-article">';
                doc.sections.forEach(function(s) {
                    var fullSlug = doc.slug + '--' + s.slug;
                    html += '<div class="docs-section" id="doc-' + escapeAttr(fullSlug) + '">';
                    html += marked.parse(s.content);
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            });

            container.innerHTML = html;

            // Add copy buttons to code blocks
            container.querySelectorAll('pre').forEach(function(pre) {
                var btn = document.createElement('button');
                btn.className = 'docs-copy-btn';
                btn.textContent = 'Copy';
                btn.addEventListener('click', function() {
                    var code = pre.querySelector('code');
                    if (code) {
                        navigator.clipboard.writeText(code.textContent).then(function() {
                            btn.textContent = 'Copied!';
                            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
                        });
                    }
                });
                pre.appendChild(btn);
            });

            if (docsSearchTerm) {
                docsHighlightMatches(container, docsSearchTerm);
            }
        }

        function docsHighlightMatches(root, term) {
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            var nodesToReplace = [];

            while (walker.nextNode()) {
                var node = walker.currentNode;
                var parent = node.parentElement;
                if (parent && (parent.tagName === 'CODE' || parent.tagName === 'PRE' ||
                    parent.classList.contains('docs-copy-btn'))) {
                    continue;
                }
                var idx = node.textContent.toLowerCase().indexOf(term);
                if (idx !== -1) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(function(node) {
                var text = node.textContent;
                var lowerText = text.toLowerCase();
                var frag = document.createDocumentFragment();
                var lastIdx = 0;
                var idx = lowerText.indexOf(term, lastIdx);

                while (idx !== -1) {
                    if (idx > lastIdx) {
                        frag.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
                    }
                    var mark = document.createElement('mark');
                    mark.className = 'docs-highlight';
                    mark.textContent = text.substring(idx, idx + term.length);
                    frag.appendChild(mark);
                    lastIdx = idx + term.length;
                    idx = lowerText.indexOf(term, lastIdx);
                }

                if (lastIdx < text.length) {
                    frag.appendChild(document.createTextNode(text.substring(lastIdx)));
                }

                node.parentNode.replaceChild(frag, node);
            });
        }

        function docsTrackScroll() {
            var container = document.getElementById('docs-content');
            var sections = container.querySelectorAll('.docs-section');
            var tocItems = document.querySelectorAll('.docs-toc-item');
            var scrollTop = container.scrollTop;
            var activeSlug = null;

            sections.forEach(function(sec) {
                if (sec.offsetTop - container.offsetTop <= scrollTop + 80) {
                    activeSlug = sec.id.replace('doc-', '');
                }
            });

            tocItems.forEach(function(item) {
                item.classList.toggle('active', item.dataset.slug === activeSlug);
            });
        }

        // ── Helpers ────────────────────────────────────────
        function shortName(fqcn) { return fqcn.split('\\').pop(); }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;');
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
