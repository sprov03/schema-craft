                });

                unassignedHtml =
                    '<div class="gen-import-group docs-group" data-docs-group="' + unassignedIdx + '">' +
                        '<div class="gen-import-group-header" data-docs-toggle="' + unassignedIdx + '">' +
                            '<span class="gen-import-group-toggle open">&#9654;</span>' +
                            '<span class="gen-import-group-name" style="color:var(--text-muted);">Other Routes</span>' +
                            '<span class="gen-import-group-count">' + data.unassigned.length + ' endpoint' + (data.unassigned.length !== 1 ? 's' : '') + '</span>' +
                        '</div>' +
                        '<div class="gen-import-group-body open" data-docs-body="' + unassignedIdx + '">' +
                            uEndpointsHtml +
                        '</div>' +
                    '</div>';
            }

            var groupCount = data.groups.length + (data.unassigned && data.unassigned.length > 0 ? 1 : 0);

            content.innerHTML =
                '<div class="gen-import">' +
                    '<div class="gen-import-title">API Documentation</div>' +
                    '<div class="gen-import-subtitle">' + totalEndpoints + ' registered endpoint' + (totalEndpoints !== 1 ? 's' : '') + ' across ' +
                        groupCount + ' group' + (groupCount !== 1 ? 's' : '') + ' in the <strong>' + escapeHtml(data.apiName) + '</strong> API.' +
                        (data.routeFile ? ' Route file: <code>' + escapeHtml(data.routeFile) + '</code>' : '') + '</div>' +
                    '<div style="margin-bottom:16px;">' +
                        '<input type="search" id="docs-search" placeholder="Search endpoints..." style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);font-size:13px;outline:none;">' +
                    '</div>' +
                    groupsHtml +
                    unassignedHtml +
                '</div>';

            // Toggle group expand/collapse
            content.querySelectorAll('[data-docs-toggle]').forEach(function(header) {
                header.addEventListener('click', function() {
                    var idx = header.dataset.docsToggle;
                    var body = content.querySelector('[data-docs-body="' + idx + '"]');
                    var toggle = header.querySelector('.gen-import-group-toggle');
                    body.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
            });

            // Search filter
            document.getElementById('docs-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                content.querySelectorAll('.docs-group').forEach(function(group) {
                    var groupName = group.querySelector('.gen-import-group-name').textContent.toLowerCase();
                    var groupMatch = !query || groupName.indexOf(query) !== -1;

                    var hasVisible = false;
                    group.querySelectorAll('.docs-endpoint-row').forEach(function(row) {
                        var path = row.querySelector('.docs-endpoint-path').textContent.toLowerCase();
                        var label = row.querySelector('.docs-endpoint-label').textContent.toLowerCase();
                        var method = row.querySelector('.gen-import-action-method').textContent.toLowerCase();
                        var visible = groupMatch || path.indexOf(query) !== -1 || label.indexOf(query) !== -1 || method.indexOf(query) !== -1;
                        row.style.display = visible ? '' : 'none';
                        if (visible) hasVisible = true;
                    });

                    group.style.display = hasVisible ? '' : 'none';
                });
            });

            // Click endpoint to open detail modal
            content.querySelectorAll('.docs-endpoint-row').forEach(function(row) {
                row.addEventListener('click', function() {
                    var ep = JSON.parse(row.dataset.docsEp);
                    var modelName = row.dataset.docsModel;
                    // Find responseFields from the group data
                    var responseFields = null;
                    if (modelName && docsData && docsData.groups) {
                        var group = docsData.groups.find(function(g) { return g.modelName === modelName; });
                        if (group) responseFields = group.responseFields;
                    }
                    showEndpointDetailModal(ep, modelName, responseFields);
                });
            });
        }

        function showEndpointDetailModal(ep, modelName, responseFields) {
            var methods = ep.method.split('|');
            var primaryMethod = methods[0];
            var methodLabel = methods.join(' | ');
            var isAction = ep.source === 'action';

            // Build request section
            var requestHtml = '';

            // For action endpoints with detailed parameters
            if (isAction && ep.parameters && ep.parameters.length > 0) {
                var flatParams = ep.parameters.filter(function(p) { return !p.isNestedRelationship; });
                var nestedParams = ep.parameters.filter(function(p) { return p.isNestedRelationship; });

                if (flatParams.length > 0) {
                    requestHtml += '<div class="ep-section">' +
                        '<div class="ep-section-title">Request Body <span class="ep-section-badge body">' + flatParams.length + ' field' + (flatParams.length !== 1 ? 's' : '') + '</span></div>' +
                        '<table class="ep-field-table"><thead><tr><th>Field</th><th>Type</th><th>Rules</th></tr></thead><tbody>';

                    flatParams.forEach(function(param) {
                        var fieldName = param.foreignKeyColumn || param.columnName || param.name;
                        var rules = ep.rules && ep.rules[fieldName] ? ep.rules[fieldName] : '';
                        var rulesHtml = buildRulesHtml(rules);

                        var typeDisplay = param.columnType || param.type;
                        if (param.isModel) {
                            typeDisplay = 'FK \u2192 ' + param.type;
                        }

                        requestHtml += '<tr>' +
                            '<td class="ep-field-name">' + escapeHtml(fieldName) + '</td>' +
                            '<td class="ep-field-type">' + escapeHtml(typeDisplay) + '</td>' +
                            '<td class="ep-field-rules">' + (rulesHtml || '<span style="color:var(--text-muted);font-style:italic;">\u2014</span>') + '</td>' +
                        '</tr>';
                    });

                    requestHtml += '</tbody></table></div>';
                }

                // Nested relationship parameters
                nestedParams.forEach(function(param) {
                    var relName = param.name;
                    requestHtml += '<div class="ep-section">' +
                        '<div class="ep-section-title">Nested: ' + escapeHtml(relName) + ' <span class="ep-section-badge relations">relationship</span></div>';

                    var nestedRules = {};
                    if (ep.rules) {
                        Object.keys(ep.rules).forEach(function(key) {
                            if (key.indexOf(relName + '.') === 0 || key.indexOf(relName + '.*') === 0) {
                                nestedRules[key] = ep.rules[key];
                            }
                        });
                    }

                    if (Object.keys(nestedRules).length > 0) {
                        requestHtml += '<table class="ep-field-table"><thead><tr><th>Field</th><th>Rules</th></tr></thead><tbody>';
                        Object.keys(nestedRules).forEach(function(key) {
                            requestHtml += '<tr>' +
                                '<td class="ep-field-name">' + escapeHtml(key) + '</td>' +
                                '<td class="ep-field-rules">' + buildRulesHtml(nestedRules[key]) + '</td>' +
                            '</tr>';
                        });
                        requestHtml += '</tbody></table>';
                    } else {
                        requestHtml += '<div class="ep-no-body">No nested rules defined.</div>';
                    }
                    requestHtml += '</div>';
                });
            } else if (ep.rules && Object.keys(ep.rules).length > 0) {
                // For controller/other endpoints with rules (from FormRequest)
                var ruleKeys = Object.keys(ep.rules);
                requestHtml += '<div class="ep-section">' +
                    '<div class="ep-section-title">Validation Rules <span class="ep-section-badge body">' + ruleKeys.length + ' field' + (ruleKeys.length !== 1 ? 's' : '') + '</span>' +
                    (ep.formRequest ? ' <span class="ep-section-badge meta" style="margin-left:4px;">' + escapeHtml(ep.formRequest.split('\\').pop()) + '</span>' : '') +
                    '</div>' +
                    '<table class="ep-field-table"><thead><tr><th>Field</th><th>Rules</th></tr></thead><tbody>';

                ruleKeys.forEach(function(key) {
                    requestHtml += '<tr>' +
                        '<td class="ep-field-name">' + escapeHtml(key) + '</td>' +
                        '<td class="ep-field-rules">' + buildRulesHtml(ep.rules[key]) + '</td>' +
                    '</tr>';
                });

                requestHtml += '</tbody></table></div>';
            }

            if (!requestHtml) {
                requestHtml = '<div class="ep-section"><div class="ep-no-body">No request body or validation rules detected.</div></div>';
            }

            // Build relationships section
            var relsHtml = '';
            if (ep.relationships && ep.relationships.length > 0) {
                relsHtml = '<div class="ep-section">' +
                    '<div class="ep-section-title">Eager-Loaded Relationships <span class="ep-section-badge relations">' + ep.relationships.length + '</span></div>' +
                    '<table class="ep-field-table"><thead><tr><th>Relationship</th><th>Type</th><th>Related Model</th></tr></thead><tbody>';

                ep.relationships.forEach(function(rel) {
                    relsHtml += '<tr>' +
                        '<td class="ep-field-name">' + escapeHtml(rel.name) + (rel.isCollection ? '[]' : '') + '</td>' +
                        '<td class="ep-field-type">' + escapeHtml(rel.type) + '</td>' +
                        '<td>' + escapeHtml(rel.relatedModel) + '</td>' +
                    '</tr>';
                });

                relsHtml += '</tbody></table></div>';
            }

            // Build response section
            var responseHtml = '';

            if (primaryMethod.toUpperCase() === 'DELETE') {
                responseHtml += '<div class="ep-section">' +
                    '<div class="ep-section-title">Response <span class="ep-section-badge meta">info</span></div>' +
                    '<div style="font-size:12px;color:var(--text-secondary);"><code>204 No Content</code> \u2014 Empty response on success.</div>' +
                '</div>';
            } else if (responseFields && (responseFields.columns.length > 0 || responseFields.relationships.length > 0)) {
                // Resource response fields from schema scan
                responseHtml += '<div class="ep-section">' +
                    '<div class="ep-section-title">Response Body ' +
                        '<span class="ep-section-badge fields">' + escapeHtml(modelName) + 'Resource</span>' +
                    '</div>';

                if (responseFields.columns.length > 0) {
                    responseHtml += '<table class="ep-field-table"><thead><tr><th>Field</th><th>Type</th><th>Info</th></tr></thead><tbody>';

                    responseFields.columns.forEach(function(col) {
                        var flags = '';
                        if (col.primary) flags += '<span class="ep-field-flag pk">PK</span>';
                        if (col.autoIncrement) flags += '<span class="ep-field-flag ai">AI</span>';
                        if (col.unique) flags += '<span class="ep-field-flag unique">unique</span>';
                        if (col.nullable) flags += '<span class="ep-rule-tag nullable">nullable</span>';
                        if (col.unsigned) flags += '<span class="ep-field-flag unsigned">unsigned</span>';
                        if (col.cast) flags += '<span class="ep-rule-tag">' + escapeHtml(col.cast) + '</span>';
                        if (col.managed) flags += '<span class="ep-field-flag" style="background:var(--bg-tertiary);color:var(--text-muted);">managed</span>';
                        if (col.length) flags += '<span class="ep-field-flag" style="background:var(--bg-tertiary);color:var(--text-muted);">len:' + col.length + '</span>';
                        if (col.hasOwnProperty('default') && col['default'] !== null && col['default'] !== undefined) {
                            flags += '<span class="ep-field-flag" style="background:var(--bg-tertiary);color:var(--text-muted);">default: ' + escapeHtml(String(col['default'])) + '</span>';
                        }

                        responseHtml += '<tr>' +
                            '<td class="ep-field-name">' + escapeHtml(col.name) + '</td>' +
                            '<td class="ep-field-type">' + escapeHtml(col.type) + '</td>' +
                            '<td class="ep-field-flags" style="display:flex;gap:4px;flex-wrap:wrap;">' + (flags || '<span style="color:var(--text-muted);">\u2014</span>') + '</td>' +
                        '</tr>';
                    });

                    responseHtml += '</tbody></table>';
                }

                responseHtml += '</div>';

                // Relationships in response (conditional via whenLoaded)
                if (responseFields.relationships.length > 0) {
                    responseHtml += '<div class="ep-section">' +
                        '<div class="ep-section-title">Included Relationships <span class="ep-section-badge relations">' + responseFields.relationships.length + '</span> ' +
                            '<span style="font-size:10px;color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;">via whenLoaded()</span>' +
                        '</div>' +
                        '<table class="ep-field-table"><thead><tr><th>Name</th><th>Type</th><th>Related Model</th><th>Info</th></tr></thead><tbody>';

                    responseFields.relationships.forEach(function(rel) {
                        var info = rel.isCollection ? '<span class="ep-rule-tag">collection</span>' : '<span class="ep-rule-tag">single</span>';
                        if (rel.pivotColumns && rel.pivotColumns.length > 0) {
                            info += '<span class="ep-rule-tag" style="background:var(--warning-dim);color:var(--warning);">pivot: ' + escapeHtml(rel.pivotColumns.join(', ')) + '</span>';
                        }

                        responseHtml += '<tr>' +
                            '<td class="ep-field-name">' + escapeHtml(rel.name) + '</td>' +
                            '<td class="ep-field-type">' + escapeHtml(rel.type) + '</td>' +
                            '<td>' + escapeHtml(rel.relatedModel) + 'Resource</td>' +
                            '<td style="display:flex;gap:4px;flex-wrap:wrap;">' + info + '</td>' +
                        '</tr>';
                    });

                    responseHtml += '</tbody></table></div>';
                }
            } else if (modelName) {
                responseHtml += '<div class="ep-section">' +
                    '<div class="ep-section-title">Response <span class="ep-section-badge meta">info</span></div>' +
                    '<div style="font-size:12px;color:var(--text-secondary);">Returns the ' + escapeHtml(modelName) + ' model wrapped in a <code>' + escapeHtml(modelName) + 'Resource</code>.</div>' +
                '</div>';
            } else {
                responseHtml += '<div class="ep-section">' +
                    '<div class="ep-section-title">Response <span class="ep-section-badge meta">info</span></div>' +
                    '<div style="font-size:12px;color:var(--text-secondary);">Response format depends on the route handler implementation.</div>' +
                '</div>';
            }

            // Build details section
            var metaRows = '';
            metaRows += '<tr><td class="ep-field-name">Source</td><td style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(ep.source) + '</td></tr>';

            if (ep.actionClass) {
                metaRows += '<tr><td class="ep-field-name">Action Class</td><td style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);word-break:break-all;">' + escapeHtml(ep.actionClass) + '</td></tr>';
            }
            if (ep.serviceMethod) {
                metaRows += '<tr><td class="ep-field-name">Service Method</td><td style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">' + escapeHtml(ep.serviceMethod) + '</td></tr>';
            }
            if (ep.formRequest) {
                metaRows += '<tr><td class="ep-field-name">Form Request</td><td style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);word-break:break-all;">' + escapeHtml(ep.formRequest) + '</td></tr>';
            }
            metaRows += '<tr><td class="ep-field-name">Route Path</td><td style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">' + escapeHtml(ep.path) + '</td></tr>';
            metaRows += '<tr><td class="ep-field-name">Type</td><td style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(ep.type) + '</td></tr>';

            var metaHtml = '<div class="ep-section">' +
                '<div class="ep-section-title">Details <span class="ep-section-badge meta">meta</span></div>' +
                '<table class="ep-field-table"><tbody>' + metaRows + '</tbody></table></div>';

            // Tab state
            var activeTab = 'request';

            function renderTabContent(tab) {
                if (tab === 'request') return requestHtml;
                if (tab === 'response') return responseHtml + relsHtml;
                if (tab === 'details') return metaHtml;
                return '';
            }

            // Build and insert modal
            var overlay = document.createElement('div');
            overlay.className = 'ep-overlay';
            overlay.innerHTML =
                '<div class="ep-modal" style="max-width:760px;">' +
                    '<div class="ep-header">' +
                        '<span class="ep-header-method ' + primaryMethod.toLowerCase() + '">' + escapeHtml(methodLabel) + '</span>' +
                        '<span class="ep-header-path">' + escapeHtml(ep.path) + '</span>' +
                        '<button class="ep-header-close" id="ep-close">&times;</button>' +
                    '</div>' +
                    (ep.description ? '<div style="padding:8px 20px 0;font-size:12px;color:var(--text-secondary);font-style:italic;">' + escapeHtml(ep.description) + '</div>' : '') +
                    '<div class="ep-tabs">' +
                        '<button class="ep-tab active" data-ep-tab="request">Request</button>' +
                        '<button class="ep-tab" data-ep-tab="response">Response</button>' +
                        '<button class="ep-tab" data-ep-tab="details">Details</button>' +
                    '</div>' +
                    '<div class="ep-body" id="ep-tab-content">' + renderTabContent('request') + '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            // Tab switching
            overlay.querySelectorAll('.ep-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    overlay.querySelectorAll('.ep-tab').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    activeTab = tab.dataset.epTab;
                    overlay.querySelector('#ep-tab-content').innerHTML = renderTabContent(activeTab);
                });
            });

            // Close modal
            overlay.querySelector('#ep-close').addEventListener('click', function() {
                overlay.remove();
            });
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.remove();
            });
        }

        function buildRulesHtml(rules) {
            var rulesArr = typeof rules === 'string' ? rules.split('|') : (Array.isArray(rules) ? rules : []);
            var html = '';
            rulesArr.forEach(function(rule) {
                var ruleStr = typeof rule === 'string' ? rule : (rule.toString ? rule.toString() : '');
                if (!ruleStr) return;
                var cssClass = 'ep-rule-tag';
                if (ruleStr === 'required') cssClass += ' required';
                if (ruleStr === 'nullable') cssClass += ' nullable';
                html += '<span class="' + cssClass + '">' + escapeHtml(ruleStr) + '</span>';
            });
            return html;
        }

        // ── Resources View ──────────────────────────────
        var resourcesData = null;

        function showResourcesView() {
            var content = document.getElementById('gen-content');
            content.innerHTML = '<div class="gen-empty-state">Loading resources...</div>';

            fetch('/_schema-craft/api/available-actions?api=' + encodeURIComponent(genSelectedApi))
                .then(handleResponse)
                .then(function(data) {
                    resourcesData = data;
                    renderResourcesView();
                })
                .catch(function(e) {
                    content.innerHTML = '<div class="gen-empty-state">Failed to load: ' + escapeHtml(e.message) + '</div>';
                });
        }

        function renderResourcesView() {
            var data = resourcesData;
            var content = document.getElementById('gen-content');

            if (!data.groups || data.groups.length === 0) {
                content.innerHTML = '<div class="gen-empty-state">No schemas found.</div>';
                return;
            }

            var listHtml = '';

            data.groups.forEach(function(group, idx) {
                var resourceCount = (group.resources || []).length;
                var actionCount = group.actions.length;

                listHtml +=
                    '<div class="gen-import-group" data-res-idx="' + idx + '">' +
                        '<div class="gen-import-group-header" data-res-toggle="' + idx + '">' +
                            '<span class="gen-import-group-toggle">&#9654;</span>' +
                            '<span class="gen-import-group-name">' + escapeHtml(group.modelName) + '</span>' +
                            '<span class="gen-import-group-count">' +
                                resourceCount + ' resource' + (resourceCount !== 1 ? 's' : '') +
                                (actionCount > 0 ? ' &bull; ' + actionCount + ' action' + (actionCount !== 1 ? 's' : '') : '') +
                            '</span>' +
                        '</div>' +
                        '<div class="gen-import-group-body" data-res-body="' + idx + '">' +
                            buildSchemaResourcesHtml(group, idx, data) +
                        '</div>' +
                    '</div>';
            });

            content.innerHTML =
                '<div class="gen-import">' +
                    '<div class="gen-import-title">Resources</div>' +
                    '<div class="gen-import-subtitle">All schemas for the <strong>' + escapeHtml(data.apiName) + '</strong> API, grouped with their resources. Resources are typed classes — the class definition is the source of truth.</div>' +
                    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
                        '<input type="search" id="gen-res-search" placeholder="Filter schemas..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);font-size:13px;outline:none;">' +
                    '</div>' +
                    listHtml +
                '</div>';

            // Toggle expand/collapse
            content.querySelectorAll('[data-res-toggle]').forEach(function(header) {
                header.addEventListener('click', function(e) {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                    var idx = header.dataset.resToggle;
                    var body = content.querySelector('[data-res-body="' + idx + '"]');
                    var toggle = header.querySelector('.gen-import-group-toggle');
                    body.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
            });

            // Resource card expand/collapse
            content.querySelectorAll('[data-resource-toggle]').forEach(function(card) {
                card.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    var key = card.dataset.resourceToggle;
                    var body = content.querySelector('[data-resource-body="' + key + '"]');
                    var toggle = card.querySelector('.res-card-toggle');
                    if (body) {
                        body.classList.toggle('open');
                        if (toggle) toggle.classList.toggle('open');
                    }
                });
            });

            // Search filter
            document.getElementById('gen-res-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                content.querySelectorAll('.gen-import-group[data-res-idx]').forEach(function(group) {
                    var name = group.querySelector('.gen-import-group-name');
                    group.style.display = (!query || (name && name.textContent.toLowerCase().indexOf(query) !== -1)) ? '' : 'none';
                });
            });

            // New Resource buttons
            content.querySelectorAll('[data-new-resource-schema]').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.dataset.newResourceSchema, 10);
                    var group = resourcesData.groups[idx];
                    openCreateResourceOverlay(group, idx, data);
                });
            });
        }

        function buildSchemaResourcesHtml(group, gIdx, data) {
            var html = '<div style="padding:8px 12px 12px 12px;">';

            // Existing resource cards
            var resources = group.resources || [];
            resources.forEach(function(res, rIdx) {
                var key = gIdx + '-' + rIdx;
                var isManual = res.isManual;

                var actionBadge = '';
                if (res.action) {
                    actionBadge = '<span class="gen-import-action-imported-badge" style="background:var(--success-dim);color:var(--success);">&#x25CF; ' + escapeHtml(res.action.split('\\').pop()) + '</span>';
                } else if (!isManual) {
                    actionBadge = '<span class="gen-import-action-imported-badge" style="background:var(--bg-secondary);color:var(--text-muted);">&#x25CB; no action</span>';
                }

                var manualBadge = isManual
                    ? '<span class="gen-import-action-imported-badge" style="background:var(--warning-dim);color:var(--warning);">&#9888; manual</span>'
                    : '';

                html +=
                    '<div style="border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden;">' +
                        '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;background:var(--bg-secondary);" data-resource-toggle="' + key + '">' +
                            '<span class="gen-import-group-toggle res-card-toggle" style="font-size:10px;">&#9654;</span>' +
                            '<span style="font-weight:500;font-size:13px;">' + escapeHtml(res.name) + '</span>' +
                            actionBadge + manualBadge +
                        '</div>' +
                        '<div class="gen-import-group-body" data-resource-body="' + key + '">' +
                            buildResourceDetailHtml(res, isManual) +
                        '</div>' +
                    '</div>';
            });

            // "+ New Resource" button
            html +=
                '<button class="sc-btn" data-new-resource-schema="' + gIdx + '" style="margin-top:4px;">' +
                    '+ New Resource' +
                '</button>';

            html += '</div>';
            return html;
        }

        function buildResourceDetailHtml(res, isManual) {
            if (isManual) {
                return '<div style="padding:12px;">' +
                    '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">This resource extends JsonResource directly. Edit the file to modify it.</div>' +
                    '<pre style="font-size:11px;background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:10px;overflow:auto;max-height:300px;margin:0;">' +
                        escapeHtml(res.fileContents || '') +
                    '</pre>' +
                '</div>';
            }

            var html = '<div style="padding:12px;">';

            if (res.properties && res.properties.length > 0) {
                html += '<div class="gen-import-resource-title" style="margin-bottom:6px;">Properties</div>';
                html += '<div class="gen-import-field-grid" style="margin-bottom:12px;">';
                res.properties.forEach(function(prop) {
                    html += '<div class="gen-import-field-item" style="cursor:default;">' +
                        '<span style="color:var(--accent);font-family:monospace;font-size:11px;">' + escapeHtml(prop.type) + '</span>' +
                        '<span style="margin-left:6px;">' + escapeHtml(prop.name) + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            if (res.relationships && res.relationships.length > 0) {
                html += '<div class="gen-import-resource-title" style="margin-bottom:6px;">Relationships</div>';
                html += '<div class="gen-import-field-grid" style="margin-bottom:12px;">';
                res.relationships.forEach(function(rel) {
                    html += '<div class="gen-import-field-item" style="cursor:default;">' +
                        '<span class="gen-import-field-type">' + escapeHtml(rel.type) + '</span>' +
                        '<span style="margin-left:6px;">' + escapeHtml(rel.name) + '</span>' +
                        '<span style="margin-left:4px;color:var(--text-muted);font-size:11px;">\u2192 ' + escapeHtml(rel.resource ? rel.resource.split('\\').pop() : '') + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            if (res.computed && res.computed.length > 0) {
                html += '<div class="gen-import-resource-title" style="margin-bottom:6px;">Computed</div>';
                html += '<div class="gen-import-field-grid" style="margin-bottom:12px;">';
                res.computed.forEach(function(method) {
                    html += '<div class="gen-import-field-item" style="cursor:default;">' +
                        '<span style="color:var(--accent);font-family:monospace;font-size:11px;">#[Computed]</span>' +
                        '<span style="margin-left:6px;">' + escapeHtml(method) + '()</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            if (!res.properties.length && !res.relationships.length && !res.computed.length) {
                html += '<div style="font-size:12px;color:var(--text-muted);">No properties defined yet.</div>';
            }

            html += '</div>';
            return html;
        }

        // ── Create Resource Overlay ──────────────────────
        function openCreateResourceOverlay(group, gIdx, data) {
            var overlay = document.createElement('div');
            overlay.className = 'act-overlay-backdrop';
            overlay.innerHTML =
                '<div class="act-overlay-panel" style="max-width:560px;width:100%;">' +
                    '<div class="act-overlay-header">' +
                        '<span class="act-overlay-title">New Resource &mdash; ' + escapeHtml(group.modelName) + '</span>' +
                        '<button class="act-overlay-close" id="res-overlay-close">&times;</button>' +
                    '</div>' +
                    '<div class="act-overlay-body" style="padding:20px;">' +
                        '<div style="margin-bottom:14px;">' +
                            '<label style="display:block;font-size:12px;font-weight:600;margin-bottom:5px;">Resource Name</label>' +
                            '<input type="text" id="res-overlay-name" placeholder="e.g. ' + escapeAttr(group.modelName) + 'FullResource" ' +
                                'style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;background:var(--bg-primary);color:var(--text-primary);font-size:13px;box-sizing:border-box;" />' +
                        '</div>' +
                        '<div style="margin-bottom:14px;">' +
                            '<div class="gen-import-resource-title" style="margin-bottom:8px;">Columns</div>' +
                            '<div class="gen-import-field-grid" id="res-overlay-cols">' +
                                buildResOverlayColumns(group) +
                            '</div>' +
                        '</div>' +
                        '<div style="margin-bottom:14px;">' +
                            '<div class="gen-import-resource-title" style="margin-bottom:8px;">Relationships</div>' +
                            '<div id="res-overlay-rels">' +
                                buildResOverlayRelationships(group, data) +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="act-overlay-footer">' +
                        '<button class="sc-btn" id="res-overlay-cancel">Cancel</button>' +
                        '<button class="sc-btn primary" id="res-overlay-save">Create Resource</button>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            overlay.querySelector('#res-overlay-close').addEventListener('click', function() { overlay.remove(); });
            overlay.querySelector('#res-overlay-cancel').addEventListener('click', function() { overlay.remove(); });

            overlay.querySelector('#res-overlay-save').addEventListener('click', function() {
                var nameInput = overlay.querySelector('#res-overlay-name');
                var name = nameInput.value.trim();

                if (!name || !name.endsWith('Resource')) {
                    showToast('Resource name must end with "Resource".', 'warning');
                    return;
                }

                var columns = [];
                overlay.querySelectorAll('.res-ov-col-cb:checked').forEach(function(cb) {
                    columns.push(cb.dataset.col);
                });

                var relationships = [];
                overlay.querySelectorAll('.res-ov-rel-cb:checked').forEach(function(cb) {
                    relationships.push(cb.dataset.rel);
                });

                var btn = overlay.querySelector('#res-overlay-save');
                btn.disabled = true;
                btn.textContent = 'Creating...';

                fetch('/_schema-craft/api/create-resource', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        api: genSelectedApi,
                        schema: group.schema,
                        resourceName: name,
                        columns: columns,
                        relationships: relationships,
                    }),
                })
                .then(handleResponse)
                .then(function(resp) {
                    if (resp.success) {
                        showToast(resp.message, 'success');
                        overlay.remove();
                        showResourcesView();
                    } else {
                        showToast(resp.message || 'Failed to create resource.', 'error');
                        btn.disabled = false;
                        btn.textContent = 'Create Resource';
                    }
                })
                .catch(function(e) {
                    showToast('Error: ' + e.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Resource';
                });
            });
        }

        function buildResOverlayColumns(group) {
            var html = '';
            (group.columns || []).forEach(function(col) {
                var isSystem = ['id', 'created_at', 'updated_at', 'deleted_at'].indexOf(col.name) !== -1;
                html +=
                    '<label class="gen-import-field-item">' +
                        '<input type="checkbox" class="res-ov-col-cb" data-col="' + escapeAttr(col.name) + '" ' +
                            (isSystem ? 'checked disabled' : 'checked') + '>' +
                        '<span>' + escapeHtml(col.name) + '</span>' +
                        '<span class="gen-import-field-type">' + escapeHtml(col.type) + '</span>' +
                    '</label>';
            });
            return html || '<span style="font-size:12px;color:var(--text-muted);">No columns found.</span>';
        }

        function buildResOverlayRelationships(group, data) {
            var html = '';
            (group.relationships || []).forEach(function(rel) {
                // Check if the related schema already has resources
                var relatedSchema = rel.relatedSchema;
                var relatedGroup = relatedSchema && data.groups
                    ? data.groups.find(function(g) { return g.schema === relatedSchema; })
                    : null;
                var relatedHasResources = relatedGroup && relatedGroup.resources && relatedGroup.resources.length > 0;

                var createChildBtn = '';
                if (relatedGroup && !relatedHasResources) {
                    createChildBtn = ' <button type="button" class="sc-btn" style="padding:2px 8px;font-size:11px;" ' +
                        'data-create-child-schema="' + escapeAttr(relatedSchema) + '" ' +
                        'data-create-child-model="' + escapeAttr(relatedGroup.modelName) + '">' +
                        '+ Create Resource' +
                        '</button>';
                }

                html +=
                    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
                        '<label class="gen-import-field-item" style="flex:1;margin:0;">' +
                            '<input type="checkbox" class="res-ov-rel-cb" data-rel="' + escapeAttr(rel.name) + '">' +
                            '<span>' + escapeHtml(rel.name) + '</span>' +
                            '<span class="gen-import-field-type">' + escapeHtml(rel.type) + ' \u2192 ' + escapeHtml(rel.relatedModel) + '</span>' +
                        '</label>' +
                        createChildBtn +
                    '</div>';
            });

            if (!html) {
                html = '<span style="font-size:12px;color:var(--text-muted);">No relationships found.</span>';
            }

            // Attach child creation handlers after insertion — done via event delegation below
            setTimeout(function() {
                document.querySelectorAll('[data-create-child-schema]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var childSchema = btn.dataset.createChildSchema;
                        var childModel = btn.dataset.createChildModel;
                        var childGroup = data.groups
                            ? data.groups.find(function(g) { return g.schema === childSchema; })
                            : null;
                        if (childGroup) {
                            openCreateResourceOverlay(childGroup, data.groups.indexOf(childGroup), data);
                        }
                    });
                });
            }, 50);

            return html;
        }

        // ── Import Actions View ────────────────────────
        var importActionsData = null;

        function showImportActionsView() {
            var content = document.getElementById('gen-content');
            content.innerHTML = '<div class="gen-empty-state">Loading actions...</div>';

            fetch('/_schema-craft/api/available-actions?api=' + encodeURIComponent(genSelectedApi))
                .then(handleResponse)
                .then(function(data) {
                    importActionsData = data;
                    renderImportActionsView();
                })
                .catch(function(e) {
                    content.innerHTML = '<div class="gen-empty-state">Failed to load: ' + escapeHtml(e.message) + '</div>';
                });
        }

        function renderImportActionsView() {
            var data = importActionsData;
            var content = document.getElementById('gen-content');

            // Show schemas that have actions (resources optional — can be created inline)
            var eligibleGroups = data.groups.filter(function(g) { return g.actions && g.actions.length > 0; });

            if (eligibleGroups.length === 0) {
                content.innerHTML =
                    '<div class="gen-import">' +
                        '<div class="gen-import-title">Import Actions</div>' +
                        '<div class="gen-import-subtitle">No schemas with Actions found. Create Actions first via the Actions tab.</div>' +
                    '</div>';
                return;
            }

            // Build flat action list grouped by schema
            var actionsHtml = '';
            var totalAvailable = 0;

            eligibleGroups.forEach(function(group, gIdx) {
                var unimported = group.actions.filter(function(a) { return !a.imported; });
                var imported = group.actions.filter(function(a) { return a.imported; });
                var resources = group.resources || [];

                if (group.actions.length === 0) return;

                // Resource dropdown
                var resourceDropdown = '';
                if (resources.length > 0) {
                    resourceDropdown = '<div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">' +
                        '<span style="font-size:12px;color:var(--text-muted);white-space:nowrap;">Use resource:</span>' +
                        '<select class="import-resource-select" data-import-group-idx="' + gIdx + '" data-schema="' + escapeAttr(group.schema) + '" ' +
                            'style="flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-primary);color:var(--text-primary);font-size:12px;">';
                    resources.forEach(function(res) {
                        resourceDropdown += '<option value="' + escapeAttr(res.class) + '">' + escapeHtml(res.name) + (res.action ? ' (wired)' : '') + '</option>';
                    });
                    resourceDropdown += '</select>' +
                        '<button type="button" class="sc-btn import-new-res-btn" data-import-group-idx="' + gIdx + '" style="white-space:nowrap;padding:3px 10px;font-size:11px;">+ New</button>' +
                    '</div>';
                } else {
                    resourceDropdown = '<div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">' +
                        '<span style="font-size:12px;color:var(--warning);">No resources yet — a default resource will be auto-generated on import.</span>' +
                        '<button type="button" class="sc-btn import-new-res-btn" data-import-group-idx="' + gIdx + '" style="white-space:nowrap;padding:3px 10px;font-size:11px;">+ Create Resource</button>' +
                    '</div>';
                }

                actionsHtml += '<div class="gen-import-group" data-import-group="' + gIdx + '">' +
                    '<div class="gen-import-group-header" data-import-toggle="' + gIdx + '">' +
                        '<input type="checkbox" class="import-group-select-all" data-import-group-idx="' + gIdx + '" ' +
                            (unimported.length === 0 ? 'disabled checked' : '') + ' ' +
                            'onclick="event.stopPropagation();">' +
                        '<span class="gen-import-group-toggle open">&#9654;</span>' +
                        '<span class="gen-import-group-name">' + escapeHtml(group.modelName) + '</span>' +
                        '<span class="gen-import-group-count">' +
                            unimported.length + ' available' +
                            (imported.length > 0 ? ', ' + imported.length + ' imported' : '') +
                        '</span>' +
                    '</div>' +
                    '<div class="gen-import-group-body open" data-import-body="' + gIdx + '">' +
                        resourceDropdown;

                group.actions.forEach(function(action, aIdx) {
                    var isImported = action.imported;
                    if (!isImported) totalAvailable++;

                    var relTags = '';
                    if (action.relationships && action.relationships.length > 0) {
                        action.relationships.forEach(function(rel) {
                            relTags += '<span class="gen-import-field-type" style="margin-left:4px;padding:1px 6px;background:var(--bg-tertiary);border-radius:3px;" title="' +
                                escapeAttr(rel.type + ' → ' + rel.relatedModel) + '">' +
                                escapeHtml(rel.name) + (rel.isCollection ? '[]' : '') +
                            '</span>';
                        });
                    }

                    actionsHtml +=
                        '<div class="gen-import-action-row' + (isImported ? ' imported' : '') + '">' +
                            '<input type="checkbox" class="import-action-cb" ' +
                                'data-import-group-idx="' + gIdx + '" ' +
                                'data-action-class="' + escapeAttr(action.class) + '" ' +
                                'data-schema="' + escapeAttr(group.schema) + '" ' +
                                (isImported ? 'disabled checked' : '') + '>' +
                            '<span class="gen-import-action-method ' + action.httpMethod.toLowerCase() + '">' +
                                escapeHtml(action.httpMethod.toUpperCase()) + '</span>' +
                            '<span class="gen-import-action-name">' + escapeHtml(action.shortName) + '</span>' +
                            relTags +
                            '<span class="gen-import-action-label">' + escapeHtml(action.label) + '</span>' +
                            (isImported ? '<span class="gen-import-action-imported-badge">Imported</span>' : '') +
                        '</div>';
                });

                actionsHtml += '</div></div>';
            });

            content.innerHTML =
                '<div class="gen-import">' +
                    '<div class="gen-import-title">Import Actions</div>' +
                    '<div class="gen-import-subtitle">Import Actions into the <strong>' + escapeHtml(data.apiName) + '</strong> API route file ' +
                        '<code>' + escapeHtml(data.routeFile) + '</code>. Select a resource for each schema using the dropdown.</div>' +
                    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
                        '<div style="flex:1;">' +
                            '<input type="search" id="gen-import-search" placeholder="Filter actions..." style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);font-size:13px;outline:none;">' +
                        '</div>' +
                        '<button class="sc-btn" id="gen-import-select-all">Select All</button>' +
                        '<button class="sc-btn" id="gen-import-deselect-all">Deselect All</button>' +
                    '</div>' +
                    actionsHtml +
                    '<div class="gen-import-footer">' +
                        '<span class="gen-import-selected-count" id="gen-import-count">0 actions selected</span>' +
                        '<button class="sc-btn primary" id="gen-import-btn" disabled>Import Selected Actions</button>' +
                    '</div>' +
                '</div>';

            // "+ New Resource" buttons in import view
            content.querySelectorAll('.import-new-res-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.dataset.importGroupIdx, 10);
                    var group = importActionsData.groups.find(function(g, i) {
                        var eligibles = importActionsData.groups.filter(function(g2) { return g2.actions && g2.actions.length > 0; });
                        return eligibles[idx] === g;
                    }) || eligibleGroups[idx];
                    if (group) {
                        openCreateResourceOverlay(group, importActionsData.groups.indexOf(group), importActionsData);
                    }
                });
            });

            // Toggle group expand/collapse
            content.querySelectorAll('[data-import-toggle]').forEach(function(header) {
                header.addEventListener('click', function(e) {
                    if (e.target.tagName === 'INPUT') return;
                    var idx = header.dataset.importToggle;
                    var body = content.querySelector('[data-import-body="' + idx + '"]');
                    var toggle = header.querySelector('.gen-import-group-toggle');
                    body.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
            });

            // Search filter — filters both groups and individual actions
            document.getElementById('gen-import-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                content.querySelectorAll('.gen-import-group[data-import-group]').forEach(function(group) {
                    var groupName = group.querySelector('.gen-import-group-name').textContent.toLowerCase();
                    var groupMatch = !query || groupName.indexOf(query) !== -1;

                    // Filter individual actions within the group
                    var hasVisibleAction = false;
                    group.querySelectorAll('.gen-import-action-row').forEach(function(row) {
                        var actionName = row.querySelector('.gen-import-action-name').textContent.toLowerCase();
                        var visible = groupMatch || actionName.indexOf(query) !== -1;
                        row.style.display = visible ? '' : 'none';
                        if (visible) hasVisibleAction = true;
                    });

                    group.style.display = hasVisibleAction ? '' : 'none';
                });
            });

            // Group-level select all checkbox
            content.querySelectorAll('.import-group-select-all').forEach(function(groupCb) {
                groupCb.addEventListener('change', function() {
                    var idx = groupCb.dataset.importGroupIdx;
                    var checked = groupCb.checked;
                    content.querySelectorAll('.import-action-cb[data-import-group-idx="' + idx + '"]:not(:disabled)').forEach(function(cb) {
                        cb.checked = checked;
                    });
                    updateImportCount();
                });
            });

            // Global select/deselect all
            document.getElementById('gen-import-select-all').addEventListener('click', function() {
                content.querySelectorAll('.import-action-cb:not(:disabled)').forEach(function(cb) { cb.checked = true; });
                content.querySelectorAll('.import-group-select-all:not(:disabled)').forEach(function(cb) { cb.checked = true; });
                updateImportCount();
            });
            document.getElementById('gen-import-deselect-all').addEventListener('click', function() {
                content.querySelectorAll('.import-action-cb:not(:disabled)').forEach(function(cb) { cb.checked = false; });
                content.querySelectorAll('.import-group-select-all:not(:disabled)').forEach(function(cb) { cb.checked = false; });
                updateImportCount();
            });

            // Individual checkbox change
            content.querySelectorAll('.import-action-cb').forEach(function(cb) {
                cb.addEventListener('change', updateImportCount);
            });

            updateImportCount();

            // Import button
            document.getElementById('gen-import-btn').addEventListener('click', doImportActions);
        }

        function updateImportCount() {
            var checked = document.querySelectorAll('.import-action-cb:not(:disabled):checked').length;
            var countEl = document.getElementById('gen-import-count');
            var btn = document.getElementById('gen-import-btn');
            if (countEl) countEl.textContent = checked + ' action' + (checked !== 1 ? 's' : '') + ' selected';
            if (btn) btn.disabled = checked === 0;
        }

        function doImportActions() {
            var btn = document.getElementById('gen-import-btn');
            btn.disabled = true;
            btn.textContent = 'Importing...';

            // Group selected actions by schema
            var schemaActions = {};
            document.querySelectorAll('.import-action-cb:not(:disabled):checked').forEach(function(cb) {
                var schema = cb.dataset.schema;
                if (!schemaActions[schema]) schemaActions[schema] = [];
                schemaActions[schema].push(cb.dataset.actionClass);
            });

            var schemas = Object.keys(schemaActions);
            if (schemas.length === 0) {
                showToast('No actions selected.', 'warning');
                btn.disabled = false;
                btn.textContent = 'Import Selected Actions';
                return;
            }

            var completed = 0;
            var totalAdded = 0;
            var errors = [];

            schemas.forEach(function(schema) {
                var resourceSelect = document.querySelector('.import-resource-select[data-schema="' + schema + '"]');
                var resourceClass = resourceSelect ? resourceSelect.value : null;

                var payload = {
                    api: genSelectedApi,
                    actions: schemaActions[schema],
                    schema: schema,
                    resourceClass: resourceClass || undefined,
                };

                fetch('/_schema-craft/api/import-actions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (data.success) {
                        totalAdded += (data.addedActions || []).length;
                    } else {
                        errors.push(data.message || 'Import failed for a group.');
                    }
                })
                .catch(function(e) { errors.push(e.message); })
                .finally(function() {
                    completed++;
                    if (completed === schemas.length) {
                        if (errors.length > 0) {
                            showToast('Import completed with errors: ' + errors.join('; '), 'warning');
                        } else {
                            showToast('Imported ' + totalAdded + ' action(s) successfully.', 'success');
                        }
                        // Refresh the import view
                        showImportActionsView();
                    }
                });
            });
        }

        // ── SDK View ───────────────────────────────────
        function showSdkView() {
            var content = document.getElementById('gen-content');
            content.innerHTML = '<div class="gen-empty-state">Loading SDK config...</div>';

            fetch('/_schema-craft/api/sdk/config?api=' + encodeURIComponent(genSelectedApi))
                .then(handleResponse)
                .then(function(data) {
                    genSdkConfig = data;
                    renderSdkView();
                })
                .catch(function(e) {
                    content.innerHTML = '<div class="gen-empty-state">Failed to load SDK config.</div>';
                });
        }

        function renderSdkView() {
            var d = genSdkConfig;
            var content = document.getElementById('gen-content');

            content.innerHTML =
                '<div class="gen-sdk-detail">' +
                    '<div class="gen-sdk-title">Client SDK</div>' +
                    '<div class="gen-sdk-info-grid">' +
                        '<span class="gen-sdk-info-label">Package Name</span>' +
                        '<span class="gen-sdk-info-value">' + escapeHtml(d.name || '-') + '</span>' +
                        '<span class="gen-sdk-info-label">Namespace</span>' +
                        '<span class="gen-sdk-info-value">' + escapeHtml(d.namespace || '-') + '</span>' +
                        '<span class="gen-sdk-info-label">Client Class</span>' +
                        '<span class="gen-sdk-info-value">' + escapeHtml(d.client || '-') + '</span>' +
                        '<span class="gen-sdk-info-label">Version</span>' +
                        '<span class="gen-sdk-info-value">' + escapeHtml(d.version || '-') + '</span>' +
                        '<span class="gen-sdk-info-label">Output Path</span>' +
                        '<span class="gen-sdk-info-value">' + escapeHtml(d.path || '-') + '</span>' +
                    '</div>' +
                    '<div class="sc-form-group">' +
                        '<label class="sc-checkbox-label"><input type="checkbox" id="gen-sdk-force-cb"> Force overwrite existing files</label>' +
                    '</div>' +
                    '<div style="display:flex;gap:10px;">' +
                        '<button class="sc-btn" id="gen-sdk-preview-btn">Preview SDK</button>' +
                        '<button class="sc-btn primary" id="gen-sdk-generate-btn">Generate SDK</button>' +
                    '</div>' +
                '</div>';

            document.getElementById('gen-sdk-preview-btn').addEventListener('click', function() { doSdkAction(true); });
            document.getElementById('gen-sdk-generate-btn').addEventListener('click', function() { doSdkAction(false); });
        }

        function doSdkAction(previewOnly) {
            var payload = {
                api: genSelectedApi,
                path: genSdkConfig.path || undefined,
                name: genSdkConfig.name || undefined,
                namespace: genSdkConfig.namespace || undefined,
                client: genSdkConfig.client || undefined,
                version: genSdkConfig.version || undefined,
            };

            if (previewOnly) {
                fetch('/_schema-craft/api/sdk/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }
                    showFilePreviewModal(data.files, 'Generate SDK', function() {
                        payload.force = document.getElementById('gen-sdk-force-cb').checked;
                        doSdkWrite(payload);
                    });
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            } else {
                payload.force = document.getElementById('gen-sdk-force-cb').checked;
                doSdkWrite(payload);

        function checkFilamentInstallStatus(callback) {
            fetch('/_schema-craft/api/filament/install-status')
                .then(handleResponse)
                .then(function(data) {
                    var area = document.getElementById('gen-filament-install-area');
                    if (!area) { if (callback) callback(); return; }

                    if (data.installed) {
                        area.innerHTML =
                            '<div class="gen-filament-install-success">' +
                                '<span class="sc-banner-icon">\u2705</span>' +
                                '<span class="sc-banner-text">Filament panel is installed and configured.</span>' +
                            '</div>';
                    } else {
                        var message = data.packageInstalled
                            ? 'Filament package is installed but the panel is not configured yet.'
                            : 'Filament is not installed. This will install the composer package and set up the admin panel.';
                        area.innerHTML =
                            '<div class="gen-filament-install-banner">' +
                                '<span class="sc-banner-icon">\u26A0</span>' +
                                '<span class="sc-banner-text">' + message + '</span>' +
                                '<button class="sc-btn sm primary" id="gen-filament-install-btn">Install Filament</button>' +
                            '</div>';
                        document.getElementById('gen-filament-install-btn').addEventListener('click', doFilamentInstall);
                    }

                    if (callback) callback();
                })
                .catch(function() {
                    if (callback) callback();
                });

        function doFilamentInstall() {
            var btn = document.getElementById('gen-filament-install-btn');
            btn.disabled = true;
            btn.textContent = 'Installing\u2026 (this may take a minute)';

            fetch('/_schema-craft/api/filament/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            })
            .then(handleResponse)
            .then(function(data) {
                if (data.success) {
                    showToast('Filament installed successfully.', 'success');
                    var area = document.getElementById('gen-filament-install-area');
                    if (area) {
                        area.innerHTML =
                            '<div class="gen-filament-install-success">' +
                                '<span class="sc-banner-icon">\u2705</span>' +
                                '<span class="sc-banner-text">Filament panel is installed and configured.</span>' +
                            '</div>';

                } else {
                    showToast(data.message || 'Filament installation failed.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Install Filament';

                    '</div>' +
