            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            cursor: pointer; user-select: none;
        }
        .gen-import-group-header:hover { background: var(--bg-tertiary); }
        .gen-import-group-toggle {
            font-size: 12px; color: var(--text-muted); transition: transform 0.15s;
        }
        .gen-import-group-toggle.open { transform: rotate(90deg); }
        .gen-import-group-name { font-size: 14px; font-weight: 600; }
        .gen-import-group-count {
            font-size: 11px; color: var(--text-muted); background: var(--bg-tertiary);
            padding: 2px 8px; border-radius: 10px;
        }
        .gen-import-group-body { display: none; }
        .gen-import-group-body.open { display: block; }
        .gen-import-action-row {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .gen-import-action-row:last-child { border-bottom: none; }
        .gen-import-action-row.imported { opacity: 0.5; }
        .gen-import-action-method {
            font-family: var(--font-mono); font-size: 11px; font-weight: 700;
            padding: 2px 8px; border-radius: 4px; text-transform: uppercase; min-width: 48px; text-align: center;
        }
        .gen-import-action-method.get { color: #22c55e; background: rgba(34,197,94,0.1); }
        .gen-import-action-method.post { color: #3b82f6; background: rgba(59,130,246,0.1); }
        .gen-import-action-method.put { color: #f59e0b; background: rgba(245,158,11,0.1); }
        .gen-import-action-method.delete { color: #ef4444; background: rgba(239,68,68,0.1); }
        .gen-import-action-method.patch { color: #a855f7; background: rgba(168,85,247,0.1); }
        .gen-import-action-name { font-weight: 500; flex: 1; }
        .gen-import-action-label { color: var(--text-muted); font-size: 12px; }
        .gen-import-action-imported-badge {
            font-size: 10px; color: var(--text-muted); background: var(--bg-tertiary);
            padding: 2px 8px; border-radius: 10px;
        }
        .gen-import-resource-section {
            padding: 12px 16px; background: var(--bg-primary);
            border-top: 1px solid var(--border);
        }
        .gen-import-resource-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 8px;
        }
        .gen-import-field-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px;
        }
        .gen-import-field-item {
            display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 0;
        }
        .gen-import-field-type {
            font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
        }
        .gen-import-footer {
            display: flex; align-items: center; gap: 12px; margin-top: 20px;
            padding-top: 16px; border-top: 1px solid var(--border);
        }
        .gen-import-selected-count {
            font-size: 13px; color: var(--text-muted); flex: 1;
        }

        /* Resource overlay */
        .act-overlay-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .act-overlay-panel {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 10px; display: flex; flex-direction: column;
            max-height: 85vh; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .act-overlay-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid var(--border);
        }
        .act-overlay-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .act-overlay-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
        }
        .act-overlay-close:hover { color: var(--text-primary); }
        .act-overlay-body { flex: 1; overflow-y: auto; }
        .act-overlay-footer {
            display: flex; align-items: center; justify-content: flex-end; gap: 10px;
            padding: 14px 20px; border-top: 1px solid var(--border);
        }

        /* API Docs view */
        .docs-endpoint-row {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
            margin-bottom: 4px;
        }
        .docs-endpoint-row:hover { background: var(--bg-tertiary); border-color: var(--accent); }
        .docs-endpoint-path {
            font-family: var(--font-mono); font-size: 12px; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .docs-endpoint-label {
            font-size: 12px; color: var(--text-muted); flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .docs-endpoint-badge {
            padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600;
            white-space: nowrap; flex-shrink: 0;
        }
        .docs-endpoint-badge.params { background: var(--info-dim); color: var(--info); }
        .docs-endpoint-badge.rels { background: var(--accent-dim); color: var(--accent); }

        /* Content area */
        .gen-content { flex: 1; overflow-y: auto; padding: 0; position: relative; }
        .gen-empty-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); font-size: 14px;
        }

        /* Generator docs panel — fills the content pane with its own scroll regions */
        .genr-docs-panel {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
        }
        .genr-docs-loading {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); font-size: 13px;
        }
        .genr-docs-layout { display: flex; flex: 1; overflow: hidden; }
        .genr-docs-toc {
            width: 200px; min-width: 160px; flex-shrink: 0;
            border-right: 1px solid var(--border); overflow-y: auto;
            padding: 16px 0;
        }
        .genr-docs-toc-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); padding: 0 16px 12px;
        }
        .genr-docs-toc-list { list-style: none; margin: 0; padding: 0; }
        .genr-docs-toc-item {
            padding: 5px 16px; font-size: 12px; cursor: pointer; color: var(--text-secondary);
            line-height: 1.4; transition: color 0.15s, background 0.15s;
        }
        .genr-docs-toc-item:hover { color: var(--text); background: var(--bg-hover); }
        .genr-docs-content {
            flex: 1; overflow-y: auto; padding: 24px 32px;
        }

        /* Stack detail */
        .gen-stack-detail { padding: 24px; max-width: 900px; }
        .gen-stack-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
        }
        .gen-stack-title { font-size: 20px; font-weight: 700; }
        .gen-stack-route-prefix {
            font-size: 13px; font-family: var(--font-mono); color: var(--text-muted);
            background: var(--bg-tertiary); padding: 2px 10px; border-radius: 4px;
        }
        .gen-stack-badges { display: flex; gap: 6px; margin-left: auto; align-items: center; }
        .gen-stack-badge { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .gen-stack-badge.controller { background: var(--success-dim); color: var(--success); }
        .gen-stack-badge.service { background: var(--info-dim); color: var(--info); }
        .gen-stack-badge.test { background: var(--accent-dim); color: var(--accent); }
        .gen-stack-badge.missing { background: var(--warning-dim); color: var(--warning); }

        /* Endpoint list */
        .gen-endpoint-section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .gen-endpoint-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
        .gen-endpoint-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); transition: background 0.1s;
        }
        .gen-endpoint-item:hover { background: var(--bg-tertiary); }
        .gen-endpoint-method {
            padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700;
            font-family: var(--font-mono); min-width: 60px; text-align: center; text-transform: uppercase;
        }
        .gen-endpoint-method.get { background: var(--success-dim); color: var(--success); }
        .gen-endpoint-method.post { background: var(--info-dim); color: var(--info); }
        .gen-endpoint-method.put { background: var(--warning-dim); color: var(--warning); }
        .gen-endpoint-method.delete { background: var(--error-dim); color: var(--error); }
        .gen-endpoint-path { font-family: var(--font-mono); font-size: 13px; color: var(--text-primary); flex: 1; }
        .gen-endpoint-action { font-size: 12px; color: var(--text-muted); }
        .gen-endpoint-desc { font-size: 11px; color: var(--text-muted); font-style: italic; flex: 1; }
        .gen-endpoint-type { padding: 1px 8px; border-radius: 10px; font-size: 10px; background: var(--bg-tertiary); color: var(--text-muted); }
        .gen-endpoint-type.custom { background: var(--accent-dim); color: var(--accent); }
        .gen-endpoint-item { cursor: pointer; }

        /* Endpoint detail modal */
        .ep-overlay {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.6); display: flex;
            align-items: center; justify-content: center;
            animation: fp-fade-in 0.2s ease-out;
        }
        .ep-modal {
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 12px; width: 90vw; max-width: 700px; max-height: 80vh;
            display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .ep-header {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .ep-header-method {
            padding: 3px 12px; border-radius: 4px; font-size: 12px; font-weight: 700;
            font-family: var(--font-mono); text-transform: uppercase;
        }
        .ep-header-method.get { background: var(--success-dim); color: var(--success); }
        .ep-header-method.post { background: var(--info-dim); color: var(--info); }
        .ep-header-method.put { background: var(--warning-dim); color: var(--warning); }
        .ep-header-method.delete { background: var(--error-dim); color: var(--error); }
        .ep-header-path { font-family: var(--font-mono); font-size: 14px; font-weight: 500; flex: 1; }
        .ep-header-desc { font-size: 12px; color: var(--text-muted); font-style: italic; }
        .ep-header-close {
            background: none; border: none; color: var(--text-muted); font-size: 20px;
            cursor: pointer; padding: 4px 8px; border-radius: 4px; flex-shrink: 0;
        }
        .ep-header-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }
        .ep-tabs {
            display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px;
        }
        .ep-tab {
            padding: 10px 20px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 13px; font-weight: 500; cursor: pointer; position: relative;
            transition: color 0.15s;
        }
        .ep-tab:hover { color: var(--text-primary); }
        .ep-tab.active { color: var(--accent); }
        .ep-tab.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
            height: 2px; background: var(--accent); border-radius: 1px 1px 0 0;
        }
        .ep-body { flex: 1; overflow-y: auto; padding: 20px; }
        .ep-section { margin-bottom: 20px; }
        .ep-section:last-child { margin-bottom: 0; }
        .ep-section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
        }
        .ep-section-badge {
            padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0;
        }
        .ep-section-badge.params { background: var(--info-dim); color: var(--info); }
        .ep-section-badge.body { background: var(--warning-dim); color: var(--warning); }
        .ep-section-badge.fields { background: var(--success-dim); color: var(--success); }
        .ep-section-badge.relations { background: var(--accent-dim); color: var(--accent); }
        .ep-section-badge.meta { background: var(--bg-tertiary); color: var(--text-muted); }

        .ep-field-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .ep-field-table th {
            text-align: left; padding: 8px 10px; font-weight: 600; color: var(--text-muted);
            border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .ep-field-table td {
            padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
        }
        .ep-field-table tr:last-child td { border-bottom: none; }
        .ep-field-name { font-family: var(--font-mono); font-weight: 500; color: var(--text-primary); }
        .ep-field-type { font-family: var(--font-mono); color: var(--text-secondary); font-size: 11px; }
        .ep-morph-hint { font-weight: 400; color: var(--text-muted); font-size: 11px; }
        .ep-field-rules { font-size: 11px; }
        .ep-rule-tag {
            display: inline-block; padding: 1px 6px; margin: 1px 2px; border-radius: 3px;
            font-family: var(--font-mono); font-size: 10px;
            background: var(--bg-tertiary); color: var(--text-secondary);
        }
        .ep-rule-tag.required { background: var(--error-dim); color: var(--error); }
        .ep-rule-tag.nullable { background: var(--warning-dim); color: var(--warning); }
        .ep-field-nullable { color: var(--warning); font-size: 10px; }
        .ep-field-flags { display: flex; gap: 4px; flex-wrap: wrap; }
        .ep-field-flag {
            padding: 1px 6px; border-radius: 3px; font-size: 10px;
            background: var(--bg-tertiary); color: var(--text-muted);
        }
        .ep-field-flag.pk { background: var(--accent-dim); color: var(--accent); }
        .ep-field-flag.ai { background: var(--info-dim); color: var(--info); }
        .ep-field-flag.unique { background: var(--warning-dim); color: var(--warning); }
        .ep-field-flag.unsigned { background: var(--bg-tertiary); color: var(--text-muted); }

        .ep-no-body { color: var(--text-muted); font-size: 12px; font-style: italic; padding: 4px 0; }
        .ep-rel-link {
            color: var(--accent); cursor: pointer; text-decoration: none; font-family: var(--font-mono);
            font-size: 12px; font-weight: 500; transition: opacity 0.15s;
        }
        .ep-rel-link:hover { opacity: 0.8; text-decoration: underline; }

        /* Expandable relationship items in the response panel */
        .ep-rel-details {
            border: 1px solid var(--border); border-radius: 6px;
            overflow: hidden; margin-top: 6px;
        }
        .ep-rel-details + .ep-rel-details { margin-top: 6px; }
        .ep-rel-summary {
            display: flex; align-items: center; gap: 0;
            padding: 8px 12px; cursor: pointer;
            background: var(--bg-secondary); font-size: 12px;
            list-style: none; user-select: none;
        }
        .ep-rel-summary::-webkit-details-marker { display: none; }
        .ep-rel-summary::before {
            content: '▶'; font-size: 9px; color: var(--text-muted);
            margin-right: 8px; transition: transform 0.15s; flex-shrink: 0;
        }
        .ep-rel-details[open] > .ep-rel-summary::before { transform: rotate(90deg); }
        .ep-rel-summary:hover { background: var(--bg-tertiary); }
        .ep-rel-body {
            border-top: 1px solid var(--border);
            padding: 8px 12px 4px;
            background: var(--bg-primary);
        }
        .ep-rel-body .ep-field-table { margin-bottom: 4px; }
        .ep-breadcrumb { display: flex; align-items: center; gap: 6px; padding: 0 20px 0; margin-bottom: -8px; padding-top: 12px; }
        .ep-breadcrumb-item { font-size: 11px; color: var(--text-muted); }
        .ep-breadcrumb-link { font-size: 11px; color: var(--accent); cursor: pointer; }
        .ep-breadcrumb-link:hover { text-decoration: underline; }
        .ep-breadcrumb-sep { font-size: 11px; color: var(--text-muted); }

        /* Add action section */
        .gen-add-action-section {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px 20px;
        }
        .gen-add-action-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
        .gen-add-action-row { display: flex; gap: 10px; align-items: center; }
        .gen-add-action-row .sc-input { flex: 1; }
        .gen-add-action-row .sc-select { width: auto; min-width: 90px; flex: 0 0 auto; }

        /* SDK detail */
        .gen-sdk-detail { padding: 24px; max-width: 700px; }
        .gen-sdk-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .gen-sdk-info-grid {
            display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; margin-bottom: 24px;
        }
        .gen-sdk-info-label { font-size: 12px; font-weight: 500; color: var(--text-muted); padding-top: 2px; }
        .gen-sdk-info-value { font-size: 13px; font-family: var(--font-mono); color: var(--text-primary); }

        /* SDK diagnostics (errors/warnings after preview or generate) */
        .sdk-diag-block { margin-top: 20px; border-radius: 8px; overflow: hidden; font-size: 13px; }
        .sdk-diag-errors { border: 1px solid #f87171; background: color-mix(in srgb, #f87171 10%, transparent); }
        .sdk-diag-warnings { border: 1px solid #fbbf24; background: color-mix(in srgb, #fbbf24 10%, transparent); }
        .sdk-diag-heading { padding: 10px 14px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); }
        .sdk-diag-errors .sdk-diag-heading { color: #dc2626; border-bottom-color: #f87171; }
        .sdk-diag-warnings .sdk-diag-heading { color: #b45309; border-bottom-color: #fbbf24; }
        .sdk-diag-item { padding: 8px 14px; border-bottom: 1px solid var(--border); line-height: 1.5; }
        .sdk-diag-item:last-child { border-bottom: none; }
        .sdk-diag-item code { font-family: var(--font-mono); font-size: 12px; }

        /* Selector page sections */
        .gen-selector-section { width: 100%; max-width: 800px; text-align: center; }
        .gen-selector-section-title {
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
            text-align: left;
        }
        .gen-selector-section-divider {
            border: none; border-top: 1px solid var(--border-color);
            margin: 8px 0 24px 0; max-width: 800px; width: 100%;
        }
        .gen-api-card.filament { border-color: var(--accent-color); }
        .gen-api-card.filament:hover { border-color: var(--accent-color); filter: brightness(1.05); }

        /* Filament full-page layout */
        .gen-filament-page { padding: 24px; max-width: 800px; margin: 0 auto; }
        .gen-filament-page-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
        }
        .gen-filament-page-title { font-size: 20px; font-weight: 700; }

        /* Filament install banners */
        .gen-filament-install-banner {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px; margin-bottom: 20px;
            background: var(--warning-dim, rgba(250,173,20,0.08)); border: 1px solid var(--warning-color, #faad14);
            border-radius: 8px; font-size: 13px;
        }
        .gen-filament-install-banner .sc-banner-icon { font-size: 18px; }
        .gen-filament-install-banner .sc-banner-text { flex: 1; }
        .gen-filament-install-success {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px; margin-bottom: 20px;
            background: var(--success-dim, rgba(82,196,26,0.08)); border: 1px solid var(--success-color, #52c41a);
            border-radius: 8px; font-size: 13px;
        }
        .gen-filament-install-success .sc-banner-icon { font-size: 18px; }
        .gen-filament-install-success .sc-banner-text { flex: 1; }

        /* Filament schema list */
        .gen-filament-schema-list { display: flex; flex-direction: column; gap: 8px; }
        .gen-filament-schema-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--surface-secondary);
        }
        .gen-filament-schema-row:hover { border-color: var(--accent-color); }
        .gen-filament-schema-info { display: flex; flex-direction: column; gap: 2px; }
        .gen-filament-schema-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .gen-filament-schema-class { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
        .gen-filament-schema-actions { display: flex; gap: 8px; }

        /* New stack form */
        .gen-new-stack-form { padding: 24px; max-width: 600px; }

        /* ── Schema Editor Modal ─────────────────────────── */
        .se-overlay {
            position: fixed; inset: 0; z-index: 9200;
            background: rgba(0,0,0,0.6); display: flex;
            align-items: center; justify-content: center;
            animation: fp-fade-in 0.2s ease-out;
        }
        .se-modal {
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 12px; width: 95vw; max-width: 900px; height: 85vh; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .se-header {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .se-header-title { font-size: 16px; font-weight: 700; flex: 1; }
        .se-header-close {
            background: none; border: none; color: var(--text-muted); font-size: 20px;
            cursor: pointer; padding: 4px 8px; border-radius: 4px; flex-shrink: 0;
        }
        .se-header-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }
        .se-tabs {
            display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px;
        }
        .se-tab {
            padding: 10px 20px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 13px; font-weight: 500; cursor: pointer; position: relative;
            transition: color 0.15s;
        }
        .se-tab:hover { color: var(--text-primary); }
        .se-tab.active { color: var(--accent); }
        .se-tab.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
            height: 2px; background: var(--accent); border-radius: 1px 1px 0 0;
        }
        .se-tab .se-tab-count {
            display: inline-block; padding: 0 5px; margin-left: 4px;
            font-size: 10px; background: var(--bg-tertiary); border-radius: 8px;
            color: var(--text-muted); min-width: 16px; text-align: center;
        }
        .se-body { flex: 1; overflow-y: auto; padding: 20px; }
        .se-footer {
            display: flex; gap: 8px; justify-content: flex-end;
            padding: 12px 20px; border-top: 1px solid var(--border);
        }
        .se-item-row {
            display: flex; gap: 8px; align-items: center; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px;
            cursor: pointer; transition: border-color 0.15s;
        }
        .se-item-row:hover { border-color: var(--accent); }
        .se-item-row.focused { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: -1px; }
        .se-item-row.active { border-color: var(--accent); background: var(--accent-dim); }
        .se-item-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
        .se-type-badge {
            padding: 1px 6px; border-radius: 8px; font-size: 9px;
            background: var(--accent-dim); color: var(--accent);
        }
        .se-constraint-badge {
            padding: 1px 6px; border-radius: 8px; font-size: 9px;
            background: var(--bg-tertiary); color: var(--text-muted);
        }
        .se-constraint-badge.pk { background: var(--accent-dim); color: var(--accent); }
        .se-constraint-badge.ai { background: var(--info-dim); color: var(--info); }
        .se-constraint-badge.nullable { background: var(--warning-dim); color: var(--warning); }
        .se-constraint-badge.unique { background: var(--warning-dim); color: var(--warning); }
        .se-constraint-badge.idx { background: var(--success-dim); color: var(--success); }
        .se-constraint-badge.fillable { background: var(--success-dim); color: var(--success); }
        .se-constraint-badge.hidden { background: var(--error-dim); color: var(--error); }
        .se-item-actions { margin-left: auto; display: flex; gap: 4px; }
        .se-item-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 2px 6px; border-radius: 4px; font-size: 13px;
        }
        .se-item-btn:hover { color: var(--error); background: var(--error-dim); }
        .se-item-btn.se-jump-rel { font-size: 12px; }
        .se-item-btn.se-jump-rel:hover { color: var(--accent); background: var(--accent-dim); }
        .se-edit-form {
            padding: 16px; background: var(--bg-secondary); border-radius: 0 0 6px 6px;
            border: 1px solid var(--border); border-top: none; margin-top: -7px; margin-bottom: 6px;
        }
        .se-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .se-field { flex: 1; min-width: 120px; }
        .se-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .se-field input[type="text"],
        .se-field input[type="number"],
        .se-field select {
            width: 100%; padding: 6px 10px; font-size: 13px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); outline: none;
        }
        .se-field input:focus, .se-field select:focus { border-color: var(--accent); }
        .se-field select { appearance: auto; }
        .se-checks { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .se-check {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; color: var(--text-secondary); cursor: pointer;
        }
        .se-check input[type="checkbox"] { accent-color: var(--accent); }
        .se-form-actions { display: flex; gap: 8px; margin-top: 12px; }
        .se-add-btn {
            padding: 6px 12px; font-size: 12px; border: 1px dashed var(--border);
            border-radius: 6px; background: none; color: var(--text-muted);
            cursor: pointer; width: 100%; text-align: center; transition: all 0.15s;
        }
        .se-add-btn:hover { border-color: var(--accent); color: var(--accent); }
        .se-empty {
            text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 13px;
        }
        .se-section { margin-bottom: 20px; }
        .se-section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .se-composite-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 6px;
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
        }
        .se-composite-cols { flex: 1; font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); }

        /* ── Relationship compact form ── */
        .se-rel-compact-line {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .se-rel-model-wrap { position: relative; flex: 2; min-width: 140px; }
        .se-rel-model-input {
            width: 100%; padding: 6px 10px; font-size: 13px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); outline: none; box-sizing: border-box;
        }
        .se-rel-model-input:focus { border-color: var(--accent); }
        .se-rel-model-dropdown {
            position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 200;
            background: var(--bg-secondary); border: 1px solid var(--accent);
            border-radius: 6px; max-height: 220px; overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .se-rel-model-option {
            padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--text-primary);
        }
        .se-rel-model-option:hover, .se-rel-model-option.active { background: var(--accent-dim); color: var(--accent); }
        .se-rel-model-option-ns { font-size: 10px; color: var(--text-muted); margin-left: 4px; }
        .se-rel-type-sel {
            padding: 6px 8px; font-size: 12px; border: 1px solid var(--border);
            border-radius: 6px; background: var(--bg-primary); color: var(--text-primary);
            outline: none; cursor: pointer; flex-shrink: 0;
        }
        .se-rel-type-sel:focus { border-color: var(--accent); }
        .se-rel-name-input, .se-rel-morph-input {
            padding: 6px 9px; font-size: 13px; font-family: var(--font-mono);
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); outline: none;
            width: 100px; flex-shrink: 0;
        }
        .se-rel-name-input:focus, .se-rel-morph-input:focus { border-color: var(--accent); }
        .se-rel-arrow { color: var(--text-muted); font-size: 14px; flex-shrink: 0; padding: 0 2px; }
        .se-rel-rev-section { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
        .se-rel-rev-section.se-rel-rev-disabled { opacity: 0.35; pointer-events: none; }
        .se-rel-rev-brace { color: var(--accent); font-size: 14px; font-weight: 700; padding: 0 1px; }
        .se-rel-rev-name-input {
            padding: 6px 9px; font-size: 13px; font-family: var(--font-mono);
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); outline: none;
            width: 100px;
        }
        .se-rel-rev-name-input:focus { border-color: var(--accent); }
        .se-rel-rev-toggle-label {
            display: flex; align-items: center; gap: 4px; font-size: 11px;
            color: var(--text-muted); cursor: pointer; flex-shrink: 0;
            padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px;
        }
        .se-rel-rev-toggle-label input { accent-color: var(--accent); cursor: pointer; }
        .se-rel-morph-hint {
            font-size: 11px; color: var(--text-muted); flex-shrink: 0;
            padding: 4px 8px; border: 1px solid var(--border); border-radius: 5px;
        }
        .se-rel-details-btn {
            padding: 5px 10px; font-size: 13px; border: 1px solid var(--border);
            border-radius: 6px; background: none; color: var(--text-muted);
            cursor: pointer; flex-shrink: 0; line-height: 1; letter-spacing: 2px;
            margin-left: auto;
        }
        .se-rel-details-btn:hover, .se-rel-details-btn.open {
            border-color: var(--accent); color: var(--accent);
        }
        .se-rel-details-panel {
            margin-top: 10px; border-top: 1px solid var(--border); padding-top: 12px;
        }
        .se-rel-details-cols { display: flex; gap: 16px; }
        .se-rel-details-left, .se-rel-details-right {
            flex: 1; min-width: 0;
        }
        .se-rel-details-section-title {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            color: var(--text-muted); letter-spacing: 0.6px; margin-bottom: 10px;
            padding-bottom: 4px; border-bottom: 1px solid var(--border);
        }
        .se-rel-morph-target-row {
            display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
            padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
            background: var(--bg-primary);
        }
        .se-rel-morph-target-schema {
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            flex-shrink: 0; min-width: 80px;
        }
        .se-rel-morph-type-sel {
            padding: 4px 6px; font-size: 11px; border: 1px solid var(--border);
            border-radius: 5px; background: var(--bg-secondary); color: var(--text-primary);
            outline: none; flex-shrink: 0;
        }
        .se-rel-morph-prop-input {
            padding: 4px 8px; font-size: 12px; font-family: var(--font-mono);
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 5px; color: var(--text-primary); outline: none; flex: 1; min-width: 0;
        }
        .se-rel-morph-prop-input:focus { border-color: var(--accent); }
        .se-rel-rev-info {
            margin-top: 8px; font-size: 11px; color: var(--text-muted);
        }
        .se-rel-rev-info code {
            font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
        }

        /* ── Actions Tab ─────────────────────────────────── */
        .act-action-item {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px;
            border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
            cursor: pointer; transition: all 0.12s;
        }
        .act-action-item:hover { border-color: var(--accent); background: var(--bg-hover); }
        .act-action-item-name { font-size: 13px; font-weight: 500; color: var(--text-primary); flex: 1; }
        .act-action-item-params { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

        .act-param-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .act-param-table th {
            text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); padding: 8px 12px; border-bottom: 2px solid var(--border);
            letter-spacing: 0.5px;
        }
        .act-param-table td {
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            font-size: 13px; color: var(--text-primary);
        }
        .act-param-table tr:hover td { background: var(--bg-hover); }
        .act-param-type { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
        .act-param-model-badge {
            font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
            background: #ede9fe; color: #6d28d9;
        }
        [data-theme="dark"] .act-param-model-badge { background: #4c1d95; color: #c4b5fd; }

        .act-field-picker { margin-top: 12px; }
        .act-field-picker-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
        }
        .act-field-item {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px;
            cursor: pointer; transition: background 0.1s;
        }
        .act-field-item:hover { background: var(--bg-hover); }
        .act-field-item.selected { border-color: var(--accent); background: rgba(59,130,246,0.05); }
        .act-field-item input[type="checkbox"] { margin: 0; }
        .act-field-item-name { font-size: 13px; font-weight: 500; color: var(--text-primary); font-family: var(--font-mono); }
        .act-field-item-type { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
        .act-field-item-badges { margin-left: auto; display: flex; gap: 4px; }
        .act-field-badge {
            font-size: 9px; font-weight: 600; padding: 2px 5px; border-radius: 3px;
            text-transform: uppercase;
        }
        .act-field-badge.nullable { background: #fef3c7; color: #92400e; }
        .act-field-badge.fk { background: #ede9fe; color: #6d28d9; }
        [data-theme="dark"] .act-field-badge.nullable { background: #78350f; color: #fde68a; }
        [data-theme="dark"] .act-field-badge.fk { background: #4c1d95; color: #c4b5fd; }

        .act-create-actions { display: flex; gap: 8px; margin-top: 20px; }

        /* ── Generator collection input ───────────────────────────── */
        /* Filterable select */
        .sc-filter-select { position: relative; }
        .sc-filter-select-input { width: 100%; box-sizing: border-box; }
        .sc-filter-select-dropdown {
            position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 200;
            background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 220px; overflow-y: auto;
        }
        .sc-filter-select-option {
            padding: 7px 12px; cursor: pointer; font-size: 13px;
            display: flex; align-items: baseline; gap: 8px;
        }
        .sc-filter-select-option:hover, .sc-filter-select-option.focused {
            background: var(--accent-dim);
        }
        .sc-filter-select-option-sub { font-size: 11px; color: var(--text-muted); font-family: monospace; }
        .sc-filter-select-empty { padding: 10px 12px; font-size: 12px; color: var(--text-muted); }

        /* Field picker */
        .fp-picker { display: flex; flex-direction: column; }
        .fp-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 4px; }
        .fp-col-row { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 0; }
        .fp-col-name { font-size: 12px; font-family: monospace; }
        .fp-col-type { font-size: 11px; color: var(--text-muted); }
        .fp-rel-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; user-select: none; }
        .fp-rel-toggle { font-size: 10px; color: var(--text-muted); width: 12px; flex-shrink: 0; }
        .fp-rel-name { font-size: 12px; font-family: monospace; }
        .fp-rel-type { font-size: 11px; color: var(--text-muted); }

        .genr-collection { display: flex; flex-direction: column; gap: 6px; }
        .genr-collection-item {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 6px; padding: 6px 10px;
        }
        .genr-collection-item select { flex: 1; min-width: 0; }
        .genr-collection-remove {
            flex-shrink: 0; background: none; border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer; color: var(--text-muted);

        }
        .genr-collection-remove:hover { border-color: #ef4444; color: #ef4444; }
        .genr-collection-add { margin-top: 4px; }

        .act-nullable-toggle {
            font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
            border: 1px solid var(--border); cursor: pointer; transition: all 0.12s;
            font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.3px;
            min-width: 68px; text-align: center;
        }
        .act-nullable-toggle.required { background: #dcfce7; color: #166534; border-color: #86efac; }
        .act-nullable-toggle.optional { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .act-nullable-toggle:hover { opacity: 0.8; }
        [data-theme="dark"] .act-nullable-toggle.required { background: #14532d; color: #86efac; border-color: #166534; }
        [data-theme="dark"] .act-nullable-toggle.optional { background: #78350f; color: #fde68a; border-color: #92400e; }

        .act-rel-header {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px;
            cursor: pointer; user-select: none; transition: background 0.12s;
        }
        .act-rel-header:hover { background: var(--bg-hover); }
        .act-rel-header.expanded { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }
        .act-rel-arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.15s; }
        .act-rel-header.expanded .act-rel-arrow { transform: rotate(90deg); }
        .act-rel-name { font-size: 13px; font-weight: 500; color: var(--text-primary); font-family: var(--font-mono); }
        .act-rel-type-badge {
            font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
            background: #dbeafe; color: #1e40af; font-family: var(--font-mono);
        }
        [data-theme="dark"] .act-rel-type-badge { background: #1e3a5f; color: #93c5fd; }
        .act-rel-type-badge.collection { background: #fce7f3; color: #9d174d; }
        [data-theme="dark"] .act-rel-type-badge.collection { background: #4a0e2d; color: #f9a8d4; }
        .act-rel-model { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-left: auto; }
        .act-rel-body {
            border: 1px solid var(--border); border-top: none; border-bottom-left-radius: 6px;

        .act-service-code {

            font-family: var(--font-mono);

            background: rgba(46, 160, 67, 0.15);

        .docs-article a {

        }
        .docs-article ul, .docs-article ol {
            margin-bottom: 12px;
            padding-left: 24px;
        }
        .docs-article li {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .docs-article li > ul, .docs-article li > ol {

            font-family: var(--font-mono);

        .docs-article pre {
            position: relative;

        }
        .docs-article pre code {
            display: block;
            padding: 16px 20px;

        .docs-article table {

        mark.docs-highlight {

        .docs-empty {
            padding: 48px 24px;

    </style>
</head>
<body>
    <header>

            <div class="qb-modal-header">
                <span class="qb-modal-title" id="qb-modal-title"></span>
                <button class="qb-modal-close" id="qb-modal-close">&times;</button>

    <script>
    (function() {
        'use strict';

        let schemaData = null;
        let activeTab = 'health';
        let explorerState = { loaded: new Map(), selected: null };
        let dragState = null;

        // ── API Response Helper ──────
        // Checks resp.ok; on failure reads the body and shows an error modal with details.
        async function handleResponse(resp) {
            if (resp.ok) return resp.json();
            var errorMessage = 'HTTP ' + resp.status;
            var errorData = null;
            try {
                var text = await resp.text();
                try {
                    var json = JSON.parse(text);
                    if (json.error && json.message) {
                        // Structured error from SchemaCraftErrorHandler middleware
                        errorData = json;
                        errorMessage = json.message;
                    } else if (json.message) {
                        errorMessage = json.message;
                    }
                } catch (_) {
                    var match = text.match(/<title>(.*?)<\/title>/i);
                    if (match) errorMessage = match[1];
                    else if (text.length < 500) errorMessage = text;
                }
            } catch (_) {}
            if (errorData) {
                showErrorModal(errorData);
            }
            throw new Error(errorMessage);
        }

        function showErrorModal(data) {
            // Remove any existing error modal
            var existing = document.querySelector('.err-overlay');
            if (existing) existing.remove();

            var overlay = document.createElement('div');
            overlay.className = 'err-overlay';

            var html = '<div class="err-modal">' +
                '<div class="err-header">' +
                    '<span class="err-header-title">\u2717 Error</span>' +
                    '<button class="err-close" title="Close">&times;</button>' +
                '</div>' +
                '<div class="err-body">' +
                    '<div class="err-message">' + escapeHtml(data.message) + '</div>';

            if (data.exception) {
                html += '<div class="err-meta">' +
                    '<strong>Exception:</strong> <span>' + escapeHtml(data.exception) + '</span></div>';
            }
            if (data.file) {
                html += '<div class="err-meta">' +
                    '<strong>Location:</strong> <span>' + escapeHtml(data.file) + ':' + data.line + '</span></div>';
            }
            if (data.trace && data.trace.length > 0) {
                html += '<button class="err-trace-toggle">Show Stack Trace (' + data.trace.length + ' frames)</button>' +
                    '<div class="err-trace" hidden>';
                data.trace.forEach(function(frame, i) {
                    var loc = frame.file ? escapeHtml(frame.file) + ':' + frame.line : '(internal)';
                    var fn = frame.function ? escapeHtml(frame.function) : '';
                    html += '<div class="err-trace-line">' +
                        '<span style="color:var(--text-muted)">#' + i + '</span> ' +
                        (fn ? '<span class="err-fn">' + fn + '</span> ' : '') +
                        '<span class="err-loc">' + loc + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            html += '</div></div>';
            overlay.innerHTML = html;
            document.body.appendChild(overlay);

            // Close handlers
            overlay.querySelector('.err-close').addEventListener('click', function() { overlay.remove(); });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

            // Trace toggle
            var traceToggle = overlay.querySelector('.err-trace-toggle');
            if (traceToggle) {
                traceToggle.addEventListener('click', function() {
                    var traceEl = overlay.querySelector('.err-trace');
                    var hidden = traceEl.hidden;
                    traceEl.hidden = !hidden;
                    traceToggle.textContent = (hidden ? 'Hide' : 'Show') + ' Stack Trace (' + data.trace.length + ' frames)';
                });
            }
        }

        // ── Shared Filter State (persisted in localStorage) ──────
        var sharedFilterState = {
            dbConnection: null,
            activeFilter: 'all',
            connections: [],      // populated from API
            tables: null,         // populated from API (same data as schemasState.tables)
        };

        // ── Pending Changes Store ────────────────────────────────────────────────────
        // Each entry: { key: schemaClass|'new:<n>', payload: {...}, label: 'SchemaName' }
        var pendingChanges = {};

        function updatePendingBadge() {
            var count = Object.keys(pendingChanges).length;
            var badge = document.getElementById('pending-badge');
            if (!badge) return;
            badge.textContent = count;
            badge.classList.toggle('visible', count > 0);
        }

        function pendingKey(schemaClass) {
            return schemaClass || ('new:' + Date.now());
        }

        function storePending(key, payload, label) {
            pendingChanges[key] = { key: key, payload: payload, label: label };
            updatePendingBadge();
        }

        function removePending(key) {
            delete pendingChanges[key];
            updatePendingBadge();
        }

        // ── HotkeyContext Stack ──────────────────────────────────────────────────────
        var HotkeyContext = {
            _stack: [],
            push: function(ctx) { this._stack.push(ctx); },
            pop: function() { this._stack.pop(); },
            current: function() { return this._stack[this._stack.length - 1] || 'global'; }
        };

        // ── Hotkey Definitions ───────────────────────────────────────────────────────
        var HOTKEYS = [
            { keys: ['⌘', 'O'], desc: 'Open schema search', contexts: ['global', 'schema-view', 'schema-editor'] },
            { keys: ['⌘', 'E'], desc: 'Edit schema', contexts: ['schema-view'] },
            { keys: ['⌘', 'J'], desc: 'Previous tab', contexts: ['schema-editor'] },
            { keys: ['⌘', 'K'], desc: 'Next tab', contexts: ['schema-editor'] },
            { keys: ['H'], desc: 'Previous tab (vim)', contexts: ['schema-editor'] },
            { keys: ['L'], desc: 'Next tab (vim)', contexts: ['schema-editor'] },
            { keys: ['J'], desc: 'Select next item (vim)', contexts: ['schema-editor'] },
            { keys: ['K'], desc: 'Select previous item (vim)', contexts: ['schema-editor'] },
            { keys: ['⌘', 'E'], desc: 'Open edit form for selection', contexts: ['schema-editor', 'schema-view'] },
            { keys: ['⌘', 'I'], desc: 'Jump to related schema', contexts: ['schema-editor'] },
            { keys: ['Enter'], desc: 'Open edit form for selection', contexts: ['schema-editor'] },
            { keys: ['⌘', 'S'], desc: 'Save & close edit form', contexts: ['schema-editor'] },
            { keys: ['⌘', 'C'], desc: 'Cancel & discard edit form', contexts: ['schema-editor'] },
            { keys: ['⌘', 'S'], desc: 'Preview & save changes', contexts: ['global', 'schema-view', 'schema-editor'] },
            { keys: ['⌘', '?'], desc: 'Show hotkey reference', contexts: ['global', 'schema-view', 'schema-editor'] },
            { keys: ['Esc'], desc: 'Close modal / cancel', contexts: ['global', 'schema-view', 'schema-editor'] },
        ];

        // ── Global Search Modal ──────────────────────────────────────────────────────
        var searchOverlayEl = null;

        function openSearchModal() {
            if (searchOverlayEl) return;

            var overlay = document.createElement('div');
            overlay.className = 'sc-search-overlay';
            searchOverlayEl = overlay;

            overlay.innerHTML =
                '<div class="sc-search-modal">' +
                    '<div class="sc-search-input-wrap">' +
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
                        '<input class="sc-search-input" id="sc-search-input" placeholder="Search schemas…" autocomplete="off">' +
                    '</div>' +
                    '<div class="sc-search-results" id="sc-search-results"></div>' +
                '</div>';

            document.body.appendChild(overlay);

            var input = overlay.querySelector('#sc-search-input');
            var results = overlay.querySelector('#sc-search-results');
            var selectedIdx = -1;
            var matches = [];

            function getItems() {
                var tables = sharedFilterState.tables || [];
                return tables.filter(function(t) { return t.schemaClass; });
            }

            function render(query) {
                var all = getItems();
                matches = query
                    ? all.filter(function(t) {
                        var name = (t.schemaClass || '').toLowerCase();
                        var label = (t.name || '').toLowerCase();
                        return name.indexOf(query.toLowerCase()) !== -1 || label.indexOf(query.toLowerCase()) !== -1;
                      })
                    : all;
                selectedIdx = matches.length ? 0 : -1;
                renderList();
            }

            function renderList() {
                if (!matches.length) {
                    results.innerHTML = '<div class="sc-search-empty">No schemas found</div>';
                    return;
                }
                results.innerHTML = matches.map(function(t, i) {
                    var name = t.schemaClass ? t.schemaClass.split('\\').pop() : t.name;
                    var sub = t.name || '';
                    return '<div class="sc-search-result' + (i === selectedIdx ? ' selected' : '') + '" data-idx="' + i + '">' +
                        '<span>' + escapeHtml(name) + '</span>' +
                        (sub ? '<span class="sc-search-result-sub">' + escapeHtml(sub) + '</span>' : '') +
                        '</div>';
                }).join('');

                results.querySelectorAll('.sc-search-result').forEach(function(el) {
                    el.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        var idx = parseInt(el.dataset.idx, 10);
                        selectResult(idx);
                    });
                });
            }

            function selectResult(idx) {
                var t = matches[idx];
                if (!t) return;
                closeSearchModal();
                showSchemaDetailModal(t);
            }

            input.addEventListener('input', function() { render(input.value); });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIdx = Math.min(selectedIdx + 1, matches.length - 1);
                    renderList();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIdx = Math.max(selectedIdx - 1, 0);
                    renderList();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIdx >= 0) selectResult(selectedIdx);
                } else if (e.key === 'Escape') {
                    closeSearchModal();
                }
            });

            overlay.addEventListener('mousedown', function(e) {
                if (e.target === overlay) closeSearchModal();
            });

            render('');
            setTimeout(function() { input.focus(); }, 30);
        }

        function closeSearchModal() {
            if (searchOverlayEl) { searchOverlayEl.remove(); searchOverlayEl = null; }
        }

        // ── Hotkey Reference Modal ───────────────────────────────────────────────────
        var hkOverlayEl = null;

        function showHotkeyModal() {
            if (hkOverlayEl) { closeHotkeyModal(); return; }
            var ctx = HotkeyContext.current();

            var overlay = document.createElement('div');
            overlay.className = 'hk-overlay';
            hkOverlayEl = overlay;

            var rows = HOTKEYS.map(function(hk) {

                    '<span class="hk-row-desc">' + escapeHtml(hk.desc) + '</span>' +

            overlay.innerHTML =

        // ── Global Save (cmd+S) ──────────────────────────────────────────────────────
        function globalSave() {
            // Commit any live editor state first
            if (SchemaEditor.state) {
                SchemaEditor.commitOpenEdit();
                var key = SchemaEditor.originalClass || '__new__';
                var label = SchemaEditor.state.schemaName || 'New Schema';
                var payload = SchemaEditor.buildPayload();
                if (payload) storePending(key, payload, label);
            }

            var keys = Object.keys(pendingChanges);
            if (!keys.length) { showToast('No pending changes', 'info'); return; }

            // Collect all pending payloads and preview them all
            var payloads = keys.map(function(k) { return pendingChanges[k].payload; });

            // Deduplicate files across payloads — full edits take precedence
            var fileMap = {};
            var pending = payloads.map(function(payload) {
                return fetch('/_schema-craft/api/schema/save/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(handleResponse);
            });

            Promise.all(pending).then(function(results) {
                results.forEach(function(data) {
                    if (data.success && data.files) {
                        data.files.forEach(function(f) {
                            if (!fileMap[f.path]) fileMap[f.path] = f;
                        });
                    }
                });

                var allFiles = Object.values(fileMap);
                if (!allFiles.length) { showToast('Nothing to save', 'info'); return; }

                // TODO(debugContext): Hard to wire — allFiles is merged from multiple
                // schema/save/preview fetches (one per pending change key). There is no
                // single endpoint or request body to report. The Inspect snapshot would
                // show files + _category values but no request context.
                showFilePreviewModal(allFiles, 'Save All Pending Changes', function() {
                    var saves = keys.map(function(k) {
                        return fetch('/_schema-craft/api/schema/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify(pendingChanges[k].payload)
                        }).then(handleResponse);
                    });
                    Promise.all(saves).then(function() {
                        keys.forEach(removePending);
                        showToast('All changes saved', 'success');
                        if (SchemaEditor.state) SchemaEditor.close();
                        loadDatabaseTables();
                        refreshSchemaData();
                    }).catch(function(e) { showToast('Save error: ' + e.message, 'error'); });
                });
            }).catch(function(e) { showToast('Preview error: ' + e.message, 'error'); });
        }

        function loadSharedFilterState() {
            try {
                var saved = localStorage.getItem('sc-shared-filters');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    if (parsed.dbConnection) sharedFilterState.dbConnection = parsed.dbConnection;
                    if (parsed.activeFilter) sharedFilterState.activeFilter = parsed.activeFilter;
                }
            } catch (e) {}
        }

        function saveSharedFilterState() {
            try {
                localStorage.setItem('sc-shared-filters', JSON.stringify({
                    dbConnection: sharedFilterState.dbConnection,
                    activeFilter: sharedFilterState.activeFilter,
                }));
            } catch (e) {}
        }

        function loadSharedConnections(callback) {
            if (sharedFilterState.connections.length > 0) {
                if (callback) callback();
                return;
            }
            fetch('/_schema-craft/api/connections')
                .then(handleResponse)
                .then(function(data) {
                    sharedFilterState.connections = data.connections;
                    if (!sharedFilterState.dbConnection) {
                        sharedFilterState.dbConnection = data.default;
                        saveSharedFilterState();
                    }
                    if (callback) callback();
                })
                .catch(function(e) { showToast('Failed to load connections: ' + e.message, 'error'); if (callback) callback(); });
        }

        function loadSharedTables(callback) {
            var url = '/_schema-craft/api/database/tables';
            if (sharedFilterState.dbConnection) url += '?db_connection=' + encodeURIComponent(sharedFilterState.dbConnection);
            fetch(url)
                .then(handleResponse)
                .then(function(data) {
                    sharedFilterState.tables = data.tables.map(function(t) {
                        // Preserve selection state if schemasState has it
                        var existing = schemasState.tables ? schemasState.tables.find(function(st) {
                            return st.name === t.name && st.dbConnection === t.dbConnection;
                        }) : null;
                        t.selected = existing ? existing.selected : false;
                        return t;
                    });
                    // Sync to schemasState
                    schemasState.tables = sharedFilterState.tables;
                    if (callback) callback();
                })
                .catch(function(e) { showToast('Failed to load tables: ' + e.message, 'error'); if (callback) callback(); });
        }

        function renderSharedConnectionDropdown(selectId) {
            var select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = '';
            var allOpt = document.createElement('option');
            allOpt.value = 'all';
            allOpt.textContent = 'All Connections';
            select.appendChild(allOpt);
            sharedFilterState.connections.forEach(function(conn) {
                var opt = document.createElement('option');
                opt.value = conn.name;
                var label = conn.name;
                if (conn.schemaPrefix) label += ' (prefix: ' + conn.schemaPrefix + ')';
                if (conn.schemaNamespace !== 'App\\Schemas') label += ' [' + conn.schemaNamespace + ']';
                opt.textContent = label;
                select.appendChild(opt);
            });
            select.value = sharedFilterState.dbConnection || 'all';
        }

        function renderSharedFilterTabs(containerId) {
            var container = document.getElementById(containerId);
            if (!container) return;
            container.querySelectorAll('.sc-filter-tab').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.filter === sharedFilterState.activeFilter);
            });
            updateSharedFilterCounts(containerId);
        }

        function updateSharedFilterCounts(containerId) {
            if (!sharedFilterState.tables) return;
            var filters = ['all', 'not-imported', 'needs-factory-test', 'needs-service', 'complete'];
            filters.forEach(function(f) {
                var count = f === 'all' ? sharedFilterState.tables.length : sharedFilterState.tables.filter(function(t) { return matchesImportFilter(t, f); }).length;
                var btn = document.querySelector('#' + containerId + ' .sc-filter-tab[data-filter="' + f + '"]');
                if (btn) {
                    var label = btn.textContent.replace(/\s*\(\d+\)$/, '');
                    btn.textContent = label + ' (' + count + ')';
                }
            });
        }

        /** Sync all connection dropdowns and filter tabs across tabs */
        function syncSharedFiltersToUI() {
            // Sync connection dropdowns
            ['sc-db-connection', 'health-db-connection', 'act-db-connection'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.value = sharedFilterState.dbConnection || 'all';

            ['sc-import-filters', 'health-import-filters'].forEach(function(id) {

            });

        function onSharedConnectionChange(value) {
            sharedFilterState.dbConnection = value;

        // ── Query Builder State ───────────────────────────
        let queryBuilderState = {
            savedQueries: [],
            currentQuery: null,
            name: '',
            baseTable: null,
            baseModel: null,
            baseSchema: null,
            loaded: new Map(),
            joins: [],
            conditions: [],
            sorts: [],
            selects: [],
            output: { scopeOnModel: true, apiEndpoint: false, inlineController: false },
            dirty: false,
            sidebarSearchQuery: '',
            selectedApi: null,
        };
        let qbDragState = null;
        let qbInitialized = false;
        let qbApiConfig = null; // { apis: {...}, defaultApi: 'default' }
        let qbActivePanel = 'conditions';

        async function init() {
            try {
                loadSharedFilterState();
                const resp = await fetch('/_schema-craft/api/schema');
                schemaData = await handleResponse(resp);
                document.getElementById('loading').hidden = true;
                renderHealthTab();
                document.getElementById('health-tab').hidden = false;
                renderModelList();
                bindEvents();
                restoreFromQueryParams();

        function restoreFromQueryParams() {
            var initialTab = getQueryParam('tab');
            var initialApi = getQueryParam('api');
            var initialStack = getQueryParam('stack');

            if (initialTab && document.querySelector('.tab-btn[data-tab="' + initialTab + '"]')) {
                if (initialTab === 'apis' && initialApi) {
                    // Pre-set generate state before switchTab triggers initGenerateTab
                    generateInitialized = true;
                    genSelectedApi = initialApi;
                    genSelectedView = null;

                    // switchTab will skip initGenerateTab since generateInitialized is true
                    switchTab(initialTab);

                    // Load the API config and render the main layout
                    loadGenerateConfig(initialApi, function() {
                        renderGenerateMain();
                    });
                } else {
                    switchTab(initialTab);
                }
            } else {
                switchTab('health');
            }
        }

        function bindEvents() {
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
            });
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('hk-open-btn').addEventListener('click', function() { showHotkeyModal(); });
            document.addEventListener('keydown', function(e) {
                var inField = ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) !== -1
                    || document.activeElement.isContentEditable;

                // Arrow keys + vim aliases — no modifier, not in a field
                if (!e.metaKey && !e.ctrlKey && !e.altKey && !inField) {
                    var vk = e.key === 'ArrowDown' ? 'j' : e.key === 'ArrowUp' ? 'k'
                           : e.key === 'ArrowLeft' ? 'h' : e.key === 'ArrowRight' ? 'l'
                           : e.key.toLowerCase();
                    if (vk === 'j' || vk === 'k' || vk === 'h' || vk === 'l') {
                        var ctx = HotkeyContext.current();
                        if (ctx === 'schema-editor' && SchemaEditor.state) {
                            e.preventDefault();
                            if (vk === 'j') { SchemaEditor.navigateSelection(1); }
                            else if (vk === 'k') { SchemaEditor.navigateSelection(-1); }
                            else if (vk === 'h') { SchemaEditor.cycleTab(-1); }
                            else if (vk === 'l') { SchemaEditor.cycleTab(1); }
                        }
                        return;
                    }
                    if (e.key === 'Enter' && !inField) {
                        var ctx = HotkeyContext.current();
                        if (ctx === 'schema-editor' && SchemaEditor.state) {
                            e.preventDefault();
                            SchemaEditor.openSelectedEdit();
                        }
                        return;
                    }
                }

                if (!e.metaKey && !e.ctrlKey) return;
                var key = e.key.toLowerCase();
                if (key === 'g' && !e.shiftKey) { e.preventDefault(); switchTab('generators'); return; }
                if (key === 'o') { e.preventDefault(); if (searchOverlayEl) { closeSearchModal(); } else { openSearchModal(); } return; }
                if (key === 's') {
                    e.preventDefault();
                    if (HotkeyContext.current() === 'schema-editor' && SchemaEditor.state && SchemaEditor.editingIndex !== null) {
                        SchemaEditor.saveOpenEdit();
                    } else {
                        globalSave();
                    }
                    return;
                }
                if (key === 'c' && HotkeyContext.current() === 'schema-editor' && SchemaEditor.state && SchemaEditor.editingIndex !== null) {
                    e.preventDefault();
                    SchemaEditor.discardOpenEdit();
                    return;
                }
                if (key === 'e') {
                    e.preventDefault();
                    var ctx = HotkeyContext.current();
                    if (ctx === 'schema-editor' && SchemaEditor.state) {
                        SchemaEditor.openSelectedEdit();
                    } else if (ctx === 'schema-view' && window._schemaDetailCurrentTable) {
                        var t = window._schemaDetailCurrentTable;
                        SchemaEditor.openEdit(t.schemaClass, t.dbConnection || sharedFilterState.dbConnection);
                    }
                    return;
                }
                if (key === 'i' && HotkeyContext.current() === 'schema-editor' && SchemaEditor.state && SchemaEditor.editingIndex === null) { e.preventDefault(); SchemaEditor.jumpToRelated(); return; }
                if (key === 'j' && HotkeyContext.current() === 'schema-editor' && SchemaEditor.state) { e.preventDefault(); SchemaEditor.cycleTab(-1); return; }
                if (key === 'k' && HotkeyContext.current() === 'schema-editor' && SchemaEditor.state) { e.preventDefault(); SchemaEditor.cycleTab(1); return; }
                if (key === '/' || e.key === '?') { e.preventDefault(); showHotkeyModal(); return; }
            });
            document.getElementById('model-search').addEventListener('input', function(e) { filterModelList(e.target.value); });
            document.getElementById('explorer-canvas').addEventListener('mousedown', onCanvasMouseDown);
            document.addEventListener('mousemove', onCanvasMouseMove);
            document.addEventListener('mouseup', onCanvasMouseUp);

            // Query Builder canvas drag
            document.getElementById('qb-canvas-area').addEventListener('mousedown', onQbCanvasMouseDown);
            document.addEventListener('mousemove', onQbCanvasMouseMove);
            document.addEventListener('mouseup', onQbCanvasMouseUp);

            // QB bottom panel tabs
            document.querySelectorAll('.qb-panel-tab').forEach(function(btn) {
                btn.addEventListener('click', function() { switchQbPanel(btn.dataset.qbpanel); });
            });

            // QB modal close
            document.getElementById('qb-modal-close').addEventListener('click', closeQbModal);
            document.getElementById('qb-modal').addEventListener('click', function(e) {
                if (e.target === this) closeQbModal();
            });
        }

        function updateQueryParams(params) {
            var url = new URL(window.location);
            Object.keys(params).forEach(function(key) {
                if (params[key] === null || params[key] === undefined) {
                    url.searchParams.delete(key);
                } else {
                    url.searchParams.set(key, params[key]);
                }
            });
            history.replaceState(null, '', url);
        }

        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
            document.getElementById('health-tab').hidden = tab !== 'health';
            document.getElementById('explorer-tab').hidden = tab !== 'explorer';
            document.getElementById('query-builder-tab').hidden = tab !== 'query-builder';
            document.getElementById('schemas-tab').hidden = tab !== 'schemas';
            document.getElementById('status-tab').hidden = tab !== 'status';
            document.getElementById('generate-tab').hidden = tab !== 'apis';
            document.getElementById('actions-tab').hidden = tab !== 'actions';
            document.getElementById('generators-tab').hidden = tab !== 'generators';
            document.getElementById('docs-tab').hidden = tab !== 'docs';

            updateQueryParams({ tab: tab });
            if (tab !== 'apis') {
                updateQueryParams({ api: null, stack: null });
            }
            if (tab !== 'actions') {
                updateQueryParams({ actSchema: null, actAction: null });
            }

            if (tab === 'query-builder') initQueryBuilder();
            if (tab === 'schemas') {
                initSchemasTab();
                // Re-sync shared filters in case they changed on another tab
                if (schemasInitialized) {
                    syncSharedFiltersToUI();
                    if (sharedFilterState.tables) {
                        schemasState.tables = sharedFilterState.tables;
                        renderTableList();
                    }
                }
            }
            if (tab === 'health' && healthInitialized) {
                syncSharedFiltersToUI();
                renderHealthContent();
            }
            if (tab === 'status') initStatusTab();
            if (tab === 'apis') initGenerateTab();
            if (tab === 'actions') initActionsTab();
            if (tab === 'generators') {
                initGeneratorsTab();
                // Auto-focus the search field whenever the tab is activated
                setTimeout(function() {
                    var s = document.getElementById('genr-search');
                    if (s) { s.focus(); s.select(); }
                }, 0);
            }
            if (tab === 'docs') initDocsTab();
        }

        function toggleTheme() {
            var html = document.documentElement;
            var next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            document.getElementById('theme-toggle').textContent = next === 'dark' ? 'Light' : 'Dark';
        }

        // ── Health Tab ─────────────────────────────────────
        var healthInitialized = false;

        function renderHealthTab() {
            var container = document.getElementById('health-tab');

            // Build the filter bar + content area (rendered once)
            var html = '<div class="sc-panel" style="margin-bottom: 16px;">' +
                '<div class="sc-panel-body" style="padding: 12px 16px;">' +
                    '<div class="sc-form-group" style="margin-bottom: 8px;">' +
                        '<label class="sc-form-label">Database Connection</label>' +
                        '<select class="sc-input" id="health-db-connection" style="width: 100%;"><option>Loading...</option></select>' +
                    '</div>' +
                    '<div class="sc-import-filters" id="health-import-filters">' +
                        '<button class="sc-filter-tab active" data-filter="all">All</button>' +
                        '<button class="sc-filter-tab" data-filter="not-imported">Not Imported</button>' +
                        '<button class="sc-filter-tab" data-filter="needs-migration">Needs Migration</button>' +
                        '<button class="sc-filter-tab" data-filter="needs-factory-test">Needs Factory+Test</button>' +

            loadSharedConnections(function() {

                    renderHealthContent();
                    healthInitialized = true;
                });
