                        '<pre class="act-service-code" id="act-filament-preview" style="display:none;"></pre>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            function close() { overlay.remove(); }
            overlay.querySelector('#act-modal-close').addEventListener('click', close);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });

            // Generate / Regenerate service method
            overlay.querySelector('#act-modal-gen-service').addEventListener('click', function() {
                var btn = this;

                if (action.serviceMethodExists) {
                    // Show diff preview first
                    btn.disabled = true;
                    btn.textContent = 'Loading preview...';

                    fetch('/_schema-craft/api/actions/service-preview?action=' + encodeURIComponent(action.actionClass), {
                        headers: { 'Accept': 'application/json' },
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        btn.disabled = false;
                        btn.textContent = genBtnLabel;
                        if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }

                        var files = [{
                            path: data.servicePath,
                            content: data.newContent,
                            exists: data.exists,
                            existingContent: data.existingContent,
                        }];

                        // TODO(debugContext): Medium to wire — this is a GET (query param) not a POST body,
                        // and the files array is built manually from individual response fields rather than
                        // directly from data.files. Pass: { endpoint: 'GET /_schema-craft/api/actions/service-preview',
                        // request: { action: action.actionClass }, response: data }
                        showFilePreviewModal(files, 'Regenerate Service', function() {
                            doGenerateService(action.actionClass, btn, genBtnLabel);
                        });
                    })
                    .catch(function(e) {
                        btn.disabled = false;
                        btn.textContent = genBtnLabel;
                        showToast('Error: ' + e.message, 'error');
                    });
                } else {
                    doGenerateService(action.actionClass, btn, genBtnLabel);
                }
            });

            function doGenerateService(actionClass, btn, label) {
                btn.disabled = true;
                btn.textContent = 'Generating...';

                fetch('/_schema-craft/api/actions/generate-service', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: actionClass }),
                })
                .then(handleResponse)
                .then(function(data) {
                    btn.disabled = false;
                    btn.textContent = 'Regenerate Service Method';
                    if (data.success) {
                        showToast(data.message, 'success');
                        action.serviceMethodExists = true;
                    } else {
                        showToast(data.message || 'Generation failed.', 'error');
                    }
                })
                .catch(function(e) {
                    btn.disabled = false;
                    btn.textContent = label;
                    showToast('Error: ' + e.message, 'error');
                });
            }

            // Publish Filament Action button
            overlay.querySelector('#act-modal-publish-filament').addEventListener('click', function() {
                var btn = this;
                var previewEl = overlay.querySelector('#act-filament-preview');

                // First fetch preview
                btn.disabled = true;
                btn.textContent = 'Loading preview...';

                fetch('/_schema-craft/api/actions/filament-action-preview?action=' + encodeURIComponent(action.actionClass), {
                    headers: { 'Accept': 'application/json' },
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) {
                        btn.disabled = false;
                        btn.textContent = 'Publish Filament Action';
                        showToast(data.message || 'Preview failed.', 'error');
                        return;
                    }

                    // Show the preview
                    previewEl.textContent = data.methodCode;
                    previewEl.style.display = 'block';

                    // Change button to confirm
                    btn.textContent = data.hasExistingMethod ? 'Overwrite & Publish' : 'Confirm & Publish';
                    btn.disabled = false;

                    // Replace click handler for confirmation
                    btn.onclick = function() {
                        btn.disabled = true;
                        btn.textContent = 'Publishing...';

                        fetch('/_schema-craft/api/actions/publish-filament-action', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({
                                action: action.actionClass,
                                force: data.hasExistingMethod,
                            }),
                        })
                        .then(handleResponse)
                        .then(function(result) {
                            btn.disabled = false;
                            if (result.success) {
                                btn.textContent = 'Published!';
                                btn.style.background = 'var(--success)';
                                showToast(result.message, 'success');
                            } else {
                                btn.textContent = 'Publish Filament Action';
                                showToast(result.message || 'Publish failed.', 'error');
                            }
                        })
                        .catch(function(e) {
                            btn.disabled = false;
                            btn.textContent = 'Publish Filament Action';
                            showToast('Error: ' + e.message, 'error');
                        });
                    };
                })
                .catch(function(e) {
                    btn.disabled = false;
                    btn.textContent = 'Publish Filament Action';
                    showToast('Error: ' + e.message, 'error');
                });
            });

            // Docs button — opens usage reference for this specific action
            overlay.querySelector('#act-modal-docs').addEventListener('click', function() {
                showActionsDocsModal(action);
            });

            // Edit action button
            overlay.querySelector('#act-modal-edit').addEventListener('click', function() {
                close();
                showEditActionModal(action);
            });
        }

        function showEditActionModal(action) {
            // Find the schema for this action
            var schemaClass = action.schemaClass;
            var schema = null;
            if (actionsConfig && actionsConfig.schemas) {
                schema = actionsConfig.schemas.find(function(s) { return s.class === schemaClass; });
            }
            if (!schema) {
                showToast('Schema not found for this action.', 'error');
                return;
            }

            // Derive selected columns from parameters
            var selectedColumns = [];
            var nullableOverrides = {};
            action.parameters.forEach(function(p) {
                if (p.isNestedRelationship && p.nestedRelationship) {
                    var nr = p.nestedRelationship;
                    var prefix = nr.name;
                    var wildcard = nr.isCollection ? '.*.' : '.';
                    nr.fields.forEach(function(f) {
                        selectedColumns.push(prefix + wildcard + f.name);
                    });
                } else if (p.isModel && p.foreignKeyColumn) {
                    selectedColumns.push(p.foreignKeyColumn);
                } else {
                    selectedColumns.push(p.columnName || p.name);
                }
            });

            // Open field picker with pre-populated selections
            var actionBaseName = action.name;
            showFieldPickerModal(schema, actionBaseName, action.httpMethod, {
                selectedColumns: selectedColumns,
                nullableOverrides: nullableOverrides,
                description: action.description || '',
                isEdit: true,
            });
        }

        function showFieldPickerModal(schema, actionName, httpMethod, editOptions) {
            var overlay = document.createElement('div');
            overlay.className = 'fp-overlay';

            // Separate flat columns from nested relationships
            var flatColumns = [];
            var nestedRelationships = [];
            if (schema.columns && schema.columns.length > 0) {
                schema.columns.forEach(function(col) {
                    if (col.isNestedRelationship) {
                        nestedRelationships.push(col);
                    } else {
                        flatColumns.push(col);
                    }
                });
            }

            // Build flat field items
            var fieldsHtml = '';
            flatColumns.forEach(function(col, idx) {
                var isNullable = col.nullable;
                var badges = '';
                if (col.isRelationship) badges += '<span class="act-field-badge fk">FK</span>';

                fieldsHtml += '<div class="act-field-item" data-col="' + escapeAttr(col.name) + '" data-nullable="' + (isNullable ? '1' : '0') + '">' +
                    '<input type="checkbox" id="act-fp-col-' + idx + '" value="' + escapeAttr(col.name) + '">' +
                    '<span class="act-field-item-name">' + escapeHtml(col.name) + '</span>' +
                    '<span class="act-field-item-type">' + escapeHtml(col.type) + '</span>' +
                    '<span class="act-field-item-badges">' + badges + '</span>' +
                    '<button class="act-nullable-toggle ' + (isNullable ? 'optional' : 'required') + '" data-col="' + escapeAttr(col.name) + '">' +
                        (isNullable ? 'Optional' : 'Required') +
                    '</button>' +
                '</div>';
            });

            // Build nested relationship sections
            var relHtml = '';
            if (nestedRelationships.length > 0) {
                relHtml = '<div style="margin-top:16px;">' +
                    '<span style="font-size:13px;font-weight:600;color:var(--text-primary);display:block;margin-bottom:8px;">Relationships</span>';

                nestedRelationships.forEach(function(rel) {
                    var isCollection = rel.isCollection;
                    var typeBadgeClass = isCollection ? 'act-rel-type-badge collection' : 'act-rel-type-badge';
                    var modelBaseName = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';

                    relHtml += '<div class="act-rel-group" data-rel="' + escapeAttr(rel.name) + '" data-model="' + escapeAttr(rel.relatedModel || '') + '" data-collection="' + (isCollection ? '1' : '0') + '" data-parentpath="">' +
                        '<div class="act-rel-header" data-rel="' + escapeAttr(rel.name) + '">' +
                            '<span class="act-rel-arrow">&#9654;</span>' +
                            '<span class="act-rel-name">' + escapeHtml(rel.name) + '</span>' +
                            '<span class="' + typeBadgeClass + '">' + escapeHtml(rel.type) + '</span>' +
                            '<span class="act-rel-model">' + escapeHtml(modelBaseName) + '</span>' +
                        '</div>' +
                        '<div class="act-rel-body" style="display:none;" data-rel-body="' + escapeAttr(rel.name) + '">' +
                            '<div class="act-rel-loading">Loading fields...</div>' +
                        '</div>' +
                    '</div>';
                });

                relHtml += '</div>';
            }

            var isNewAction = !editOptions || !editOptions.isEdit;
            var headerTitle = isNewAction ? 'New Action' : 'Edit Action: ' + escapeHtml(actionName);

            overlay.innerHTML =
                '<div class="fp-modal">' +
                    '<div class="fp-header">' +
                        '<span class="fp-header-title">' + headerTitle + '</span>' +
                        '<button class="fp-close" id="act-fp-close">&times;</button>' +
                    '</div>' +
                    '<div style="padding:20px;max-height:calc(80vh - 120px);overflow-y:auto;">' +
                        (isNewAction ? (
                        '<div style="display:flex;gap:10px;margin-bottom:16px;">' +
                            '<div style="flex:0 0 auto;">' +
                                '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">HTTP Method</label>' +
                                '<select class="sc-select" id="act-fp-method">' +
                                    '<option value="get"' + (httpMethod === 'get' ? ' selected' : '') + '>GET</option>' +
                                    '<option value="post"' + (httpMethod === 'post' ? ' selected' : '') + '>POST</option>' +
                                    '<option value="put"' + (httpMethod === 'put' ? ' selected' : '') + '>PUT</option>' +
                                    '<option value="delete"' + (httpMethod === 'delete' ? ' selected' : '') + '>DELETE</option>' +
                                '</select>' +
                            '</div>' +
                            '<div style="flex:1;">' +
                                '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">Action Name</label>' +
                                '<input type="text" class="sc-input" id="act-fp-name" placeholder="e.g. create, updateAddress, archive" value="' + escapeAttr(actionName) + '">' +
                            '</div>' +
                        '</div>'
                        ) : '') +
                        '<div style="margin-bottom:16px;">' +
                            '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">Description (optional)</label>' +
                            '<input type="text" id="act-fp-description" placeholder="Brief description of what this action does" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text-primary);box-sizing:border-box;">' +
                        '</div>' +
                        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
                            '<span style="font-size:13px;font-weight:600;color:var(--text-primary);">Schema Columns</span>' +
                            '<div style="display:flex;gap:8px;">' +
                                '<button class="sc-btn sm" id="act-fp-all">Select All</button>' +
                                '<button class="sc-btn sm" id="act-fp-none">Clear</button>' +
                            '</div>' +
                        '</div>' +
                        '<div id="act-fp-fields" style="max-height:400px;overflow-y:auto;">' + fieldsHtml + relHtml + '</div>' +
                    '</div>' +
                    '<div class="fp-footer">' +
                        '<button class="sc-btn" id="act-fp-cancel">Cancel</button>' +
                        '<button class="sc-btn" id="act-fp-preview">Preview</button>' +
                        '<button class="sc-btn primary" id="act-fp-create">' + (editOptions && editOptions.isEdit ? 'Update Action' : 'Create Action') + '</button>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            // Bind flat field item click/toggle behavior
            function bindFieldItemEvents(container) {
                container.querySelectorAll('.act-field-item').forEach(function(item) {
                    item.addEventListener('click', function(e) {
                        if (e.target.tagName === 'INPUT' || e.target.classList.contains('act-nullable-toggle')) return;
                        var cb = item.querySelector('input[type="checkbox"]');
                        cb.checked = !cb.checked;
                        item.classList.toggle('selected', cb.checked);
                    });
                    var cb = item.querySelector('input[type="checkbox"]');
                    cb.addEventListener('change', function() {
                        item.classList.toggle('selected', cb.checked);
                    });
                });

                container.querySelectorAll('.act-nullable-toggle').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var isOptional = btn.classList.contains('optional');
                        if (isOptional) {
                            btn.classList.remove('optional');
                            btn.classList.add('required');
                            btn.textContent = 'Required';
                        } else {
                            btn.classList.remove('required');
                            btn.classList.add('optional');
                            btn.textContent = 'Optional';
                        }
                    });
                });
            }

            bindFieldItemEvents(overlay);

            // Pre-populate selections when editing
            if (editOptions) {
                if (editOptions.description) {
                    var descInput = overlay.querySelector('#act-fp-description');
                    if (descInput) descInput.value = editOptions.description;
                }
                if (editOptions.selectedColumns) {
                    editOptions.selectedColumns.forEach(function(col) {
                        var cb = overlay.querySelector('.act-field-item input[type="checkbox"][value="' + CSS.escape(col) + '"]');
                        if (cb) {
                            cb.checked = true;
                            cb.closest('.act-field-item').classList.add('selected');
                        }
                    });
                }
            }

            // Expandable relationship headers — bind click handlers on any container
            var relSchemaCache = {};

            function bindRelHeaderEvents(container) {
                container.querySelectorAll('.act-rel-header').forEach(function(header) {
                    if (header.dataset.bound === '1') return;
                    header.dataset.bound = '1';

                    header.addEventListener('click', function() {
                        var group = header.closest('.act-rel-group');
                        var body = group.querySelector('[data-rel-body="' + header.dataset.rel + '"]');
                        var isExpanded = header.classList.contains('expanded');

                        if (isExpanded) {
                            header.classList.remove('expanded');
                            body.style.display = 'none';
                            return;
                        }

                        header.classList.add('expanded');
                        body.style.display = 'block';

                        // If already loaded, just show
                        if (body.dataset.loaded === '1') return;

                        var modelFqcn = group.dataset.model;
                        var parentPath = group.dataset.parentpath || '';
                        var isCollection = group.dataset.collection === '1';
                        var relName = header.dataset.rel;
                        var wildcard = isCollection ? '.*.' : '.';
                        var dotPrefix = parentPath ? (parentPath + relName) : relName;

                        // Check cache
                        if (relSchemaCache[modelFqcn]) {
                            renderRelatedFields(body, relSchemaCache[modelFqcn], dotPrefix, wildcard);
                            return;
                        }

                        // Fetch related schema columns
                        fetch('/_schema-craft/api/actions/related-schema?model=' + encodeURIComponent(modelFqcn), {
                            headers: { 'Accept': 'application/json' },
                        })
                        .then(handleResponse)
                        .then(function(data) {
                            if (!data.success) {
                                body.innerHTML = '<div class="act-rel-loading">No schema found for this model.</div>';
                                body.dataset.loaded = '1';
                                return;
                            }
                            relSchemaCache[modelFqcn] = data.columns;
                            renderRelatedFields(body, data.columns, dotPrefix, wildcard);
                        })
                        .catch(function() {
                            body.innerHTML = '<div class="act-rel-loading">Failed to load fields.</div>';
                            body.dataset.loaded = '1';
                        });
                    });
                });
            }

            bindRelHeaderEvents(overlay);

            function renderRelatedFields(body, columns, dotPrefix, wildcard) {
                if (!columns || columns.length === 0) {
                    body.innerHTML = '<div class="act-rel-loading">No selectable columns found.</div>';
                    body.dataset.loaded = '1';
                    return;
                }

                var html = '';
                var flatCols = columns.filter(function(c) { return !c.isNestedRelationship; });
                var nestedCols = columns.filter(function(c) { return c.isNestedRelationship; });

                // Render flat field checkboxes
                flatCols.forEach(function(col) {
                    var dotPath = dotPrefix + wildcard + col.name;
                    var isNullable = col.nullable;

                    html += '<div class="act-field-item act-nested-field" data-col="' + escapeAttr(dotPath) + '" data-nullable="' + (isNullable ? '1' : '0') + '">' +
                        '<input type="checkbox" value="' + escapeAttr(dotPath) + '">' +
                        '<span class="act-field-item-name">' + escapeHtml(col.name) + '</span>' +
                        '<span class="act-field-item-type">' + escapeHtml(col.type) + '</span>' +
                        '<span class="act-field-item-badges"></span>' +
                        '<button class="act-nullable-toggle ' + (isNullable ? 'optional' : 'required') + '" data-col="' + escapeAttr(dotPath) + '">' +
                            (isNullable ? 'Optional' : 'Required') +
                        '</button>' +
                    '</div>';
                });

                // Render nested relationship sub-groups (for deep nesting)
                nestedCols.forEach(function(rel) {
                    var isCollection = rel.isCollection;
                    var typeBadgeClass = isCollection ? 'act-rel-type-badge collection' : 'act-rel-type-badge';
                    var modelBaseName = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';
                    var childWildcard = isCollection ? '.*.' : '.';
                    // parentpath stores the accumulated dot prefix + wildcard so children can build on it
                    var childParentPath = dotPrefix + wildcard;

                    html += '<div class="act-rel-group" data-rel="' + escapeAttr(rel.name) + '" data-model="' + escapeAttr(rel.relatedModel || '') + '" data-collection="' + (isCollection ? '1' : '0') + '" data-parentpath="' + escapeAttr(childParentPath) + '">' +
                        '<div class="act-rel-header" data-rel="' + escapeAttr(rel.name) + '">' +
                            '<span class="act-rel-arrow">&#9654;</span>' +
                            '<span class="act-rel-name">' + escapeHtml(rel.name) + '</span>' +
                            '<span class="' + typeBadgeClass + '">' + escapeHtml(rel.type) + '</span>' +
                            '<span class="act-rel-model">' + escapeHtml(modelBaseName) + '</span>' +
                        '</div>' +
                        '<div class="act-rel-body" style="display:none;" data-rel-body="' + escapeAttr(rel.name) + '">' +
                            '<div class="act-rel-loading">Loading fields...</div>' +
                        '</div>' +
                    '</div>';
                });

                body.innerHTML = html;
                body.dataset.loaded = '1';
                bindFieldItemEvents(body);
                bindRelHeaderEvents(body);
            }

            overlay.querySelector('#act-fp-all').addEventListener('click', function() {
                overlay.querySelectorAll('.act-field-item:not(.act-nested-field) input[type="checkbox"]').forEach(function(cb) {
                    cb.checked = true;
                    cb.closest('.act-field-item').classList.add('selected');
                });
            });
            overlay.querySelector('#act-fp-none').addEventListener('click', function() {
                overlay.querySelectorAll('.act-field-item input[type="checkbox"]').forEach(function(cb) {
                    cb.checked = false;
                    cb.closest('.act-field-item').classList.remove('selected');
                });
            });

            function close() { overlay.remove(); }
            overlay.querySelector('#act-fp-close').addEventListener('click', close);
            overlay.querySelector('#act-fp-cancel').addEventListener('click', close);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });

            function getPayload() {
                // Read action name and method from modal inputs for new actions
                var currentActionName = actionName;
                var currentHttpMethod = httpMethod;
                if (isNewAction) {
                    var nameInput = overlay.querySelector('#act-fp-name');
                    currentActionName = nameInput ? nameInput.value.trim() : '';
                    if (!currentActionName) { showToast('Enter an action name.', 'warning'); nameInput && nameInput.focus(); return null; }
                    var methodSelect = overlay.querySelector('#act-fp-method');
                    currentHttpMethod = methodSelect ? methodSelect.value : 'put';
                }

                var selectedColumns = [];
                var nullableOverrides = {};

                overlay.querySelectorAll('#act-fp-fields .act-field-item').forEach(function(item) {
                    var cb = item.querySelector('input[type="checkbox"]');
                    if (!cb.checked) return;

                    var colName = cb.value;
                    selectedColumns.push(colName);

                    // Check if the user changed nullable from the schema default
                    var originalNullable = item.dataset.nullable === '1';
                    var toggle = item.querySelector('.act-nullable-toggle');
                    var currentNullable = toggle.classList.contains('optional');

                    if (currentNullable !== originalNullable) {
                        nullableOverrides[colName] = currentNullable;
                    }
                });

                var descInput = overlay.querySelector('#act-fp-description');
                var description = descInput ? descInput.value.trim() : '';

                var payload = {
                    schema: schema.class,
                    actionName: currentActionName,
                    selectedColumns: selectedColumns,
                    httpMethod: currentHttpMethod,
                };

                if (description) {
                    payload.description = description;
                }

                if (Object.keys(nullableOverrides).length > 0) {
                    payload.nullableOverrides = nullableOverrides;
                }

                return payload;
            }

            var isEdit = editOptions && editOptions.isEdit;

            overlay.querySelector('#act-fp-preview').addEventListener('click', function() {
                var payload = getPayload();
                if (!payload) return;
                var url = isEdit ? '/_schema-craft/api/actions/update/preview' : '/_schema-craft/api/actions/create/preview';

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }
                    // Don't close the field picker — keep it behind the preview modal
                    showFilePreviewModal(data.files, isEdit ? 'Update Action' : 'Create Action', function() {
                        // Collect skipped file paths from preview
                        var skipFiles = data.files.filter(function(f) { return f.skip; }).map(function(f) { return f.path; });
                        if (skipFiles.length > 0) {
                            payload.skipFiles = skipFiles;
                        }
                        // Close the field picker via event
                        close();
                        actDoWriteAction(payload, schema, isEdit);
                    }, {
                        endpoint: 'POST ' + url,
                        request: payload,
                        response: data,
                    });
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            });

            overlay.querySelector('#act-fp-create').addEventListener('click', function() {
                var payload = getPayload();
                if (!payload) return;
                close();
                actDoWriteAction(payload, schema, isEdit);
            });
        }

        function actDoWriteAction(payload, schema, isEdit) {
            var url = isEdit ? '/_schema-craft/api/actions/update' : '/_schema-craft/api/actions/create';
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
            })
            .then(handleResponse)
            .then(function(data) {
                if (data.success) {
                    showToast(data.message, 'success');
                    // Refresh and re-render
                    actionsInitialized = false;
                    loadActionsConfig(function() {
                        renderActionsMain();
                        actSelectSchema(schema.class);
                    });
                } else {
                    showToast(data.message || 'Action creation failed.', 'error');
                }
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

                if (schema) {
                    var badge = item.querySelector('.gen-stack-item-badge');
                    if (badge) badge.textContent = schema.actions ? schema.actions.length : 0;
                }
            });
        }

                '<div style="margin-bottom:8px;">' + compatTable + '</div>';

            var apiTabContent =
                (isGeneric ? '<div style="padding:8px 12px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:6px;font-size:12px;color:var(--accent);margin-bottom:20px;">Select a schema with actions from the sidebar to see real class names in these examples.</div>' : '') +
                docSection(
                    'Register an API endpoint',
                    httpUpper, 'gen-endpoint-method ' + httpMethod,
                    snippetApi,
                    'Call <code style="font-family:var(--font-mono);font-size:11px;">endpoint()</code> inside a route group. The action\'s HTTP method, route segment, and model binding are all derived automatically from the action definition.'
                ) +
                docSection(
                    'How endpoint() handles the record',
                    null, '',
                    snippetApiPost,
                    null
                );

            // ─ Modal ──────────────────────────────────────────────────────

            var overlay = document.createElement('div');
            overlay.className = 'fp-overlay';
            overlay.innerHTML =
                '<div class="fp-modal" style="max-width:820px;">' +
                    '<div class="fp-header">' +
                        '<span class="fp-header-title">Actions — Usage Reference</span>' +
                        '<div style="display:flex;align-items:center;gap:8px;">' +
                            (isGeneric
                                ? ''
                                : overrideAction
                                    ? '<span style="font-size:12px;color:var(--text-muted);">Docs for <span style="font-family:var(--font-mono);color:var(--text-secondary);">' + escapeHtml(actionShort) + '</span></span>'
                                    : '<span style="font-size:12px;color:var(--text-muted);">Examples using <span style="font-family:var(--font-mono);color:var(--text-secondary);">' + escapeHtml(registryShort) + '</span></span>'
                            ) +
                            '<button class="fp-close" id="act-docs-close">&times;</button>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 20px;">' +
                        '<button class="ep-tab active" id="act-docs-tab-filament">Filament</button>' +
                        '<button class="ep-tab" id="act-docs-tab-api">API</button>' +
                    '</div>' +
                    '<div style="flex:1;overflow-y:auto;padding:24px;" id="act-docs-body">' +
                        '<div id="act-docs-filament">' + filamentTabContent + '</div>' +
                        '<div id="act-docs-api" style="display:none;">' + apiTabContent + '</div>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            function close() { overlay.remove(); }
            overlay.querySelector('#act-docs-close').addEventListener('click', close);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) { close(); } });

            // Tab switching
            overlay.querySelector('#act-docs-tab-filament').addEventListener('click', function() {
                overlay.querySelector('#act-docs-tab-filament').classList.add('active');
                overlay.querySelector('#act-docs-tab-api').classList.remove('active');
                overlay.querySelector('#act-docs-filament').style.display = '';
                overlay.querySelector('#act-docs-api').style.display = 'none';
            });
            overlay.querySelector('#act-docs-tab-api').addEventListener('click', function() {
                overlay.querySelector('#act-docs-tab-api').classList.add('active');
                overlay.querySelector('#act-docs-tab-filament').classList.remove('active');
                overlay.querySelector('#act-docs-api').style.display = '';
                overlay.querySelector('#act-docs-filament').style.display = 'none';
            });
        }

        // ── Generators Tab — Sequential Wizard ────────────────────────────────
        var generatorsInitialized = false;
        var generatorsConfig = null;
        var genrDocsData = null; // parsed GENERATORS.md document

        // Per-run wizard state
        var genWizard = {
            generatorClass: null,
            generatorName: '',
            accumulated: {},        // key → raw value sent to / returned from server
            completedSteps: [],     // [{key, label, type, displayValue}]
            currentStep: null,      // step object from last nextStep response
            done: false,
        };

        // Wizard host: the element the wizard renders into. Defaults to the Generators-tab panel,
        // but the API Docs "Add Action" buttons re-point it at a modal so the SAME wizard runs
        // there (no second generator implementation). Reset on modal close.
        var genHostId = 'genr-content';
        var genModalOverlay = null;      // the modal element while running in a modal, else null
        var genModalOnComplete = null;   // callback fired after a successful run inside the modal
        var genModalSeed = null;         // schema FQCN seeded into the modal (for Restart)

        function initGeneratorsTab() {
            if (generatorsInitialized) return;
            generatorsInitialized = true;

            // Global hotkeys active whenever the generators tab is visible
            document.addEventListener('keydown', function(e) {
                var tab = document.getElementById('generators-tab');
                if (!tab || tab.hidden) { return; }
                var vim = e.metaKey || e.ctrlKey;

                // ⌘R — deselect generator and return to docs (⌘⇧R passes through to browser hard-reload)
                if (vim && e.key === 'r' && !e.shiftKey) {
                    if (!genWizard.generatorClass) { return; }
                    e.preventDefault();
                    genDeselect();
                    return;
                }

                // ⌘J / ⌘K — navigate generator list (global: works from anywhere in the tab)
                if (vim && (e.key === 'j' || e.key === 'k')) {
                    // Only handle if focus is NOT inside a step input (those handle their own vim nav)
                    var stepInput = document.getElementById('genr-step-input');
                    if (stepInput && stepInput.contains(document.activeElement)) { return; }
                    e.preventDefault();
                    genMoveKbFocus(e.key === 'j' ? 1 : -1);
                    return;
                }

                // Enter — select keyboard-focused generator (only when focus is on the search field or list)
                if (e.key === 'Enter') {
                    var search = document.getElementById('genr-search');
                    var list   = document.getElementById('genr-list');
                    if (!search || !list) { return; }
                    var activeEl = document.activeElement;
                    if (activeEl === search || list.contains(activeEl)) {
                        e.preventDefault();
                        genSelectKbFocused();
                    }
                }
            });

            fetch('/_schema-craft/api/generators/config')
                .then(handleResponse)
                .then(function(data) {
                    generatorsConfig = data;
                    renderGeneratorsMain();
                    loadGenrDocs();
                    // Focus search after render (first load — DOM now exists)
                    var s = document.getElementById('genr-search');
                    if (s) { s.focus(); s.select(); }
                })
                .catch(function(e) { showToast('Failed to load generators: ' + e.message, 'error'); });
        }

        function renderGeneratorsMain() {
            var container = document.getElementById('generators-tab');
            var generators = (generatorsConfig && generatorsConfig.generators) ? generatorsConfig.generators : [];

            var listHtml = '';
            generators.forEach(function(g) {
                listHtml += '<li class="gen-stack-item" data-generator="' + escapeAttr(g.class) + '">' +
                    '<span class="gen-stack-item-name">' + escapeHtml(g.name) + '</span>' +
                '</li>';
            });
            if (!listHtml) {
                listHtml = '<li style="padding:16px;color:var(--text-muted);font-size:12px;text-align:center;">No generators found.<br>Create a class extending SchemaCraftGenerator<br>in app/Generators/.</li>';
            }

            container.innerHTML =
                '<div class="gen-main">' +
                    '<div class="gen-sidebar">' +
                        '<div class="gen-sidebar-header"><span class="gen-sidebar-api-name">Custom Generators</span></div>' +
                        '<div class="gen-sidebar-search">' +
                            '<input type="text" id="genr-search" placeholder="Search generators…" autocomplete="off">' +
                        '</div>' +
                        '<ul class="gen-stack-list" id="genr-list">' + listHtml + '</ul>' +
                    '</div>' +
                    '<div class="gen-content" id="genr-content">' +
                        '<div id="genr-docs-panel" class="genr-docs-panel">' +
                            '<div class="genr-docs-loading">Loading documentation…</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            // Click to select
            container.querySelectorAll('#genr-list .gen-stack-item[data-generator]').forEach(function(item) {
                item.addEventListener('click', function() { genSelectGenerator(item.dataset.generator); });
            });

            // Search filtering
            var searchEl = container.querySelector('#genr-search');
            searchEl.addEventListener('input', function() {
                genFilterGenerators(searchEl.value);
            });

            // Keyboard nav within the search field
            searchEl.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' || ((e.metaKey || e.ctrlKey) && e.key === 'j')) {
                    e.preventDefault(); genMoveKbFocus(1);
                } else if (e.key === 'ArrowUp' || ((e.metaKey || e.ctrlKey) && e.key === 'k')) {
                    e.preventDefault(); genMoveKbFocus(-1);
                } else if (e.key === 'Enter') {
                    e.preventDefault(); genSelectKbFocused();
                }
            });
        }

        function genFilterGenerators(term) {
            var list = document.getElementById('genr-list');
            if (!list) { return; }
            var lower = term.toLowerCase();
            list.querySelectorAll('.gen-stack-item[data-generator]').forEach(function(item) {
                var name = (item.querySelector('.gen-stack-item-name') || {}).textContent || '';
                item.style.display = (!lower || name.toLowerCase().indexOf(lower) !== -1) ? '' : 'none';
            });
            // Reset keyboard focus to first visible item
            genSetKbFocus(0);
        }

        function genVisibleItems() {
            var list = document.getElementById('genr-list');
            if (!list) { return []; }
            return Array.from(list.querySelectorAll('.gen-stack-item[data-generator]')).filter(function(el) {
                return el.style.display !== 'none';
            });
        }

        function genSetKbFocus(idx) {
            // Clear from ALL items (including hidden ones) so state is always clean
            var list = document.getElementById('genr-list');
            if (list) {
                list.querySelectorAll('.gen-stack-item.kb-focused').forEach(function(el) {
                    el.classList.remove('kb-focused');
                });
            }
            var items = genVisibleItems();
            if (!items.length) { return; }
            idx = Math.max(0, Math.min(items.length - 1, idx));
            items[idx].classList.add('kb-focused');
            items[idx].scrollIntoView({ block: 'nearest' });
        }

        function genMoveKbFocus(dir) {
            var items = genVisibleItems();
            var current = items.findIndex(function(el) { return el.classList.contains('kb-focused'); });
            genSetKbFocus(current === -1 ? (dir > 0 ? 0 : items.length - 1) : current + dir);
        }

        function genSelectKbFocused() {
            var focused = document.querySelector('#genr-list .gen-stack-item.kb-focused[data-generator]');
            if (focused) { genSelectGenerator(focused.dataset.generator); }
        }

        function loadGenrDocs() {
            if (genrDocsData) { renderGenrDocs(); return; }
            fetch('/_schema-craft/api/generators/docs')
                .then(handleResponse)
                .then(function(data) {
                    genrDocsData = data.document || null;
                    renderGenrDocs();
                })
                .catch(function() {
                    var panel = document.getElementById('genr-docs-panel');
                    if (panel) {
                        panel.innerHTML = '<div class="genr-docs-loading">Could not load generator documentation.</div>';
                    }
                });
        }

        function renderGenrDocs() {
            var panel = document.getElementById('genr-docs-panel');
            if (!panel) { return; }

            if (!genrDocsData) {
                panel.innerHTML = '<div class="genr-docs-loading">No documentation available.</div>';
                return;
            }

            if (typeof marked === 'undefined') {
                panel.innerHTML = '<div class="genr-docs-loading">Documentation requires an internet connection for markdown rendering.</div>';
                return;
            }

            marked.setOptions({ gfm: true, breaks: false });

            var toc = '';
            var content = '';

            genrDocsData.sections.forEach(function(s) {
                var slug = 'genrdoc-' + escapeAttr(s.slug);
                toc += '<li class="genr-docs-toc-item" data-slug="' + slug + '">' + escapeHtml(s.title) + '</li>';
                content += '<div class="docs-section" id="' + slug + '">' + marked.parse(s.content) + '</div>';
            });

            panel.innerHTML =
                '<div class="genr-docs-layout">' +
                    '<div class="genr-docs-toc">' +
                        '<div class="genr-docs-toc-title">' + escapeHtml(genrDocsData.name) + '</div>' +
                        '<ul class="genr-docs-toc-list">' + toc + '</ul>' +
                    '</div>' +
                    '<div class="genr-docs-content docs-article" id="genr-docs-content">' + content + '</div>' +
                '</div>';

            // TOC click → scroll
            panel.querySelectorAll('.genr-docs-toc-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    var target = document.getElementById(item.dataset.slug);
                    var scroller = document.getElementById('genr-docs-content');
                    if (target && scroller) {
                        scroller.scrollTop = target.offsetTop - scroller.offsetTop;
                    }
                });
            });

            // Copy buttons on code blocks
            panel.querySelectorAll('pre').forEach(function(pre) {
                var btn = document.createElement('button');
                btn.className = 'docs-copy-btn';
                btn.textContent = 'Copy';
                btn.addEventListener('click', function() {
                    var code = pre.querySelector('code');
                    if (code) {
                        navigator.clipboard.writeText(code.textContent).then(function() {
                            btn.textContent = 'Copied!';
                            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
                        });
                    }
                });
                pre.appendChild(btn);
            });
        }

        function showGenrDocs() {
            var content = document.getElementById(genHostId);
            if (!content) { return; }
            content.innerHTML = '<div id="genr-docs-panel" class="genr-docs-panel"><div class="genr-docs-loading">Loading documentation…</div></div>';
            loadGenrDocs();
        }

        function genDeselect() {
            // In modal mode "Restart" restarts the same wizard in-place (re-applying the seed),
            // rather than navigating back to the Generators-tab docs panel (which isn't present).
            if (genModalOverlay) {
                genWizard = {
                    generatorClass: genWizard.generatorClass,
                    generatorName: genWizard.generatorName,
                    accumulated: genModalSeed ? { schema: genModalSeed } : {},
                    completedSteps: [], currentStep: null, done: false,
                };
                genCallNextStep();
                return;
            }

            genWizard = { generatorClass: null, generatorName: '', accumulated: {}, completedSteps: [], currentStep: null, done: false };
            document.querySelectorAll('#genr-list .gen-stack-item').forEach(function(item) {
                item.classList.remove('active');
            });
            showGenrDocs();
            var s = document.getElementById('genr-search');
            if (s) { s.focus(); }
        }

        // Tear down the wizard modal and restore the default (Generators-tab) host.
        function genCloseModal() {
            if (genModalOverlay) { genModalOverlay.remove(); }
            genModalOverlay = null;
            genModalOnComplete = null;
            genModalSeed = null;
            genHostId = 'genr-content';
            genWizard = { generatorClass: null, generatorName: '', accumulated: {}, completedSteps: [], currentStep: null, done: false };
        }

        // Launch the Action generator inside a modal — the same wizard engine, hosted here instead
        // of the Generators tab. seedSchema (FQCN, optional) pre-selects the schema (per-group "+ Add");
        // omit it to start at the generator's schema picker (top "Add Action"). onComplete fires after
        // a successful run so the docs can refresh in place.
        function genLaunchActionModal(seedSchema, onComplete) {
            function open(def) {
                var overlay = document.createElement('div');
                overlay.className = 'act-overlay-backdrop';
                overlay.innerHTML =
                    '<div class="act-overlay-panel" style="max-width:720px;width:100%;height:80vh;max-height:80vh;display:flex;flex-direction:column;">' +
                        '<div class="act-overlay-header">' +
                            '<span class="act-overlay-title">Add API Action</span>' +
                            '<button class="act-overlay-close" id="genr-modal-close">&times;</button>' +
                        '</div>' +
                        // Single scroll container: the body. The host is a plain div (NOT .gen-content,
                        // which adds its own overflow and would clip the schema dropdown against a short box).
                        '<div class="act-overlay-body" style="padding:0;">' +
                            '<div id="genr-modal-content"></div>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(overlay);
                overlay.querySelector('#genr-modal-close').addEventListener('click', function() { genCloseModal(); });

                genModalOverlay = overlay;
                genModalOnComplete = onComplete || null;
                genModalSeed = seedSchema || null;
                genHostId = 'genr-modal-content';

                genWizard = {
                    generatorClass: def.class,
                    generatorName: def.name,
                    accumulated: seedSchema ? { schema: seedSchema } : {},
                    completedSteps: [], currentStep: null, done: false,
                };
                genCallNextStep();
            }

            function findActionDef() {
                return (generatorsConfig && generatorsConfig.generators || []).find(function(g) {
                    return /\\ActionGenerator$/.test(g.class) || g.name === 'Action';
                });
            }

            var def = findActionDef();
            if (def) { open(def); return; }

            // Generators config not loaded yet (user hasn't visited the Generators tab) — fetch it.
            fetch('/_schema-craft/api/generators/config')
                .then(handleResponse)
                .then(function(data) {
                    generatorsConfig = data;
                    var d = findActionDef();
                    if (!d) { showToast('Action generator not found.', 'error'); return; }
                    open(d);
                })
                .catch(function(e) { showToast('Could not load generators: ' + e.message, 'error'); });
        }

        function genSelectGenerator(generatorClass) {
            // Highlight sidebar
            document.querySelectorAll('#genr-list .gen-stack-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.generator === generatorClass);
            });

            var def = (generatorsConfig.generators || []).find(function(g) { return g.class === generatorClass; });
            if (!def) { showToast('Generator not found.', 'error'); return; }

            // Reset wizard
            genWizard = { generatorClass: generatorClass, generatorName: def.name, accumulated: {}, completedSteps: [], currentStep: null, done: false };
            genCallNextStep();
        }

        // ── Wizard engine ──────────────────────────────────────────────────────

        function genCallNextStep() {
            var content = document.getElementById(genHostId);
            content.innerHTML = '<div style="padding:24px;color:var(--text-muted);font-size:13px;">Loading…</div>';

            fetch('/_schema-craft/api/generators/next-step', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify({ generator: genWizard.generatorClass, accumulated: genWizard.accumulated }),
            })
                .then(handleResponse)
                .then(function(data) {
                    // Absorb any auto-computed values into accumulated (silently)
                    var computed = data.computed || {};
                    Object.keys(computed).forEach(function(key) {
                        genWizard.accumulated[key] = computed[key].value;
                    });

                    if (data.done) {
                        genWizard.done = true;
                        genRenderDone();
                    } else {
                        genWizard.currentStep = data.step;
                        genRenderStep(data.step, computed);
                    }
                })
                .catch(function(e) { showToast('Wizard error: ' + e.message, 'error'); });
        }

        function genRenderStep(step, newComputed) {
            var content = document.getElementById(genHostId);

            var summaryHtml = genBuildSummaryHtml();
            var computedRowsHtml = genBuildComputedRowsHtml(newComputed);
            var inputHtml = genBuildStepInputHtml(step);

            var descHtml = step.description
                ? '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;margin-bottom:8px;">' + escapeHtml(step.description) + '</div>'
                : '';

            content.innerHTML =
                '<div class="gen-stack-detail">' +
                    '<div class="gen-stack-header">' +
                        '<span class="gen-stack-title">' + escapeHtml(genWizard.generatorName) + '</span>' +
                        '<button type="button" id="genr-restart-btn" class="sc-btn sm" style="margin-left:auto;" title="Restart from beginning">↺ Restart</button>' +
                    '</div>' +
                    '<div style="padding:20px;">' +
                        summaryHtml +
                        computedRowsHtml +
                        '<div class="gen-endpoint-section-title" style="margin-bottom:8px;">' + escapeHtml(step.label) + '</div>' +
                        descHtml +
                        '<div id="genr-step-input">' + inputHtml + '</div>' +
                        '<div style="display:flex;gap:8px;margin-top:16px;">' +
                            '<button class="sc-btn primary" id="genr-next-btn">Next →</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            // Bind events on the newly-rendered step
            var stepEl = content.querySelector('#genr-step-input');
            genBindStepEvents(step, stepEl);
            bindCollectionEvents(content);

            // Restart button — returns to docs (deselects generator)
            content.querySelector('#genr-restart-btn').addEventListener('click', function() {
                genDeselect();
            });

            // Auto-focus the first interactive input in the step
            var firstInput = content.querySelector('#genr-step-input input:not([type=hidden]):not([type=checkbox]), #genr-step-input select');
            if (firstInput) { firstInput.focus(); }

            // Enter key on the step area → advance (unless inside a textarea or the filter dropdown is open)
            content.querySelector('#genr-step-input').addEventListener('keydown', function(e) {
                if (e.key !== 'Enter') { return; }
                var filterWidget = e.target.closest('.sc-filter-select');
                if (filterWidget) {
                    var hiddenInp = filterWidget.querySelector('.sc-filter-select-value');
                    var allowCustom = filterWidget.dataset.allowCustom === '1';
                    var hasFocusedOpt = !!filterWidget.querySelector('.sc-filter-select-option.focused');

                    if (hasFocusedOpt) {
                        // The sc-filter-select's own listener already ran (inner listeners fire before
                        // bubbled ones), so hidden.value is now set. Advance if selection succeeded.
                        if (!hiddenInp || !hiddenInp.value) { return; }

                        // schemaSelector with column/rel selection: Enter selects the schema but should
                        // NOT advance — the user must review/deselect columns, then click Next.
                        if (step.type === 'schemaSelector' && (step.selectColumns || step.selectRelationships)) {
                            return;
                        }

                        // fall through to advance
                    } else {
                        // No focused option — require a committed value unless allow-custom
                        var textInput = filterWidget.querySelector('.sc-filter-select-input');
                        var hasText = textInput && textInput.value.trim() !== '';
                        if (!allowCustom && (!hiddenInp || !hiddenInp.value)) { return; }
                        if (allowCustom && !hasText && (!hiddenInp || !hiddenInp.value)) { return; }
                    }
                }
                if (e.target.tagName === 'TEXTAREA') { return; }
                e.preventDefault();
                content.querySelector('#genr-next-btn').click();
            });

            // Next button → collect value, push to accumulated, advance
            content.querySelector('#genr-next-btn').addEventListener('click', function() {
                var value = genCollectStepValue(step, stepEl);
                if (value === null || value === undefined || value === '') {
                    // Allow empty for optional steps; skip validation for now
                }
                genWizard.accumulated[step.key] = value;
                genWizard.completedSteps.push({ key: step.key, label: step.label, type: step.type, displayValue: genDisplayValue(step, value) });
                genCallNextStep();
            });
        }

        function genRenderDone() {
            // Skip the intermediate "ready to generate" screen — go straight to preview
            genPreview();
        }

        // ── Summary of completed steps ─────────────────────────────────────────

        function genBuildSummaryHtml() {
            if (!genWizard.completedSteps.length) { return ''; }
            var rows = genWizard.completedSteps.map(function(s) {
                return '<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);">' +
                    '<span style="font-size:11px;color:var(--text-muted);min-width:120px;">' + escapeHtml(s.label) + '</span>' +
                    '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(s.displayValue) + '</span>' +
                '</div>';
            }).join('');
            return '<div style="margin-bottom:20px;padding:12px 16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;">' +
                '<div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">Collected</div>' +
                rows +
            '</div>';
        }

        function genBuildComputedRowsHtml(computed) {
            var keys = Object.keys(computed || {}).filter(function(k) { return computed[k].label; });
            if (!keys.length) { return ''; }
            var rows = keys.map(function(k) {
                var c = computed[k];
                return '<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;">' +
                    '<span style="font-size:11px;color:var(--text-muted);min-width:120px;">' + escapeHtml(c.label || k) + '</span>' +
                    '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(String(c.value !== undefined ? c.value : '')) + '</span>' +
                '</div>';
            }).join('');
            return '<div style="margin-bottom:16px;padding:10px 16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;border-left:3px solid var(--primary);">' +
                rows +
            '</div>';
        }

        // ── Step input renderers ────────────────────────────────────────────────

        function genBuildStepInputHtml(step) {
            var type = step.type;
            var def = step.default;

            if (type === 'schemaSelector') {
                var schemaOpts = (step.schemas || []).map(function(s) {
                    return { label: s.modelName, sublabel: shortName(s.class), value: s.class };
                });
                var optionsJson = escapeAttr(JSON.stringify(schemaOpts));
                var selectCols = step.selectColumns ? '1' : '0';
                var selectRels = step.selectRelationships ? '1' : '0';
                return '<div id="genr-step-field" data-select-columns="' + selectCols + '" data-select-relationships="' + selectRels + '">' +
                    '<div class="sc-filter-select" data-options="' + optionsJson + '">' +
                        '<input type="text" class="sc-input sc-filter-select-input" placeholder="Search schemas…" autocomplete="off">' +
                        '<div class="sc-filter-select-dropdown" style="display:none;"></div>' +
                        '<input type="hidden" class="sc-filter-select-value" value="">' +
                    '</div>' +
                    '<div id="genr-schema-options" style="display:none;margin-top:12px;"></div>' +
                '</div>';
            }

            if (type === 'text') {
                return '<input id="genr-step-field" type="text" class="sc-input" value="' + escapeAttr(def || '') + '" style="width:100%;">';
            }

            if (type === 'boolean') {
                return '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">' +
                    '<input id="genr-step-field" type="checkbox"' + (def ? ' checked' : '') + '>' +
                    '<span style="font-size:13px;">Enabled</span>' +
                '</label>';
            }

            if (type === 'select') {
                var sopts = '';
                var options = step.options || {};
                Object.keys(options).forEach(function(val) {
                    sopts += '<option value="' + escapeAttr(val) + '"' + (def === val ? ' selected' : '') + '>' + escapeHtml(options[val]) + '</option>';
                });
                return '<select id="genr-step-field" class="sc-input">' + sopts + '</select>';
            }

            if (type === 'multiselect') {
                var msDef = Array.isArray(def) ? def : [];
                var msopts = '';
                var msoptions = step.options || {};
                Object.keys(msoptions).forEach(function(val) {
                    msopts += '<option value="' + escapeAttr(val) + '"' + (msDef.indexOf(val) !== -1 ? ' selected' : '') + '>' + escapeHtml(msoptions[val]) + '</option>';
                });
                return '<select id="genr-step-field" class="sc-input" multiple style="height:auto;min-height:80px;">' + msopts + '</select>';
            }

            if (type === 'schemaColumn') {
                var copts = '<option value="">— Select a column —</option>';
                (step.columns || []).forEach(function(col) {
                    copts += '<option value="' + escapeAttr(col.name) + '">' + escapeHtml(col.name) + ' <span style="color:var(--text-muted);">(' + escapeHtml(col.type) + ')</span></option>';
                });
                return '<select id="genr-step-field" class="sc-input">' + copts + '</select>';
            }

            if (type === 'schemaColumnCombobox') {
                var cbCols = (step.columns || []).map(function(col) {
                    return { label: col.name, sublabel: col.type, value: col.name };
                });
                var cbOptsJson = escapeAttr(JSON.stringify(cbCols));
                // Pre-select the default if it matches a column, otherwise pre-fill as free text
                var cbDefault = def || '';
                var cbMatch = cbCols.find(function(c) { return c.value === cbDefault; });
                var cbHiddenVal = cbMatch ? cbDefault : '';
                var cbInputVal  = cbMatch ? cbDefault + ' (' + cbMatch.sublabel + ')' : cbDefault;
                return '<div id="genr-step-field" class="sc-filter-select" data-options="' + cbOptsJson + '" data-allow-custom="1">' +
                    '<input type="text" class="sc-input sc-filter-select-input" placeholder="Search columns or type a custom value…" autocomplete="off" value="' + escapeAttr(cbInputVal) + '">' +
                    '<div class="sc-filter-select-dropdown" style="display:none;"></div>' +
                    '<input type="hidden" class="sc-filter-select-value" value="' + escapeAttr(cbHiddenVal) + '">' +
                '</div>';
            }

            if (type === 'schemaColumns') {
                var cols = step.columns || [];
                if (!cols.length) {
                    return '<div style="color:var(--text-muted);font-size:12px;">No columns available.</div>';
                }
                var html = '<div id="genr-step-field" style="display:flex;flex-direction:column;gap:4px;">';
                cols.forEach(function(col) {
                    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">' +
                        '<input type="checkbox" class="genr-cols-cb" data-col="' + escapeAttr(col.name) + '" checked>' +
                        '<span style="font-size:12px;font-family:monospace;">' + escapeHtml(col.name) + '</span>' +
                        '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(col.type) + ')</span>' +
                    '</label>';
                });
                html += '</div>';
                return html;
            }

            if (type === 'selectResourceDirectory') {
                var dirs = step.directories || {};
                var dirOpts = Object.keys(dirs).map(function(label) {
                    return { label: label, sublabel: dirs[label], value: dirs[label] };
                });
                var dirOptsJson = escapeAttr(JSON.stringify(dirOpts));
                // Pre-select the default path if it matches a known directory
                var dirDefault = step.default || def || '';
                var dirMatch = dirOpts.find(function(o) { return o.value === dirDefault; });
                var dirHiddenVal = dirMatch ? dirDefault : '';
                return '<div id="genr-step-field" class="sc-filter-select" data-options="' + dirOptsJson + '">' +
                    '<input type="text" class="sc-input sc-filter-select-input" placeholder="Search directories…" autocomplete="off">' +
                    '<div class="sc-filter-select-dropdown" style="display:none;"></div>' +
                    '<input type="hidden" class="sc-filter-select-value" value="' + escapeAttr(dirHiddenVal) + '">' +
                '</div>';
            }

            if (type === 'filamentPlacements' || step.renderAs === 'collection') {
                var collectionInput = Object.assign({}, step, { key: 'genr-step-collection' });
                return '<div id="genr-step-field">' + renderCollectionInput(collectionInput) + '</div>';
            }

            if (type === 'schemaFieldPicker' || step.renderAs === 'fieldPicker') {
                return genBuildFieldPickerHtml(step);
            }

            if (type === 'nestedFieldSelector') {
                return genBuildNestedFieldSelectorHtml(step);
            }

            if (step.renderAs === 'apiRegistration') {
                return genBuildApiRegistrationHtml(step);
            }

            return '<input id="genr-step-field" type="text" class="sc-input" value="' + escapeAttr(def || '') + '">';
        }

        // ── API registration widget (renderAs: 'apiRegistration') ───────────────
        //
        // One row per configured API: a checkbox to register the action there, plus a resource
        // picker scoped to that API's resources. "+ New" reuses the create-resource overlay (in
        // apiOverride mode) to build a resource inline and drop it straight into this row's select.
        // Collects to { apiName => resourceFqcn } — exactly what ApiRegistration::writesFor() eats.
        function genBuildApiRegistrationHtml(step) {
            var apis = step.apis || [];
            if (!apis.length) {
                return '<div id="genr-step-field" style="font-size:12px;color:var(--text-muted);">No APIs configured.</div>';
            }

            var html = '<div id="genr-step-field" class="genr-apireg">';
            apis.forEach(function(api) {
                var options = '<option value="">— Select resource —</option>';
                (api.resources || []).forEach(function(r) {
                    options += '<option value="' + escapeAttr(r.class) + '">' + escapeHtml(r.name) + '</option>';
                });

                html +=
                    '<div class="genr-apireg-row" data-api="' + escapeAttr(api.name) + '" style="border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;">' +
                        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">' +
                            '<input type="checkbox" class="genr-api-cb" data-api="' + escapeAttr(api.name) + '">' +
                            '<span style="font-weight:600;font-size:13px;">' + escapeHtml(api.label) + '</span>' +
                            '<span style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">' + escapeHtml(api.routeFile || '') + '</span>' +
                        '</label>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">' +
                            '<select class="sc-input genr-api-resource" data-api="' + escapeAttr(api.name) + '" style="flex:1;min-width:0;" disabled>' + options + '</select>' +
                            '<button type="button" class="sc-btn genr-api-new" data-api="' + escapeAttr(api.name) + '" data-schema="' + escapeAttr(api.schema || '') + '" disabled>+ New</button>' +
                        '</div>' +
                    '</div>';
            });
            html += '</div>';
            return html;
        }

        // ── Nested field selector ──────────────────────────────────────────────

        function genBuildNestedFieldSelectorHtml(step) {
            var columns = step.columns || [];
            var relationships = step.relationships || [];
            var btnStyle = 'background:none;border:none;cursor:pointer;font-size:11px;color:var(--accent);padding:0 4px;';
            var html = '<div id="genr-step-field" class="nfs-picker">';

            // Columns section
            if (columns.length) {
                html += '<div class="nfs-section">' +
                    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
                        '<span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Columns</span>' +
                        '<span>' +
                            '<button type="button" class="nfs-select-all" data-target="cols" style="' + btnStyle + '">Select All</button>' +
                            '<span style="color:var(--border);font-size:10px;">|</span>' +
                            '<button type="button" class="nfs-select-required" data-target="cols" style="' + btnStyle + '">Required Only</button>' +
                            '<span style="color:var(--border);font-size:10px;">|</span>' +
                            '<button type="button" class="nfs-deselect-all" data-target="cols" style="' + btnStyle + '">Deselect All</button>' +
                        '</span>' +
                    '</div>' +
                    '<div class="nfs-cols">';
                columns.forEach(function(col) {
                    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;">' +
                        '<input type="checkbox" class="nfs-col-cb" data-col="' + escapeAttr(col.name) + '" data-nullable="' + (col.nullable ? '1' : '0') + '" data-has-default="' + (col.hasDefault ? '1' : '0') + '">' +
                        '<span style="font-size:12px;font-family:var(--font-mono);">' + escapeHtml(col.name) + '</span>' +
                        '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(col.type) + ')</span>' +
                    '</label>';
                });
                html += '</div></div>';
            }

            // Relationships section
            if (relationships.length) {
                html += '<div class="nfs-section" style="margin-top:' + (columns.length ? '12px' : '0') + ';">' +
                    '<div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Relationships</div>' +
                    '<div class="nfs-rels">';
                relationships.forEach(function(rel) {
                    html += '<div class="nfs-rel-row" data-rel="' + escapeAttr(rel.name) + '" data-model="' + escapeAttr(rel.relatedModelClass) + '">' +
                        '<div class="nfs-rel-header" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0;border-radius:4px;">' +
                            '<span class="nfs-rel-toggle" style="font-size:10px;color:var(--text-muted);width:12px;display:inline-block;">▶</span>' +
                            '<span style="font-size:12px;font-family:var(--font-mono);">' + escapeHtml(rel.name) + '</span>' +
                            '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(rel.type) + ')</span>' +
                        '</div>' +
                        '<div class="nfs-rel-fields" style="display:none;padding-left:20px;margin-bottom:4px;"></div>' +
                    '</div>';
                });
                html += '</div></div>';
            }

            if (!columns.length && !relationships.length) {
                html += '<div style="color:var(--text-muted);font-size:12px;">No fields available. Select a schema first.</div>';
            }

            html += '</div>';
            return html;
        }

        // ── Filterable select ──────────────────────────────────────────────────

        function genInitFilterSelect(container) {
            container.querySelectorAll('.sc-filter-select').forEach(function(widget) {
                if (widget.dataset.initialized) { return; }
                widget.dataset.initialized = '1';

                var input       = widget.querySelector('.sc-filter-select-input');
                var dropdown    = widget.querySelector('.sc-filter-select-dropdown');
                var hidden      = widget.querySelector('.sc-filter-select-value');
                var allowCustom = widget.dataset.allowCustom === '1';
                // Generic format: [{label, sublabel, value}]
                var options  = JSON.parse(widget.dataset.options || '[]');
                var focusIdx = -1;

                function buildLabel(opt) {
                    return opt.sublabel ? opt.label + ' (' + opt.sublabel + ')' : opt.label;
                }

                function renderOptions(filter) {
                    var term = (filter || '').toLowerCase();
                    var matched = options.filter(function(opt) {
                        return !term ||
                            opt.label.toLowerCase().indexOf(term) !== -1 ||
                            (opt.sublabel || '').toLowerCase().indexOf(term) !== -1;
                    });

                    if (!matched.length) {
                        dropdown.innerHTML = '<div class="sc-filter-select-empty">No matches</div>';
                        focusIdx = -1;
                        return;
                    }

                    dropdown.innerHTML = matched.map(function(opt, i) {
                        return '<div class="sc-filter-select-option" data-value="' + escapeAttr(opt.value) + '" data-idx="' + i + '">' +
                            escapeHtml(opt.label) +
                            (opt.sublabel ? '<span class="sc-filter-select-option-sub">' + escapeHtml(opt.sublabel) + '</span>' : '') +
                        '</div>';
                    }).join('');
                    focusIdx = -1;
                }

                function openDropdown() {
                    renderOptions(input.value);
                    dropdown.style.display = 'block';
                }

                function closeDropdown() {
                    dropdown.style.display = 'none';
