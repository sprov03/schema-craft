        function doFilamentAllAction(previewOnly) {
            var schemas = (generateConfig && generateConfig.schemas) ? generateConfig.schemas : [];
            if (!schemas.length) { showToast('No schemas found.', 'error'); return; }

            var withPolicy = document.getElementById('gen-filament-policy-cb').checked;
            var force = document.getElementById('gen-filament-force-cb').checked;

            if (previewOnly) {
                // Preview all by collecting files from each schema
                var allFiles = [];
                var remaining = schemas.length;
                var hadError = false;

                schemas.forEach(function(s) {
                    fetch('/_schema-craft/api/filament/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ schema: s.class, withPolicy: withPolicy }),
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        if (data.success && data.files) {
                            allFiles = allFiles.concat(data.files);
                        }
                        remaining--;
                        if (remaining === 0 && !hadError) {
                            // TODO(debugContext): Hard to wire — allFiles is accumulated from
                            // one filament/preview fetch per schema (schemas.length requests total).
                            // There is no single request body; each schema has its own payload.
                            // The Inspect snapshot would show files + _category values but no
                            // unified request context. Consider passing an array of per-schema
                            // debug entries if full traceability is needed here.
                            showFilePreviewModal(allFiles, 'Generate All Filament', function() {
                                doFilamentGenerateAll(schemas, withPolicy, force);
                            });
                        }
                    })
                    .catch(function(e) {
                        hadError = true;
                        showToast('Error previewing: ' + e.message, 'error');
                    });
                });
            } else {
                doFilamentGenerateAll(schemas, withPolicy, force);
            }
        }

        function doFilamentGenerateAll(schemas, withPolicy, force) {
            var remaining = schemas.length;
            var totalCreated = 0;

            schemas.forEach(function(s) {
                fetch('/_schema-craft/api/filament/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ schema: s.class, withPolicy: withPolicy, force: force }),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (data.success && data.files) {
                        totalCreated += data.files.filter(function(f) { return f.created; }).length;
                    }
                    remaining--;
                    if (remaining === 0) {
                        showToast(totalCreated + ' Filament file(s) created.', 'success');
                    }
                })
                .catch(function() { remaining--; });
            });
        }

        // ── Schema Editor ─────────────────────────────────
        // ── Schema Editor relationship helpers ─────────────────
        function scCamelCase(str) {
            if (!str) return str;
            return str.charAt(0).toLowerCase() + str.slice(1);
        }

        // Fallback pluralizer used when the API cache is cold (e.g. network error).
        function scPluralizeFallback(word) {
            if (!word) return word;
            var low = word.toLowerCase();
            if (low.endsWith('ies')) return word;
            if (low.endsWith('y') && !/[aeiou]y$/.test(low)) return word.slice(0, -1) + 'ies';
            if (low.endsWith('s') || low.endsWith('x') || low.endsWith('z') || low.endsWith('ch') || low.endsWith('sh')) return word + 'es';
            return word + 's';
        }

        // ── Inflect cache ──────────────────────────────────────
        // Keyed by "op:value", e.g. "plural:User" → "Users".
        var scInflectCache = {};

        function scPrewarmInflect(entries, callback) {
            var needed = entries.filter(function(e) {
                return e.value && scInflectCache[e.op + ':' + e.value] === undefined;
            });
            if (!needed.length) { callback(); return; }
            fetch('/_schema-craft/api/str/inflect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ items: needed })
            }).then(handleResponse).then(function(data) {
                (data.results || []).forEach(function(r) {
                    scInflectCache[r.op + ':' + r.value] = r.result;
                });
                callback();
            }).catch(function() { callback(); });
        }

        function scRelInferName(type, modelShort, morphName) {
            if (type === 'morphTo') return morphName || 'morphable';
            var collections = ['hasMany', 'belongsToMany', 'morphMany', 'morphToMany', 'morphedByMany'];
            if (collections.indexOf(type) !== -1) {
                var plural = scInflectCache['plural:' + modelShort] || scPluralizeFallback(modelShort);
                return scCamelCase(plural);
            }
            return scCamelCase(modelShort);
        }
        function scRelInverseType(type) {
            var map = { belongsTo: 'hasMany', hasMany: 'belongsTo', hasOne: 'belongsTo', belongsToMany: 'belongsToMany', morphTo: 'morphMany', morphMany: 'morphTo', morphOne: 'morphTo', morphToMany: 'morphedByMany' };
            return map[type] || null;
        }
        function scModelToSchemaClass(modelFqcn) {
            if (!schemaData || !schemaData.schemas) return null;
            var found = null;
            Object.keys(schemaData.schemas).forEach(function(sc) {
                if ((schemaData.schemas[sc].modelClass || '') === modelFqcn) { found = sc; }
            });
            return found;
        }
        function scSchemaShortName(schemaClass) {
            return schemaClass ? schemaClass.split('\\').pop() : '';
        }
        function scGetAllSchemas() {
            if (!schemaData || !schemaData.schemas) return [];
            return Object.keys(schemaData.schemas).sort();
        }

        var SchemaEditor = {
            state: null,
            isNew: false,
            originalClass: null,
            dbConnection: null,
            activeTab: 'columns',
            editingIndex: null,
            editingType: null,
            selectedIndex: null,
            _editSnapshot: null,
            overlayEl: null,
            availableModels: [],

            openNew: function(dbConnection) {
                this.isNew = true;
                this.originalClass = null;
                this._pendingKey = '__new__';
                this.dbConnection = dbConnection;
                this.state = {
                    schemaName: '',
                    schemaNamespace: 'App\\Schemas',
                    modelNamespace: 'App\\Models',
                    tableName: null,
                    connection: null,
                    hasTimestamps: true,
                    hasSoftDeletes: false,
                    columns: [
                        { name: 'id', phpType: 'int', typeOverride: null, columnType: null, nullable: false, primary: true, autoIncrement: true, unsigned: false, unique: false, index: false, fillable: false, hidden: false, length: null, precision: null, scale: null, default: null, hasDefault: false, expressionDefault: null, castClass: null, renamedFrom: null, rules: null }
                    ],
                    relationships: [],
                    compositeIndexes: []
                };
                this.activeTab = 'columns';
                this.editingIndex = null;
                this.selectedIndex = null;
                HotkeyContext.push('schema-editor');
                this.loadModels();
                this.render();
            },

            openEdit: function(schemaClass, dbConn) {
                var self = this;
                self.isNew = false;
                self.originalClass = schemaClass;
                self._pendingKey = schemaClass;
                self.dbConnection = dbConn;
                self.activeTab = 'columns';
                self.editingIndex = null;
                self.selectedIndex = null;

                var url = '/_schema-craft/api/schema/detail?schema=' + encodeURIComponent(schemaClass);
                if (dbConn) url += '&db_connection=' + encodeURIComponent(dbConn);

                fetch(url)
                    .then(handleResponse)
                    .then(function(data) {

                        self.state = {
                            schemaName: data.schemaName,
                            schemaNamespace: data.schemaNamespace,
                            modelNamespace: data.modelNamespace,
                            tableName: data.customTableName || null,
                            connection: data.connection || null,
                            hasTimestamps: data.hasTimestamps,
                            hasSoftDeletes: data.hasSoftDeletes,
                            columns: data.columns || [],
                            relationships: data.relationships || [],
                            compositeIndexes: data.compositeIndexes || []
                        };
                        HotkeyContext.push('schema-editor');
                        self.loadModels();
                        self.render();
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            loadModels: function() {
                var self = this;
                var url = '/_schema-craft/api/schema/available-models';
                if (self.dbConnection && self.dbConnection !== 'all') url += '?db_connection=' + encodeURIComponent(self.dbConnection);
                fetch(url).then(handleResponse).then(function(data) {
                    self.availableModels = data.models || [];
                    // Re-render relationship forms if open
                    if (self.activeTab === 'relationships' && self.overlayEl) {
                        self.renderBody();
                    }
                }).catch(function() {});
            },

            close: function() {
                HotkeyContext.pop();
                if (this.overlayEl) { this.overlayEl.remove(); this.overlayEl = null; }
                this.state = null;
            },

            render: function() {
                var self = this;
                if (self.overlayEl) self.overlayEl.remove();

                var overlay = document.createElement('div');
                overlay.className = 'se-overlay';
                self.overlayEl = overlay;

                var title = self.isNew ? 'New Schema' : 'Edit ' + self.state.schemaName;

                overlay.innerHTML =
                    '<div class="se-modal">' +
                        '<div class="se-header">' +
                            '<span class="se-header-title">' + escapeHtml(title) + '</span>' +
                            '<button class="se-header-close se-close-btn">&times;</button>' +
                        '</div>' +
                        '<div class="se-tabs" id="se-tabs"></div>' +
                        '<div class="se-body" id="se-body"></div>' +
                        '<div class="se-footer">' +
                            '<button class="sc-btn" id="se-cancel">Cancel</button>' +
                            '<button class="sc-btn" id="se-preview">Preview</button>' +
                            '<button class="sc-btn primary" id="se-save">Save</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(overlay);

                // Close handlers
                overlay.querySelector('.se-close-btn').addEventListener('click', function() { self.close(); });
                overlay.querySelector('#se-cancel').addEventListener('click', function() { removePending(self._pendingKey); self.close(); });
                overlay.addEventListener('click', function(e) { if (e.target === overlay) self.close(); });
                document.addEventListener('keydown', function onEsc(e) {
                    if (e.key === 'Escape' && self.overlayEl) {
                        if (self.editingIndex !== null) {
                            self.discardOpenEdit();
                        } else {
                            self.close();
                            document.removeEventListener('keydown', onEsc);
                        }
                    }
                });

                overlay.querySelector('#se-preview').addEventListener('click', function() { self.doPreview(); });
                overlay.querySelector('#se-save').addEventListener('click', function() { self.doSave(); });

                self.renderTabs();
                self.renderBody();
            },

            _takeSnapshot: function() {
                if (this.editingIndex === null || !this.state) { this._editSnapshot = null; return; }
                var list = this.editingType === 'column' ? this.state.columns : this.state.relationships;
                var item = list[this.editingIndex];
                this._editSnapshot = item ? JSON.parse(JSON.stringify(item)) : null;
            },

            saveOpenEdit: function() {
                if (this.editingIndex === null) return;
                this.commitOpenEdit();
                this._editSnapshot = null;
                this.editingIndex = null;
                this.editingType = null;
                if (this._pendingKey && this.state) {
                    var snapshot = this.buildPayload();
                    if (snapshot) storePending(this._pendingKey, snapshot, this.state.schemaName || 'New Schema');
                }
                this.renderTabs();
                this.renderBody();
            },

            discardOpenEdit: function() {
                if (this.editingIndex === null) return;
                if (this._editSnapshot !== null) {
                    var list = this.editingType === 'column' ? this.state.columns : this.state.relationships;
                    if (list && list[this.editingIndex] !== undefined) {
                        list[this.editingIndex] = this._editSnapshot;
                    }
                }
                this._editSnapshot = null;
                this.editingIndex = null;
                this.editingType = null;
                this.renderBody();
            },

            _tabOrder: ['columns', 'relationships', 'settings'],

            cycleTab: function(dir) {
                var idx = this._tabOrder.indexOf(this.activeTab);
                idx = (idx + dir + this._tabOrder.length) % this._tabOrder.length;
                this.discardOpenEdit();
                this.activeTab = this._tabOrder[idx];
                this.editingIndex = null;
                this.selectedIndex = null;
                this.renderTabs();
                this.renderBody();
            },

            navigateSelection: function(dir) {
                var list = this.activeTab === 'columns' ? this.state.columns : this.state.relationships;
                if (!list || !list.length) return;
                if (this.editingIndex !== null) { this.discardOpenEdit(); return; }
                if (this.selectedIndex === null) {
                    this.selectedIndex = dir > 0 ? 0 : list.length - 1;
                } else {
                    this.selectedIndex = Math.max(0, Math.min(list.length - 1, this.selectedIndex + dir));
                }
                this._applyFocusClass();
            },

            _applyFocusClass: function() {
                if (!this.overlayEl) return;
                var attr = this.activeTab === 'columns' ? 'data-se-col-idx' : 'data-se-rel-idx';
                this.overlayEl.querySelectorAll('.se-item-row').forEach(function(row) {
                    row.classList.remove('focused');
                });
                if (this.selectedIndex !== null) {
                    var sel = this.overlayEl.querySelector('.se-item-row[' + attr + '="' + this.selectedIndex + '"]');
                    if (sel) {
                        sel.classList.add('focused');
                        sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            },

            jumpToRelated: function() {
                if (this.activeTab !== 'relationships' || this.selectedIndex === null) return;
                if (this.editingIndex !== null) return;
                var rel = this.state.relationships[this.selectedIndex];
                if (!rel) return;
                var relSchemaClass = rel.reverseSchemaClass || (rel.relatedModel ? scModelToSchemaClass(rel.relatedModel) : null);
                if (!relSchemaClass) return;
                this.openEdit(relSchemaClass, this.dbConnection);
            },

            openSelectedEdit: function() {
                if (this.selectedIndex === null || this.activeTab === 'settings') return;
                var type = this.activeTab === 'columns' ? 'column' : 'rel';
                if (this.editingIndex === this.selectedIndex && this.editingType === type) {
                    this.discardOpenEdit();
                    return;
                }
                this.discardOpenEdit();
                this.editingIndex = this.selectedIndex;
                this.editingType = type;
                if (type === 'rel') {
                    var rel = this.state.relationships[this.editingIndex];
                    if (rel) rel._detailsOpen = true;
                }
                this._takeSnapshot();
                this.renderBody();
            },

            renderTabs: function() {
                var self = this;
                var tabs = document.getElementById('se-tabs');
                if (!tabs) return;
                var colCount = self.state.columns.length;
                var relCount = self.state.relationships.length;

                tabs.innerHTML =
                    '<button class="se-tab' + (self.activeTab === 'columns' ? ' active' : '') + '" data-se-tab="columns">Columns <span class="se-tab-count">' + colCount + '</span></button>' +
                    '<button class="se-tab' + (self.activeTab === 'relationships' ? ' active' : '') + '" data-se-tab="relationships">Relationships <span class="se-tab-count">' + relCount + '</span></button>' +
                    '<button class="se-tab' + (self.activeTab === 'settings' ? ' active' : '') + '" data-se-tab="settings">Settings</button>';

                tabs.querySelectorAll('.se-tab').forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        self.discardOpenEdit();
                        self.activeTab = tab.dataset.seTab;
                        self.editingIndex = null;
                        self.selectedIndex = null;
                        self.renderTabs();
                        self.renderBody();
                    });
                });

            // Collect all plural inflections needed to render the current relationship list.
            collectRelInflectEntries: function() {
                var entries = [];
                var curShort = this.state.schemaName.replace(/Schema$/, '');
                if (curShort) entries.push({ op: 'plural', value: curShort });
                this.state.relationships.forEach(function(rel) {
                    var modelShort = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';
                    if (modelShort) entries.push({ op: 'plural', value: modelShort });

                return entries;

            renderBody: function() {
                var self = this;
                var body = document.getElementById('se-body');
                if (!body) return;
                if (self.activeTab === 'columns') { self.renderColumnsList(body); self._applyFocusClass(); return; }
                if (self.activeTab === 'settings') { self.renderSettings(body); return; }
                // Relationships tab: pre-warm the inflect cache, then render synchronously.
                scPrewarmInflect(self.collectRelInflectEntries(), function() {
                    self.renderRelationshipsList(body);
                    self._applyFocusClass();
                });

                    self.state.columns.forEach(function(col, i) {

                        if (col.primary) badges += '<span class="se-constraint-badge pk">PK</span>';

                        if (col.nullable) badges += '<span class="se-constraint-badge nullable">Null</span>';

                        if (col.index) badges += '<span class="se-constraint-badge idx">Index</span>';
                        if (col.fillable) badges += '<span class="se-constraint-badge fillable">Fill</span>';
                        if (col.hidden) badges += '<span class="se-constraint-badge hidden">Hide</span>';

                        var typeLabel = col.typeOverride || col.columnType || col.phpType;

                        html += '<div class="se-item-row' + (self.editingIndex === i && self.editingType === 'column' ? ' active' : '') + '" data-se-col-idx="' + i + '">' +

                            '</span>' +

                        if (self.editingIndex === i && self.editingType === 'column') {
                            html += self.renderColumnEditForm(col, i);

                    });
                }

                html += '<button class="se-add-btn" id="se-add-column">+ Add Column</button>';
                body.innerHTML = html;

                // Bind row clicks to toggle edit form
                body.querySelectorAll('.se-item-row[data-se-col-idx]').forEach(function(row) {
                    row.addEventListener('click', function(e) {
                        if (e.target.closest('.se-item-btn')) return;
                        var idx = parseInt(row.dataset.seColIdx, 10);
                        if (self.editingIndex === idx && self.editingType === 'column') {
                            self.discardOpenEdit();
                        } else {
                            self.discardOpenEdit();
                            self.editingIndex = idx; self.editingType = 'column';
                            self.selectedIndex = idx;
                            self._takeSnapshot();
                            self.renderBody();

                // Remove buttons
                body.querySelectorAll('.se-remove-col').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();

                        else if (self.editingIndex > idx) self.editingIndex--;

                        self.renderBody();

                document.getElementById('se-add-column').addEventListener('click', function() {
                    self.saveOpenEdit();
                    self.state.columns.push({
                        name: '', phpType: 'string', typeOverride: null, columnType: null,
                        nullable: false, primary: false, autoIncrement: false, unsigned: false,
                        unique: false, index: false, fillable: true, hidden: false,
                        length: null, precision: null, scale: null, default: null, hasDefault: false,
                        expressionDefault: null, castClass: null, renamedFrom: null, rules: null

                    self.editingIndex = self.state.columns.length - 1;
                    self.editingType = 'column';
                    self.renderTabs();
                    self.renderBody();
                    // Focus the name field
                    var nameInput = document.getElementById('se-col-name');

                        '<label class="se-check"><input type="checkbox" data-field="unique"' + (col.unique ? ' checked' : '') + '> Unique</label>' +
                        '<label class="se-check"><input type="checkbox" data-field="index"' + (col.index ? ' checked' : '') + '> Index</label>' +

            renderRelationshipEditForm: function(rel, idx) {
                var self = this;
                var isMorphTo = rel.type === 'morphTo';
                var isBelongsTo = rel.type === 'belongsTo';
                var isBTM = rel.type === 'belongsToMany';
                var isMorphX = ['morphOne', 'morphMany', 'morphToMany'].indexOf(rel.type) !== -1;
                var needsMorphName = isMorphTo || isMorphX;
                var hasReverse = !isMorphTo;
                var revEnabled = rel.reverseEnabled !== false;
                var currentModelShort = self.state.schemaName.replace(/Schema$/, '');
                var modelShort = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';

                // Resolve reverse defaults
                var revSchemaClass = rel.reverseSchemaClass || (rel.relatedModel ? scModelToSchemaClass(rel.relatedModel) : null);
                var revType = rel.reverseType || scRelInverseType(rel.type) || 'hasMany';
                var revName = rel.reversePropertyName || (revType ? scRelInferName(revType, currentModelShort, null) : '');

                var relTypes = ['belongsTo', 'hasOne', 'hasMany', 'belongsToMany', 'morphTo', 'morphOne', 'morphMany', 'morphToMany'];

                }).join('');

                var onDeleteOpts = ['', 'cascade', 'restrict', 'set null', 'no action'];
                function onDeleteSelect(field, current) {
                    return '<select data-field="' + field + '">' + onDeleteOpts.map(function(o) {
                        return '<option value="' + o + '"' + ((current || '') === o ? ' selected' : '') + '>' + (o || '(none)') + '</option>';

                    html += '<input type="text" class="se-rel-morph-input" id="se-rel-morph" data-field="morphName" ' +

                            '<span class="se-rel-rev-brace">}</span>' +

                    var revSchemaShort = revSchemaClass ? scSchemaShortName(revSchemaClass) : null;
                    html += '<div class="se-rel-details-section-title">Reverse' + (revSchemaShort ? ': ' + escapeHtml(revSchemaShort) : '') + '</div>';
                    if (!revEnabled) {
                        html += '<div style="font-size:12px;color:var(--text-muted);">Reverse disabled. Toggle it in the main line.</div>';
                    } else if (!revSchemaClass) {
                        html += '<div style="font-size:12px;color:var(--text-muted);">No schema found for this model. Select a model first.</div>';
                    } else {
                        var inverseTypeOpts = ['hasMany', 'hasOne', 'belongsTo', 'belongsToMany'];
                        html += '<div class="se-row">' +
                            '<div class="se-field"><label>Type</label>' +
                                '<select data-field="reverseType">' + inverseTypeOpts.map(function(t) {
                                    return '<option value="' + t + '"' + (revType === t ? ' selected' : '') + '>' + t + '</option>';
                                }).join('') + '</select>' +
                            '</div>' +
                            '<div class="se-field"><label>Property Name</label>' +
                                '<input type="text" data-field="reversePropertyName" value="' + escapeAttr(rel.reversePropertyName || revName) + '" placeholder="auto">' +
                            '</div>' +
                        '</div>';
                        if (revType === 'belongsTo') {
                            html += '<div class="se-row">' +
                                '<div class="se-field"><label>FK Column</label><input type="text" data-field="reverseForeignColumn" value="' + escapeAttr(rel.reverseForeignColumn || '') + '" placeholder="auto"></div>' +
                                '<div class="se-field"><label>On Delete</label>' + onDeleteSelect('reverseOnDelete', rel.reverseOnDelete) + '</div>' +
                                '<div class="se-field"><label>On Update</label>' + onDeleteSelect('reverseOnUpdate', rel.reverseOnUpdate) + '</div>' +
                            '</div>' +
                            '<div class="se-row">' +
                                '<div class="se-field"><label>Column Type</label><input type="text" data-field="reverseColumnType" value="' + escapeAttr(rel.reverseColumnType || '') + '" placeholder="e.g. unsignedInteger"></div>' +
                            '</div>' +
                            '<div class="se-row"><div class="se-checks">' +
                                '<label class="se-check"><input type="checkbox" data-field="reverseNullable"' + (rel.reverseNullable ? ' checked' : '') + '> Nullable</label>' +
                                '<label class="se-check"><input type="checkbox" data-field="reverseIndex"' + (rel.reverseIndex !== false ? ' checked' : '') + '> Index</label>' +
                                '<label class="se-check"><input type="checkbox" data-field="reverseNoConstraint"' + (rel.reverseNoConstraint ? ' checked' : '') + '> No Constraint</label>' +
                                '<label class="se-check"><input type="checkbox" data-field="reverseWith"' + (rel.reverseWith ? ' checked' : '') + '> Eager Load</label>' +
                            '</div></div>';
                        } else {
                            html += '<div class="se-row"><div class="se-checks">' +
                                '<label class="se-check"><input type="checkbox" data-field="reverseWith"' + (rel.reverseWith ? ' checked' : '') + '> Eager Load (reverse)</label>' +
                            '</div></div>';
                        }
                        html += '<input type="hidden" data-field="reverseSchemaClass" value="' + escapeAttr(revSchemaClass) + '">';
                        html += '<div class="se-rel-rev-info">Writes to: <code>' + escapeHtml(revSchemaClass) + '</code></div>';
                    }
                }
                html += '</div></div></div>'; // end details-right, details-cols, details-panel

                html += '</div>'; // end se-edit-form

                return html;
            },

            bindRelationshipFormEvents: function(body, idx) {
                var self = this;
                var rel = self.state.relationships[idx];
                if (!rel) return;

                // ── Model picker ──
                var modelInput = document.getElementById('se-rel-model-input');
                var modelDropdown = document.getElementById('se-rel-model-dropdown');
                var modelValue = document.getElementById('se-rel-model-value');
                if (modelInput && modelDropdown && modelValue) {
                    function buildDropdown(filter) {
                        var filtered = self.availableModels.filter(function(m) {
                            var short = m.split('\\').pop().toLowerCase();
                            var full = m.toLowerCase();
                            var q = filter.toLowerCase();
                            return !q || short.indexOf(q) !== -1 || full.indexOf(q) !== -1;
                        });
                        if (filtered.length === 0) {
                            modelDropdown.innerHTML = '<div class="se-rel-model-option" style="color:var(--text-muted);">No models found</div>';
                        } else {
                            modelDropdown.innerHTML = filtered.map(function(m) {
                                var short = m.split('\\').pop();
                                var ns = m.substring(0, m.lastIndexOf('\\'));
                                return '<div class="se-rel-model-option" data-model="' + escapeAttr(m) + '">' +
                                    escapeHtml(short) + '<span class="se-rel-model-option-ns">' + escapeHtml(ns) + '</span>' +
                                '</div>';
                            }).join('');
                        }
                        modelDropdown.style.display = '';
                    }

                    modelInput.addEventListener('focus', function() { buildDropdown(modelInput.value); });
                    modelInput.addEventListener('input', function() { buildDropdown(modelInput.value); });
                    modelInput.addEventListener('blur', function() {
                        setTimeout(function() { modelDropdown.style.display = 'none'; }, 180);
                    });
                    modelDropdown.addEventListener('mousedown', function(e) {
                        var opt = e.target.closest('.se-rel-model-option');
                        if (!opt || !opt.dataset.model) return;
                        var modelFqcn = opt.dataset.model;
                        var short = modelFqcn.split('\\').pop();
                        modelInput.value = short;
                        modelValue.value = modelFqcn;
                        modelDropdown.style.display = 'none';
                        self.commitOpenEdit();
                        var r = self.state.relationships[self.editingIndex];
                        r.relatedModel = modelFqcn;
                        r.reverseSchemaClass = scModelToSchemaClass(modelFqcn);
                        r.reverseType = r.reverseType || scRelInverseType(r.type) || 'hasMany';
                        var curShort = self.state.schemaName.replace(/Schema$/, '');
                        // Pre-warm cache for both model shorts before inferring names.
                        scPrewarmInflect([
                            { op: 'plural', value: short },
                            { op: 'plural', value: curShort }
                        ], function() {
                            r.name = r.name || scRelInferName(r.type, short, r.morphName);
                            r.reversePropertyName = r.reversePropertyName || scRelInferName(r.reverseType, curShort, null);
                            self.renderBody();
                        });
                    });
                }

                // ── Type select → re-infer names ──
                var typeSelect = document.getElementById('se-rel-type');
                if (typeSelect) {
                    typeSelect.addEventListener('change', function() {
                        self.commitOpenEdit();
                        var r = self.state.relationships[self.editingIndex];
                        var modelSh = (r.relatedModel || '').split('\\').pop();
                        var curSh = self.state.schemaName.replace(/Schema$/, '');
                        scPrewarmInflect([
                            { op: 'plural', value: modelSh },
                            { op: 'plural', value: curSh }
                        ], function() {
                            if (modelSh) r.name = scRelInferName(r.type, modelSh, r.morphName);
                            r.reverseType = scRelInverseType(r.type) || r.reverseType;
                            r.reversePropertyName = scRelInferName(r.reverseType || 'hasMany', curSh, null);
                            self.renderBody();
                        });
                    });
                }

                // ── Reverse enabled toggle → re-render ──
                var revCheck = document.getElementById('se-rel-rev-enabled');
                if (revCheck) {
                    revCheck.addEventListener('change', function() {
                        self.commitOpenEdit();
                        self.renderBody();
                    });
                }

                // ── Details button ──
                var detailsBtn = document.getElementById('se-rel-details-btn');
                var detailsPanel = document.getElementById('se-rel-details-panel');
                if (detailsBtn && detailsPanel) {
                    detailsBtn.addEventListener('click', function() {
                        var open = detailsPanel.style.display !== 'none';
                        detailsPanel.style.display = open ? 'none' : '';
                        detailsBtn.classList.toggle('open', !open);
                        self.state.relationships[self.editingIndex]._detailsOpen = !open;
                        if (!open) {
                            // Scroll so the active row sits near the top, keeping other rows visible below
                            var seBody = document.getElementById('se-body');
                            var activeRow = body.querySelector('.se-item-row.active');
                            if (seBody && activeRow) {
                                var rowTop = activeRow.getBoundingClientRect().top - seBody.getBoundingClientRect().top + seBody.scrollTop;
                                seBody.scrollTop = Math.max(0, rowTop - 8);
                            }
                        }
                    });
                }

                // ── Morph target remove ──
                body.querySelectorAll('.se-remove-morph-target').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        self.commitOpenEdit();
                        var r = self.state.relationships[self.editingIndex];
                        var ti = parseInt(btn.dataset.morphIdx, 10);
                        r.morphTargets.splice(ti, 1);
                        self.renderBody();
                    });
                });

                // ── Add morph target ──
                var morphAddBtn = document.getElementById('se-morph-add-btn');
                if (morphAddBtn) {
                    morphAddBtn.addEventListener('click', function() {
                        self.commitOpenEdit();
                        var r = self.state.relationships[self.editingIndex];
                        var schemaSelect = document.getElementById('se-morph-add-schema');
                        var sc = schemaSelect ? schemaSelect.value : '';
                        if (!sc) { showToast('Select a schema first', 'warning'); return; }
                        r.morphTargets = r.morphTargets || [];
                        var already = r.morphTargets.some(function(t) { return t.schemaClass === sc; });
                        if (already) { showToast('Already added', 'warning'); return; }
                        var curShort = self.state.schemaName.replace(/Schema$/, '');
                        scPrewarmInflect([{ op: 'plural', value: curShort }], function() {
                            r.morphTargets.push({
                                schemaClass: sc,
                                type: 'morphMany',
                                propertyName: scRelInferName('morphMany', curShort, r.morphName || r.name)
                            });
                            r._detailsOpen = true;
                            self.renderBody();
                        });
                    });
                }
            },

            // ── Settings Tab ──
            renderSettings: function(body) {
                var self = this;
                var s = self.state;
                var html = '<div class="se-section"><div class="se-section-title">Identity</div>' +
                    '<div class="se-row">' +
                        '<div class="se-field" style="flex:2"><label>Schema Name</label><input type="text" id="se-set-name" value="' + escapeAttr(s.schemaName) + '"></div>' +
                        '<div class="se-field"><label>Table Name</label><input type="text" id="se-set-table" value="' + escapeAttr(s.tableName || '') + '" placeholder="(convention-based)"></div>' +
                    '</div>' +
                    '<div class="se-row">' +
                        '<div class="se-field"><label>Schema Namespace</label><input type="text" id="se-set-sns" value="' + escapeAttr(s.schemaNamespace) + '"></div>' +
                        '<div class="se-field"><label>Model Namespace</label><input type="text" id="se-set-mns" value="' + escapeAttr(s.modelNamespace) + '"></div>' +
                        '<div class="se-field"><label>Connection</label><input type="text" id="se-set-conn" value="' + escapeAttr(s.connection || '') + '" placeholder="(default)"></div>' +
                    '</div>' +
                '</div>' +
                '<div class="se-section"><div class="se-section-title">Traits</div>' +
                    '<div class="se-row"><div class="se-checks">' +
                        '<label class="se-check"><input type="checkbox" id="se-set-ts"' + (s.hasTimestamps ? ' checked' : '') + '> Timestamps (created_at, updated_at)</label>' +
                        '<label class="se-check"><input type="checkbox" id="se-set-sd"' + (s.hasSoftDeletes ? ' checked' : '') + '> Soft Deletes (deleted_at)</label>' +
                    '</div></div>' +
                '</div>' +
                '<div class="se-section"><div class="se-section-title">Composite Indexes</div>';

                if (s.compositeIndexes.length > 0) {
                    s.compositeIndexes.forEach(function(ci, i) {
                        html += '<div class="se-composite-row">' +
                            '<span class="se-composite-cols">' + escapeHtml(ci.join(', ')) + '</span>' +
                            '<button class="se-item-btn se-remove-ci" data-idx="' + i + '" title="Remove">&times;</button>' +
                        '</div>';
                    });
                }

                // Get column names for composite index picker
                var colNames = s.columns.map(function(c) { return c.name; }).filter(function(n) { return n; });
                html += '<div class="se-row" style="gap:8px;align-items:flex-end;">' +
                    '<div class="se-field" style="flex:3"><label>Add Composite Index</label><input type="text" id="se-ci-input" placeholder="col1, col2, col3"></div>' +
                    '<button class="sc-btn sm" id="se-add-ci" style="margin-bottom:0;height:33px;">Add</button>' +
                '</div>';

                html += '</div>';
                body.innerHTML = html;

                // Bind settings changes
                var settingsFields = [
                    { id: 'se-set-name', key: 'schemaName' },
                    { id: 'se-set-table', key: 'tableName', nullable: true },
                    { id: 'se-set-sns', key: 'schemaNamespace' },
                    { id: 'se-set-mns', key: 'modelNamespace' },
                    { id: 'se-set-conn', key: 'connection', nullable: true }
                ];
                settingsFields.forEach(function(sf) {
                    var el = document.getElementById(sf.id);
                    if (!el) return;
                    el.addEventListener('change', function() {
                        s[sf.key] = sf.nullable && !el.value ? null : el.value;
                        if (sf.key === 'schemaName') {
                            var titleEl = self.overlayEl.querySelector('.se-header-title');
                            if (titleEl) titleEl.textContent = (self.isNew ? 'New Schema' : 'Edit ') + (s.schemaName || '');
                        }
                    });
                });

                document.getElementById('se-set-ts').addEventListener('change', function() { s.hasTimestamps = this.checked; });
                document.getElementById('se-set-sd').addEventListener('change', function() { s.hasSoftDeletes = this.checked; });

                // Remove composite indexes
                body.querySelectorAll('.se-remove-ci').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        s.compositeIndexes.splice(parseInt(btn.dataset.idx, 10), 1);
                        self.renderBody();
                    });
                });

                // Add composite index
                document.getElementById('se-add-ci').addEventListener('click', function() {
                    var val = document.getElementById('se-ci-input').value.trim();
                    if (!val) return;
                    var cols = val.split(',').map(function(c) { return c.trim(); }).filter(Boolean);
                    if (cols.length < 2) { showToast('Composite index needs at least 2 columns', 'warning'); return; }
                    s.compositeIndexes.push(cols);
                    self.renderBody();
                });
            },

            // ── Commit open edit form values back to state ──
            commitOpenEdit: function() {
                if (this.editingIndex === null) return;
                var form = this.overlayEl ? this.overlayEl.querySelector('.se-edit-form') : null;
                if (!form) return;

                var item = this.editingType === 'column'
                    ? this.state.columns[this.editingIndex]
                    : this.state.relationships[this.editingIndex];
                if (!item) return;

                form.querySelectorAll('[data-field]').forEach(function(el) {
                    var field = el.dataset.field;
                    if (el.type === 'checkbox') {
                        item[field] = el.checked;
                    } else if (el.type === 'number') {
                        item[field] = el.value ? parseInt(el.value, 10) : null;
                    } else if (field === 'rules') {
                        var val = el.value.trim();
                        item[field] = val ? val.split(',').map(function(r) { return r.trim(); }).filter(Boolean) : null;
                    } else if (field === 'pivotColumns') {
                        try { item[field] = el.value ? JSON.parse(el.value) : null; } catch(e) { item[field] = null; }
                    } else if (field === 'default') {
                        item[field] = el.value;
                    } else {
                        item[field] = el.value || null;
                    }
                });

                // Commit morph target edits (type + propertyName per row)
                if (this.editingType === 'rel' && item.morphTargets) {
                    form.querySelectorAll('[data-morph-field]').forEach(function(el) {
                        var field = el.dataset.morphField;
                        var ti = parseInt(el.dataset.morphIdx, 10);
                        if (item.morphTargets[ti] !== undefined) {
                            item.morphTargets[ti][field] = el.value || null;
                        }
                    });
                }

            },

            // ── Build payload for API ──
            buildPayload: function() {
                this.commitOpenEdit();
                var s = this.state;
                if (!s.schemaName) { showToast('Schema name is required', 'warning'); return null; }
                if (s.schemaName.indexOf('Schema') === -1) {
                    s.schemaName = s.schemaName + 'Schema';
                }

                // Derive the current schema's model FQCN for reverse relationship writes
                var modelName = s.schemaName.replace(/Schema$/, '');
                var currentModelFqcn = s.modelNamespace + '\\' + modelName;

                var reverseRelationships = [];
                s.relationships.forEach(function(rel) {
                    if (rel.type === 'morphTo') {
                        (rel.morphTargets || []).forEach(function(target) {
                            if (target.schemaClass && target.type && target.propertyName) {
                                reverseRelationships.push({
                                    schemaClass: target.schemaClass,
                                    type: target.type,
                                    propertyName: target.propertyName,
                                    relatedModelFqcn: currentModelFqcn,
                                    morphName: rel.morphName || rel.name || null
                                });
                            }
                        });
                    } else if (rel.reverseEnabled !== false && rel.reverseSchemaClass && rel.reverseType) {
                        var revOpts = {};
                        if (rel.reverseType === 'belongsTo') {
                            if (rel.reverseForeignColumn) { revOpts.foreignColumn = rel.reverseForeignColumn; }
                            if (rel.reverseOnDelete) { revOpts.onDelete = rel.reverseOnDelete; }
                            if (rel.reverseOnUpdate) { revOpts.onUpdate = rel.reverseOnUpdate; }
                            if (rel.reverseColumnType) { revOpts.columnType = rel.reverseColumnType; }
                            if (rel.reverseNullable) { revOpts.nullable = true; }
                            if (rel.reverseIndex !== false) { revOpts.index = true; }
                            if (rel.reverseNoConstraint) { revOpts.noConstraint = true; }
                            if (rel.reverseWith) { revOpts.with = true; }
                        }
                        reverseRelationships.push({
                            schemaClass: rel.reverseSchemaClass,
                            type: rel.reverseType,
                            propertyName: rel.reversePropertyName || null,
                            relatedModelFqcn: currentModelFqcn,
                            morphName: null,
                            options: revOpts
                        });
                    }
                });

                return {
                    schemaName: s.schemaName,
                    schemaNamespace: s.schemaNamespace,
                    modelNamespace: s.modelNamespace,
                    tableName: s.tableName || null,
                    connection: s.connection || null,
                    hasTimestamps: s.hasTimestamps,
                    hasSoftDeletes: s.hasSoftDeletes,
                    columns: s.columns,
                    relationships: s.relationships,
                    compositeIndexes: s.compositeIndexes,
                    // Only generate the model file when creating a brand-new schema.
                    // For existing schemas the model was already produced at import time
                    // and may contain user customisations — regenerating it on every edit
                    // would silently overwrite those changes and pollute the preview diff
                    // with a file that hasn't actually changed.
                    createModel: this.isNew,
                    reverseRelationships: reverseRelationships
                };
            },

            doPreview: function() {
                var payload = this.buildPayload();
                if (!payload) return;
                fetch('/_schema-craft/api/schema/save/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed', 'error'); return; }
                    showFilePreviewModal(data.files, 'Save Files', function() { SchemaEditor.doSave(); }, {
                        endpoint: 'POST /_schema-craft/api/schema/save/preview',
                        request: payload,
                        response: data,
                    });
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            doSave: function() {
                var self = this;
                var payload = self.buildPayload();
                if (!payload) return;
                fetch('/_schema-craft/api/schema/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Save failed', 'error'); return; }
                    showToast(data.message || 'Schema saved', 'success');
                    removePending(self._pendingKey);
                    self.close();
                    self.promptRegenerateExtras(payload);
                    loadDatabaseTables();
                    refreshSchemaData();
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            promptRegenerateExtras: function(payload) {
                var modelName = payload.schemaName.replace(/Schema$/, '');
                scPrewarmInflect([{ op: 'tableize', value: modelName }], function() {
                    var tableName = scInflectCache['tableize:' + modelName]
                        || (modelName.replace(/([a-z])([A-Z])/g, '$1_$2').toLowerCase() + 's');

                    showConfirmDialog(
                        'Regenerate Extras?',
                        'Would you like to regenerate Factory, Model Test, and Service for ' + modelName + '?',
                        function() {
                        var conn = SchemaEditor.dbConnection;
                        if (conn === 'all') conn = null;
                        fetch('/_schema-craft/api/schema/import/extras', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({
                                tables: [tableName],
                                createFactory: true,
                                createModelTest: true,
                                createService: true,
                                force: true,
                                db_connection: conn
                            })
                        })
                        .then(handleResponse)
                        .then(function(data) {
                            if (data.success) {
                                var s = data.summary || {};
                                var parts = [];
                                if (s.factories > 0) parts.push(s.factories + ' factory');
                                if (s.tests > 0) parts.push(s.tests + ' test');
                                if (s.services > 0) parts.push(s.services + ' service');
                                showToast(parts.join(', ') + ' generated', 'success');
                            }
                        })
                        .catch(function() {});
                    }
                    );
                });
            }
        };

                            '<select class="sc-input" id="act-db-connection" style="width:100%;padding:4px 10px;font-size:12px;"><option>Loading...</option></select>' +
                        '</div>' +

                        '<div class="gen-sidebar-search">' +

                        '</div>' +

            document.getElementById('act-schema-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                    var name = item.querySelector('.gen-stack-item-name');
                    if (name) {
                        var matches = !query || name.textContent.toLowerCase().indexOf(query) !== -1;
                        item.style.display = matches ? '' : 'none';
                    }
                });
            });

            // Schema item clicks
            document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                item.addEventListener('click', function() {
                    actSelectSchema(item.dataset.schema);
                });
            });

            // Apply connection filter on initial render
            filterActionsSchemaList();

            // Restore from query params
            var params = new URLSearchParams(window.location.search);
            if (params.get('actSchema')) {
                actSelectSchema(params.get('actSchema'));
            }
        }

        function filterActionsSchemaList() {
            var conn = sharedFilterState.dbConnection;
            document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                if (!conn || conn === 'all') {
                    item.style.display = '';
                    return;
                }
                var schemaClass = item.dataset.schema;
                var schema = actionsConfig && actionsConfig.schemas
                    ? actionsConfig.schemas.find(function(s) { return s.class === schemaClass; })
                    : null;
                var matches = schema && schema.connection === conn;
                item.style.display = matches ? '' : 'none';
            });

            // If selected schema is now hidden, clear selection
            if (actSelectedSchema) {
                var selectedItem = document.querySelector('#act-schema-list .gen-stack-item[data-schema="' + actSelectedSchema + '"]');
                if (selectedItem && selectedItem.style.display === 'none') {
                    actSelectedSchema = null;
                    actSelectedView = null;
                    var content = document.getElementById('act-content');
                    if (content) content.innerHTML = '<div class="gen-empty-state">Select a schema to view its actions</div>';
                }
            }
        }

        function actSelectSchema(schemaClass) {
            actSelectedSchema = schemaClass;
            actSelectedView = 'detail';
            updateQueryParams({ actSchema: schemaClass });

            // Highlight in sidebar
            document.querySelectorAll('#act-schema-list .gen-stack-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.schema === schemaClass);
            });

            var schema = null;
            if (actionsConfig && actionsConfig.schemas) {
                schema = actionsConfig.schemas.find(function(s) { return s.class === schemaClass; });
            }
            if (!schema) { showToast('Schema not found.', 'error'); return; }

            renderActionsDetail(schema);
        }

        function renderActionsDetail(schema) {
            var content = document.getElementById('act-content');

            // Build action list (like endpoint list in Generate tab)
            var actionsHtml = '';
            if (schema.actions && schema.actions.length > 0) {
                schema.actions.forEach(function(action) {
                    var paramCount = 0;
                    actionsHtml += '<div class="act-action-item" data-action="' + escapeAttr(action.class) + '">' +
                        '<span class="gen-endpoint-method ' + action.httpMethod.toLowerCase() + '">' + action.httpMethod.toUpperCase() + '</span>' +
                        '<span class="act-action-item-name">' + escapeHtml(action.label || action.name) + '</span>' +
                        '<span class="act-action-item-params">' + escapeHtml(shortName(action.class)) + '</span>' +
                    '</div>';
                });
            }

            var badgesHtml = '';
            if (schema.hasRegistry) {
                badgesHtml += '<span class="gen-stack-badge controller">Registry</span>';
            }
            badgesHtml += '<span class="gen-stack-badge service">' + (schema.actions ? schema.actions.length : 0) + ' action' + ((schema.actions && schema.actions.length !== 1) ? 's' : '') + '</span>';

            content.innerHTML =
                '<div class="gen-stack-detail">' +
                    '<div class="gen-stack-header">' +
                        '<span class="gen-stack-title">' + escapeHtml(schema.modelName) + '</span>' +
                        '<span class="gen-stack-route-prefix">' + escapeHtml(shortName(schema.class)) + '</span>' +
                        '<div class="gen-stack-badges">' + badgesHtml + '</div>' +
                    '</div>' +
                    '<div class="gen-endpoint-section-title">Actions (' + (schema.actions ? schema.actions.length : 0) + ')</div>' +
                    '<div class="gen-endpoint-list">' +
                        (actionsHtml || '<div style="padding:16px;color:var(--text-muted);font-size:13px;">No actions defined yet.</div>') +
                    '</div>' +
                    '<div style="padding:16px 20px;border-top:1px solid var(--border);">' +
                        '<button class="sc-btn primary" id="act-new-action-btn" style="width:100%;">New Action</button>' +
                    '</div>' +
                '</div>';

            // Action item clicks — open detail modal
            content.querySelectorAll('.act-action-item[data-action]').forEach(function(item) {
                item.addEventListener('click', function() {
                    showActionDetailModal(item.dataset.action);
                });
            });

            // "New Action" opens the field picker with method + name built in
            document.getElementById('act-new-action-btn').addEventListener('click', function() {
                showFieldPickerModal(schema, '', 'put');
            });
        }

        function showActionDetailModal(actionClass) {
            fetch('/_schema-craft/api/actions/detail?action=' + encodeURIComponent(actionClass))
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Failed to load.', 'error'); return; }
                    renderActionDetailModal(data);
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        function renderActionDetailModal(action) {
            var overlay = document.createElement('div');
            overlay.className = 'fp-overlay';

            // Parameters table
            var paramsHtml = '';
            if (action.parameters && action.parameters.length > 0) {
                paramsHtml = '<table class="act-param-table">' +
                    '<thead><tr><th>Name</th><th>Type</th><th>Nullable</th><th>Kind</th></tr></thead><tbody>';
                action.parameters.forEach(function(p) {
                    var kindBadge = p.isNestedRelationship
                        ? '<span class="act-rel-type-badge' + (p.nestedRelationship && p.nestedRelationship.isCollection ? ' collection' : '') + '">' + (p.nestedRelationship ? p.nestedRelationship.relationshipType : 'Nested') + '</span>'
                        : p.isModel
                        ? '<span class="act-param-model-badge">Model</span>'
                        : '<span style="font-size:11px;color:var(--text-muted);">Scalar</span>';
                    paramsHtml += '<tr>' +
                        '<td><span class="act-param-type">' + escapeHtml(p.name) + '</span></td>' +
                        '<td><span class="act-param-type">' + escapeHtml(p.type) + '</span></td>' +
                        '<td><span style="font-size:11px;color:var(--text-muted);">' + (p.nullable ? 'Yes' : 'No') + '</span></td>' +
                        '<td>' + kindBadge + '</td>' +
                    '</tr>';
                });
                paramsHtml += '</tbody></table>';
            } else {
                paramsHtml = '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">No parameters</div>';
            }

            var serviceCodeHtml = '';
            if (action.serviceMethodCode) {
                serviceCodeHtml = '<pre class="act-service-code">' + escapeHtml(action.serviceMethodCode) + '</pre>';
            }

            // Generate / Regenerate button
            var genBtnLabel = action.serviceMethodExists ? 'Regenerate Service Method' : 'Generate Service Method';

            overlay.innerHTML =
                '<div class="fp-modal" style="max-width:700px;">' +
                    '<div class="fp-header">' +
                        '<span class="fp-header-title">' +
                            '<span class="gen-endpoint-method ' + action.httpMethod + '" style="margin-right:8px;">' + action.httpMethod.toUpperCase() + '</span>' +
                            escapeHtml(action.label || action.name) +
                        '</span>' +
                        '<div style="display:flex;gap:8px;align-items:center;">' +
                            '<button class="sc-btn sm" id="act-modal-docs">Docs</button>' +

                    '</div>' +
                    '<div style="padding:20px;max-height:70vh;overflow-y:auto;">' +
                        '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-family:var(--font-mono);">' + escapeHtml(action.actionClass) + '</div>' +

                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">Parameters (' + action.parameters.length + ')</div>' +
                        paramsHtml +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:20px;margin-bottom:8px;">Service Method</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
                            '<span style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);">' + escapeHtml(action.serviceMethod) + '()</span>' +
                            '<button class="sc-btn primary sm" id="act-modal-gen-service">' + escapeHtml(genBtnLabel) + '</button>' +
                        '</div>' +
                        serviceCodeHtml +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:20px;margin-bottom:8px;">Filament Action</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
                            '<button class="sc-btn primary sm" id="act-modal-publish-filament">Publish Filament Action</button>' +
                            '<span style="font-size:11px;color:var(--text-muted);">Generate an explicit filamentAction() override for customization</span>' +
