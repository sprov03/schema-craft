        function enrichTablesWithStatus() {
            if (!schemaStatusData || !schemaStatusData.schemas || !sharedFilterState.tables) return;

            var tables = sharedFilterState.tables;

            // Build connection-aware lookup: "tableName::connection" → table object
            var tablesByKey = {};
            var tablesByName = {};
            tables.forEach(function(t) {
                var key = t.dbConnection ? t.name + '::' + t.dbConnection : t.name;
                tablesByKey[key] = t;
                // Also index by name alone for fallback matching
                if (!tablesByName[t.name]) {
                    tablesByName[t.name] = t;
                }
            });

            // Enrich existing tables with diff status
            schemaStatusData.schemas.forEach(function(schema) {
                var conn = schema.connection || null;
                var key = conn ? schema.tableName + '::' + conn : schema.tableName;
                var t = tablesByKey[key] || tablesByName[schema.tableName];
                if (t) {
                    t.diffStatus = schema.status;
                    t.tableDiff = schema.diff || null;
                    t.schemaClass = t.schemaClass || schema.schemaClass;
                    t.hasSchema = true;
                    t.needsMigration = schema.status === 'has_changes' || schema.status === 'new_table';
                } else {
                    // Schema exists but no DB table — add to list
                    var newEntry = {
                        name: schema.tableName,
                        modelName: schema.tableName.replace(/(^|_)([a-z])/g, function(m, sep, c) { return c.toUpperCase(); }),
                        dbConnection: conn,
                        hasSchema: true,
                        hasModel: false,
                        hasFactory: false,
                        hasModelTest: false,
                        hasService: false,
                        schemaClass: schema.schemaClass,
                        selected: false,
                        diffStatus: 'new_table',
                        tableDiff: schema.diff || null,
                        needsMigration: true,
                        schemaOnly: true,
                    };
                    tables.push(newEntry);
                    var newKey = conn ? schema.tableName + '::' + conn : schema.tableName;
                    tablesByKey[newKey] = newEntry;
                    if (!tablesByName[schema.tableName]) {
                        tablesByName[schema.tableName] = newEntry;
                    }
                }
            });

            // Mark tables that have schemas and are in sync
            tables.forEach(function(t) {
                if (t.hasSchema && !t.diffStatus) {
                    t.diffStatus = 'in_sync';
                    t.needsMigration = false;
                }
            });

            schemasState.tables = sharedFilterState.tables;
        }

        function matchesImportFilter(t, filter) {
            switch (filter) {
                case 'not-imported': return !t.hasSchema;
                case 'needs-migration': return t.needsMigration === true;
                case 'needs-factory-test': return t.hasSchema && t.hasModel && (!t.hasFactory || !t.hasModelTest);
                case 'needs-service': return t.hasSchema && t.hasModel && t.hasFactory && t.hasModelTest && !t.hasService;
                case 'complete': return t.hasSchema && t.hasModel && t.hasFactory && t.hasModelTest && t.hasService;
                default: return true;
            }
        }

        function updateFilterCounts() {
            updateSharedFilterCounts('sc-import-filters');
            updateSharedFilterCounts('health-import-filters');
        }

        function renderTableList() {
            var list = document.getElementById('sc-table-list');
            if (!list || !sharedFilterState.tables) return;

            // Keep schemasState in sync
            schemasState.tables = sharedFilterState.tables;
            schemasState.activeFilter = sharedFilterState.activeFilter;

            updateFilterCounts();
            var isAllMode = sharedFilterState.dbConnection === 'all';

            var filtered = sharedFilterState.tables.filter(function(t) {
                if (!matchesImportFilter(t, sharedFilterState.activeFilter)) return false;
                if (!schemasState.tableSearchQuery) return true;
                var q = schemasState.tableSearchQuery;
                return t.name.toLowerCase().indexOf(q) !== -1 ||
                    t.modelName.toLowerCase().indexOf(q) !== -1 ||
                    (t.dbConnection && t.dbConnection.toLowerCase().indexOf(q) !== -1);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center;">No tables found</div>';
                return;
            }

            list.innerHTML = filtered.map(function(t) {
                var badges = '';
                // Diff status badge
                if (t.diffStatus === 'new_table') {
                    badges += '<span class="sc-mini-badge" style="background:var(--info-dim);color:var(--info);">New Table</span>';
                } else if (t.diffStatus === 'has_changes') {
                    badges += '<span class="sc-mini-badge" style="background:var(--warning-dim);color:var(--warning);">Out of Sync</span>';
                } else if (t.diffStatus === 'in_sync') {
                    badges += '<span class="sc-mini-badge has">In Sync</span>';
                }
                badges += t.hasSchema ? '<span class="sc-mini-badge has">Schema</span>' : '';
                badges += t.hasModel ? '<span class="sc-mini-badge has">Model</span>' : '';
                badges += t.hasFactory ? '<span class="sc-mini-badge has">Factory</span>' : '';
                badges += t.hasModelTest ? '<span class="sc-mini-badge has">Test</span>' : '';
                badges += t.hasService ? '<span class="sc-mini-badge has">Service</span>' : '';
                var connTag = isAllMode && t.dbConnection
                    ? '<span class="sc-conn-tag">' + escapeHtml(t.dbConnection) + '</span>'
                    : '';
                var tableKey = t.dbConnection ? t.name + '::' + t.dbConnection : t.name;
                return '<div class="sc-table-item" data-table-key="' + escapeAttr(tableKey) + '" style="cursor:pointer;">' +
                    '<input type="checkbox" class="sc-table-cb" data-table="' + escapeAttr(tableKey) + '"' + (t.selected ? ' checked' : '') + '>' +
                    '<span class="sc-table-name">' + escapeHtml(t.name) + '</span>' +
                    connTag +
                    '<span class="sc-table-badges">' + badges + '</span>' +
                '</div>';
            }).join('');

            // Bind checkbox events (use composite key for lookup)
            list.querySelectorAll('.sc-table-cb').forEach(function(cb) {
                cb.addEventListener('change', function(e) {
                    e.stopPropagation();
                    var key = cb.dataset.table;
                    var parts = key.split('::');
                    var tableName = parts[0];
                    var conn = parts[1] || null;
                    var table = schemasState.tables.find(function(t) {
                        return t.name === tableName && (!conn || t.dbConnection === conn);
                    });
                    if (table) table.selected = cb.checked;
                });
            });

            // Bind row click for detail modal
            list.querySelectorAll('.sc-table-item').forEach(function(row) {
                row.addEventListener('click', function(e) {
                    // Don't open modal if clicking checkbox
                    if (e.target.classList.contains('sc-table-cb')) return;
                    var key = row.dataset.tableKey;
                    var parts = key.split('::');
                    var tableName = parts[0];
                    var conn = parts[1] || null;
                    var table = schemasState.tables.find(function(t) {
                        return t.name === tableName && (!conn || t.dbConnection === conn);
                    });
                    if (table) showSchemaDetailModal(table);
                });
            });
        }

        function toggleAllTables(select) {
            if (!sharedFilterState.tables) return;
            var query = schemasState.tableSearchQuery;
            sharedFilterState.tables.forEach(function(t) {
                if (!matchesImportFilter(t, sharedFilterState.activeFilter)) return;
                var matches = !query ||
                    t.name.toLowerCase().indexOf(query) !== -1 ||
                    t.modelName.toLowerCase().indexOf(query) !== -1 ||
                    (t.dbConnection && t.dbConnection.toLowerCase().indexOf(query) !== -1);
                if (matches) t.selected = select;
            });
            renderTableList();
        }

        function getSelectedTables() {
            if (!schemasState.tables) return [];
            return schemasState.tables.filter(function(t) { return t.selected; });
        }

        function doImportSchema(previewOnly) {
            var selected = getSelectedTables();
            if (selected.length === 0) {
                showToast('Please select at least one table', 'warning');
                return;
            }

            var createSchema = document.getElementById('sc-import-schema').checked;
            var createFactoryTest = document.getElementById('sc-import-factory-test').checked;
            var createService = document.getElementById('sc-import-service').checked;
            var force = document.getElementById('sc-import-force').checked;

            if (!createSchema && !createFactoryTest && !createService) {
                showToast('Select at least one option to generate', 'warning');
                return;
            }

            // Group selected tables by connection
            var groups = {};
            selected.forEach(function(t) {
                var conn = t.dbConnection || schemasDbConnection || 'default';
                if (!groups[conn]) groups[conn] = [];
                groups[conn].push(t.name);
            });

            var headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            var chain = Promise.resolve();
            var connectionKeys = Object.keys(groups);
            var isAllMode = schemasDbConnection === 'all';

            connectionKeys.forEach(function(connName) {
                var tables = groups[connName];

                if (createSchema) {
                    // Consolidated: schema + model + extras in a single request
                    chain = chain.then(function(prev) {
                        if (prev === 'previewed') return prev;
                        var url = previewOnly ? '/_schema-craft/api/schema/import/preview' : '/_schema-craft/api/schema/import';
                        var body = {
                            tables: tables,
                            createModel: true,
                            createFactory: createFactoryTest,
                            createModelTest: createFactoryTest,
                            createService: createService,
                            db_connection: connName,
                        };
                        if (!previewOnly) body.force = force;

                        return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
                            .then(handleResponse)
                            .then(function(result) {
                                if (!result.success) throw new Error(result.message || 'Import failed');
                                if (previewOnly) {
                                    var pivotNote = result.pivots && result.pivots.length > 0
                                        ? result.pivots.length + ' pivot table(s) detected and handled as relationships'
                                        : '';
                                    // TODO(debugContext): Medium to wire — `body` is built just above this
                                    // fetch call and is in scope. Pass: { endpoint: 'POST ' + url, request: body, response: result }
                                    showFilePreviewModal(result.files, 'Write Files', function() { doImportSchema(false); });
                                    if (pivotNote) showToast(pivotNote, 'info');
                                    return 'previewed';
                                }
                                var s = result.summary || {};
                                var prefix = isAllMode ? '[' + connName + '] ' : '';
                                var parts = [];
                                if (s.schemas > 0) parts.push(s.schemas + ' schema(s)');
                                if (s.models > 0) parts.push(s.models + ' model(s)');
                                if (s.factories > 0) parts.push(s.factories + ' factory(ies)');
                                if (s.tests > 0) parts.push(s.tests + ' test(s)');
                                if (s.services > 0) parts.push(s.services + ' service(s)');
                                if (s.skipped > 0) parts.push(s.skipped + ' skipped');
                                if (s.pivots > 0) parts.push(s.pivots + ' pivot(s)');
                                showToast(prefix + parts.join(', '), 'success');
                                return 'imported';
                            });
                    });
                } else if (createFactoryTest || createService) {
                    // Extras only (no new schema/model)
                    chain = chain.then(function(prev) {
                        if (prev === 'previewed') return prev;

                        if (previewOnly) {
                            // Preview extras via import/preview, filter out schema files
                            var body = {
                                tables: tables,
                                createModel: false,
                                createFactory: createFactoryTest,
                                createModelTest: createFactoryTest,
                                createService: createService,
                                db_connection: connName,
                            };
                            return fetch('/_schema-craft/api/schema/import/preview', {
                                method: 'POST', headers: headers, body: JSON.stringify(body),
                            }).then(handleResponse)
                            .then(function(result) {
                                if (!result.success) throw new Error(result.message || 'Preview failed');
                                var extrasOnly = result.files.filter(function(f) { return f.type !== 'schema'; });
                                // TODO(debugContext): Medium to wire — `body` is in scope just above this fetch.
                                // Pass: { endpoint: 'POST /_schema-craft/api/schema/import/preview', request: body, response: result }
                                showFilePreviewModal(extrasOnly, 'Write Files', function() { doImportSchema(false); });
                                return 'previewed';
                            });
                        }

                        // Write mode: use generateExtras endpoint (reads existing schemas from disk)
                        var body = {
                            tables: tables,
                            createFactory: createFactoryTest,
                            createModelTest: createFactoryTest,
                            createService: createService,
                            force: force,
                            db_connection: connName,
                        };
                        return fetch('/_schema-craft/api/schema/import/extras', {
                            method: 'POST', headers: headers, body: JSON.stringify(body),
                        }).then(handleResponse)
                        .then(function(result) {
                            if (!result.success) throw new Error(result.message || 'Extras generation failed');
                            var s = result.summary || {};
                            var parts = [];
                            if (s.factories > 0) parts.push(s.factories + ' factory(ies)');
                            if (s.tests > 0) parts.push(s.tests + ' test(s)');
                            if (s.services > 0) parts.push(s.services + ' service(s)');
                            if (s.skipped > 0) parts.push(s.skipped + ' skipped');
                            if (parts.length > 0) {
                                var prefix = isAllMode ? '[' + connName + '] ' : '';
                                showToast(prefix + parts.join(', ') + ' created', 'success');
                            }
                            return 'imported';
                        });
                    });
                }
            });

            chain.then(function(prev) {
                if (prev !== 'previewed') {
                    loadDatabaseTables();
                    refreshSchemaData();
                }
            }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        // ── Schema Detail Modal ────────────────────────
        function showSchemaDetailModal(table) {
            var overlay = document.createElement('div');
            overlay.className = 'sd-overlay';

            var statusBadge = '';
            var statusClass = '';
            if (!table.hasSchema) {
                statusBadge = 'Not Imported';
                statusClass = 'not-imported';
            } else if (table.diffStatus === 'new_table') {
                statusBadge = 'New Table';
                statusClass = 'new-table';
            } else if (table.diffStatus === 'has_changes') {
                statusBadge = 'Needs Migration';
                statusClass = 'needs-migration';
            } else {
                statusBadge = 'In Sync';
                statusClass = 'in-sync';
            }

            var bodyHtml = '';

            // Info section
            bodyHtml += '<div class="sd-section">' +
                '<div class="sd-section-title">Details</div>' +
                '<div class="sd-info-grid">' +
                    '<span class="sd-info-label">Table</span><span class="sd-info-value">' + escapeHtml(table.name) + '</span>' +
                    (table.schemaClass ? '<span class="sd-info-label">Schema</span><span class="sd-info-value">' + escapeHtml(table.schemaClass) + '</span>' : '') +
                    (table.dbConnection ? '<span class="sd-info-label">Connection</span><span class="sd-info-value">' + escapeHtml(table.dbConnection) + '</span>' : '') +
                '</div>' +
            '</div>';

            // File status
            if (table.hasSchema) {
                bodyHtml += '<div class="sd-section">' +
                    '<div class="sd-section-title">Files</div>' +
                    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                        '<span class="sc-mini-badge has">Schema</span>' +
                        (table.hasModel ? '<span class="sc-mini-badge has">Model</span>' : '<span class="sc-mini-badge">Model</span>') +
                        (table.hasFactory ? '<span class="sc-mini-badge has">Factory</span>' : '<span class="sc-mini-badge">Factory</span>') +
                        (table.hasModelTest ? '<span class="sc-mini-badge has">Test</span>' : '<span class="sc-mini-badge">Test</span>') +
                        (table.hasService ? '<span class="sc-mini-badge has">Service</span>' : '<span class="sc-mini-badge">Service</span>') +
                    '</div>' +
                '</div>';
            }

            // Diff section
            if (table.tableDiff) {
                bodyHtml += '<div class="sd-section">' +
                    '<div class="sd-section-title">Changes</div>' +
                    renderDiffDetail(table.tableDiff) +
                '</div>';
            } else if (table.hasSchema && table.diffStatus === 'in_sync') {
                bodyHtml += '<div class="sd-section">' +
                    '<div class="sd-section-title">Changes</div>' +
                    '<div class="sd-empty">Schema and database are in sync.</div>' +
                '</div>';
            } else if (!table.hasSchema) {
                bodyHtml += '<div class="sd-section">' +
                    '<div class="sd-section-title">Status</div>' +
                    '<div class="sd-empty">No schema file exists for this table. Import to generate one.</div>' +
                '</div>';
            }

            // Migration preview section (placeholder, loaded on demand)
            if (table.needsMigration) {
                bodyHtml += '<div class="sd-section" id="sd-migration-section">' +
                    '<div class="sd-section-title">Migration Preview</div>' +
                    '<div id="sd-migration-content" class="sd-empty">Click "Preview Migration" to see the generated code.</div>' +
                '</div>';
            }

            // Footer actions
            var footerHtml = '';
            if (table.hasSchema && table.schemaClass) {
                footerHtml += '<button class="sc-btn" id="sd-edit-schema">Edit Schema</button>';
            }
            if (!table.hasSchema) {
                footerHtml += '<button class="sc-btn primary" id="sd-import-btn">Import Schema</button>';
            }
            if (table.needsMigration) {
                footerHtml += '<button class="sc-btn" id="sd-preview-migration">Preview Migration</button>';
                footerHtml += '<button class="sc-btn primary" id="sd-generate-migration">Generate Migration</button>';
            }

            overlay.innerHTML =
                '<div class="sd-modal">' +
                    '<div class="sd-header">' +
                        '<div class="sd-header-left">' +
                            '<span class="sd-header-title">' + escapeHtml(table.name) + '</span>' +
                            '<span class="sd-status-badge ' + statusClass + '">' + statusBadge + '</span>' +
                        '</div>' +
                        '<button class="sd-close" id="sd-close">&times;</button>' +
                    '</div>' +
                    '<div class="sd-body">' + bodyHtml + '</div>' +
                    '<div class="sd-footer">' + footerHtml + '</div>' +
                '</div>';

            document.body.appendChild(overlay);
            HotkeyContext.push('schema-view');
            window._schemaDetailCurrentTable = table;

            function closeModal() {
                overlay.remove();
                HotkeyContext.pop();
                if (window._schemaDetailCurrentTable === table) window._schemaDetailCurrentTable = null;
            }
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
            document.getElementById('sd-close').addEventListener('click', closeModal);

            // Edit schema button
            var editBtn = document.getElementById('sd-edit-schema');
            if (editBtn) {
                editBtn.addEventListener('click', function() {
                    closeModal();
                    SchemaEditor.openEdit(table.schemaClass, table.dbConnection || schemasDbConnection);
                });
            }

            // Import button (for tables without schemas)
            var importBtn = document.getElementById('sd-import-btn');
            if (importBtn) {
                importBtn.addEventListener('click', function() {
                    var conn = table.dbConnection || schemasDbConnection || 'default';
                    var body = {
                        tables: [table.name],
                        createModel: true,
                        createFactory: false,
                        createModelTest: false,
                        createService: false,
                        db_connection: conn,
                    };
                    fetch('/_schema-craft/api/schema/import/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(body),
                    })
                    .then(handleResponse)
                    .then(function(result) {
                        if (!result.success) { showToast(result.message || 'Import failed', 'error'); return; }
                        showFilePreviewModal(result.files, 'Write Files', function() {
                            body.force = false;
                            fetch('/_schema-craft/api/schema/import', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                                body: JSON.stringify(body),
                            })
                            .then(handleResponse)
                            .then(function(r) {
                                if (r.success) {
                                    showToast('Schema imported successfully', 'success');
                                    closeModal();
                                    loadDatabaseTables();
                                    refreshSchemaData();
                                } else {
                                    showToast(r.message || 'Import failed', 'error');
                                }
                            })
                            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                        }, {
                            endpoint: 'POST /_schema-craft/api/schema/import/preview',
                            request: body,
                            response: result,
                        });
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                });
            }

            // Preview migration button
            var previewMigBtn = document.getElementById('sd-preview-migration');
            if (previewMigBtn) {
                previewMigBtn.addEventListener('click', function() {
                    var contentEl = document.getElementById('sd-migration-content');
                    contentEl.innerHTML = '<span style="color:var(--text-muted);">Loading...</span>';
                    fetch('/_schema-craft/api/migrate/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ tables: [table.name] }),
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        if (!data.files || data.files.length === 0) {
                            contentEl.innerHTML = '<span class="sd-empty">No migration needed.</span>';
                            return;
                        }
                        contentEl.innerHTML = data.files.map(function(f) {
                            return '<div style="margin-bottom:8px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">' + escapeHtml(f.path) + '</div>' +
                                '<pre style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;font-family:var(--font-mono);overflow-x:auto;white-space:pre;line-height:1.6;color:var(--text-primary);">' + escapeHtml(f.content) + '</pre>';
                        }).join('');
                    })
                    .catch(function(e) { contentEl.innerHTML = '<span style="color:var(--error);">Error: ' + escapeHtml(e.message) + '</span>'; });
                });
            }

            // Generate migration button
            var genMigBtn = document.getElementById('sd-generate-migration');
            if (genMigBtn) {
                genMigBtn.addEventListener('click', function() {
                    fetch('/_schema-craft/api/migrate/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ tables: [table.name] }),
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        if (!data.files || data.files.length === 0) {
                            showToast('No changes for ' + table.name, 'info');
                            return;
                        }
                        showFilePreviewModal(data.files, 'Write Migration', function() {
                            fetch('/_schema-craft/api/migrate', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                                body: JSON.stringify({ tables: [table.name] }),
                            })
                            .then(handleResponse)
                            .then(function(result) {
                                if (result.success) {
                                    showToast(result.message, 'success');
                                    closeModal();
                                    loadDatabaseTables();
                                    refreshSchemaData();
                                } else {
                                    showToast(result.message || 'Migration failed', 'error');
                                }
                            })
                            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                        }, {
                            endpoint: 'POST /_schema-craft/api/migrate/preview',
                            request: { tables: [table.name] },
                            response: data,
                        });
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                });
            }
        }

        // ── Batch Migration ─────────────────────────────
        function doBatchMigrate(andRun) {
            var manuallySelected = getSelectedTables();
            var selected = manuallySelected.length > 0
                ? manuallySelected.filter(function(t) { return t.needsMigration; })
                : (schemasState.tables || []).filter(function(t) { return t.needsMigration; });
            if (selected.length === 0) {
                showToast('No schemas need migration', 'info');
                return;
            }

            var tableNames = selected.map(function(t) { return t.name; });
            var writeEndpoint = andRun ? '/_schema-craft/api/migrate/run' : '/_schema-craft/api/migrate';
            var confirmLabel = andRun ? 'Write & Run Migrations' : 'Write Migrations';

            fetch('/_schema-craft/api/migrate/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ tables: tableNames }),
            })
            .then(handleResponse)
            .then(function(data) {
                if (!data.files || data.files.length === 0) {
                    showToast('No migrations needed for selected schemas.', 'info');
                    return;
                }
                showFilePreviewModal(data.files, confirmLabel, function() {
                    fetch(writeEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ tables: tableNames }),
                    })
                    .then(handleResponse)
                    .then(function(result) {
                        if (result.success) {
                            showToast(result.message, 'success');
                            if (result.migrateOutput) {
                                showToast('Migrate: ' + result.migrateOutput, 'info');
                            }
                            statusInitialized = false;
                            statusData = null;
                            initStatusTab();
                        } else {
                            showToast(result.message || 'Migration failed', 'error');
                        }
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                }, {
                    endpoint: 'POST /_schema-craft/api/migrate/preview',
                    request: { tables: tableNames },
                    response: data,
                });
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        function refreshSchemaData() {
            fetch('/_schema-craft/api/schema')
                .then(handleResponse)
                .then(function(data) {
                    schemaData = data;
                    renderHealthContent();
                    renderModelList();
                })
                .catch(function() {});
        }

        // ── Status Tab ──────────────────────────────────
        var statusInitialized = false;
        var statusData = null;

        function initStatusTab() {
            if (statusInitialized) {
                return;
            }
            statusInitialized = true;
            renderStatusTab();
            loadStatusData();
        }

        function renderStatusTab() {
            var container = document.getElementById('status-tab');
            container.innerHTML =
                '<div class="summary-bar" id="status-summary">' +
                    '<div class="stat-card"><div class="stat-value" id="status-in-sync">-</div><div class="stat-label">In Sync</div></div>' +
                    '<div class="stat-card"><div class="stat-value" id="status-changes">-</div><div class="stat-label">Changes</div></div>' +
                    '<div class="stat-card"><div class="stat-value" id="status-new">-</div><div class="stat-label">New Tables</div></div>' +
                '</div>' +
                '<div class="sc-status-actions" id="status-actions">' +
                    '<span class="sc-status-count" id="status-total"></span>' +
                    '<button class="sc-btn sm" id="status-refresh">Refresh</button>' +
                    '<button class="sc-btn sm primary" id="status-generate-all">Generate All Migrations</button>' +
                    '<button class="sc-btn sm" id="status-generate-run">Generate &amp; Run</button>' +
                '</div>' +
                '<div class="sc-status-list" id="status-list"></div>';

            document.getElementById('status-refresh').addEventListener('click', function() {
                statusInitialized = false;
                statusData = null;
                initStatusTab();
            });
            document.getElementById('status-generate-all').addEventListener('click', function() {
                doMigratePreviewAndWrite(false);
            });
            document.getElementById('status-generate-run').addEventListener('click', function() {
                doMigratePreviewAndWrite(true);
            });
        }

        function loadStatusData() {
            document.getElementById('status-list').innerHTML = '<div style="padding:24px;color:var(--text-muted);text-align:center;">Loading status...</div>';
            fetch('/_schema-craft/api/status')
                .then(handleResponse)
                .then(function(data) {
                    statusData = data;
                    renderStatusData();
                })
                .catch(function(e) {
                    document.getElementById('status-list').innerHTML = '<div style="padding:24px;color:var(--error);">Failed to load status: ' + escapeHtml(e.message) + '</div>';
                });
        }

        function renderStatusData() {
            if (!statusData) return;
            var s = statusData.summary;
            document.getElementById('status-in-sync').textContent = s.inSync;
            document.getElementById('status-changes').textContent = s.hasChanges;
            document.getElementById('status-new').textContent = s.newTables;
            document.getElementById('status-total').textContent = s.total + ' schema(s) discovered';

            var hasActionable = s.hasChanges > 0 || s.newTables > 0;
            document.getElementById('status-generate-all').disabled = !hasActionable;
            document.getElementById('status-generate-run').disabled = !hasActionable;

            var listEl = document.getElementById('status-list');
            if (!statusData.schemas || statusData.schemas.length === 0) {
                listEl.innerHTML = '<div style="padding:24px;color:var(--text-muted);text-align:center;">No schemas discovered.</div>';
                return;
            }

            var html = '';
            statusData.schemas.forEach(function(item, idx) {
                var dotClass = item.status === 'in_sync' ? 'synced' : item.status === 'new_table' ? 'new-table' : 'changed';
                var statusLabel = item.status === 'in_sync' ? 'In Sync' : item.status === 'new_table' ? 'New Table' : 'Has Changes';
                var changeSummary = '';

                if (item.diff) {
                    var parts = [];
                    var adds = item.diff.columns.filter(function(c) { return c.action === 'add'; }).length;
                    var mods = item.diff.columns.filter(function(c) { return c.action === 'modify'; }).length;
                    var drops = item.diff.columns.filter(function(c) { return c.action === 'drop'; }).length;
                    var renames = item.diff.columns.filter(function(c) { return c.action === 'rename'; }).length;
                    if (adds) parts.push('+' + adds + ' col');
                    if (mods) parts.push('~' + mods + ' col');
                    if (drops) parts.push('-' + drops + ' col');
                    if (renames) parts.push(renames + ' rename');
                    if (item.diff.indexes.length) parts.push(item.diff.indexes.length + ' idx');
                    if (item.diff.foreignKeys.length) parts.push(item.diff.foreignKeys.length + ' fk');
                    if (item.diff.addTimestamps) parts.push('+timestamps');
                    if (item.diff.dropTimestamps) parts.push('-timestamps');
                    if (item.diff.addSoftDeletes) parts.push('+softDeletes');
                    if (item.diff.dropSoftDeletes) parts.push('-softDeletes');
                    changeSummary = parts.join(', ');
                }

                var isExpandable = item.status !== 'in_sync';
                html += '<div class="sc-status-item" data-status-idx="' + idx + '">' +
                    '<div class="sc-status-row" ' + (isExpandable ? 'style="cursor:pointer;" onclick="window._toggleStatusItem(' + idx + ')"' : '') + '>' +
                        '<span class="sc-status-dot ' + dotClass + '"></span>' +
                        '<span class="sc-status-table">' + escapeHtml(item.tableName) + '</span>' +
                        '<span class="sc-status-schema">' + escapeHtml(shortName(item.schemaClass)) + '</span>' +
                        (changeSummary ? '<span class="sc-status-summary">' + escapeHtml(changeSummary) + '</span>' : '<span class="sc-status-summary">' + escapeHtml(statusLabel) + '</span>') +
                        (isExpandable ? '<span class="sc-status-arrow" id="status-arrow-' + idx + '">&#9654;</span>' : '') +
                    '</div>';

                if (item.diff) {
                    html += '<div class="sc-diff-detail" id="status-diff-' + idx + '">';
                    html += renderDiffDetail(item.diff);
                    html += '</div>';
                    html += '<div class="sc-status-item-actions" id="status-actions-' + idx + '">' +
                        '<button class="sc-btn sm primary" onclick="window._migrateTable(\'' + escapeAttr(item.tableName) + '\')">Generate Migration</button>' +
                    '</div>';
                }

                html += '</div>';
            });

            listEl.innerHTML = html;
        }

        window._toggleStatusItem = function(idx) {
            var diff = document.getElementById('status-diff-' + idx);
            var arrow = document.getElementById('status-arrow-' + idx);
            var actions = document.getElementById('status-actions-' + idx);
            if (diff) {
                diff.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
                if (actions) actions.classList.toggle('open');
            }
        };

        function renderDiffDetail(diff) {
            var html = '';

            if (diff.columns.length > 0) {
                html += '<div class="sc-diff-section">' +
                    '<div class="sc-diff-section-title">Columns</div>';
                diff.columns.forEach(function(col) {
                    var actionSymbol = col.action === 'add' ? '+' : col.action === 'drop' ? '-' : col.action === 'rename' ? 'R' : '~';
                    var meta = '';
                    if (col.action === 'rename') {
                        meta = col.oldColumn + ' \u2192 ' + col.column;
                    } else if (col.action === 'modify' && col.desired && col.actual) {
                        var changes = [];
                        if (col.desired.type !== col.actual.type) changes.push(col.actual.type + ' \u2192 ' + col.desired.type);
                        if (col.desired.nullable !== col.actual.nullable) changes.push(col.desired.nullable ? 'nullable' : 'not null');
                        if (col.desired.unsigned !== col.actual.unsigned) changes.push(col.desired.unsigned ? 'unsigned' : 'signed');
                        meta = changes.join(', ');
                    } else if (col.action === 'add' && col.desired) {
                        meta = col.desired.type + (col.desired.nullable ? ', nullable' : '') + (col.desired.unsigned ? ', unsigned' : '');
                    } else if (col.action === 'drop' && col.actual) {
                        meta = col.actual.type;
                    }

                    html += '<div class="sc-diff-row">' +
                        '<span class="sc-diff-action ' + col.action + '">' + actionSymbol + '</span>' +
                        '<span>' + escapeHtml(col.column) + '</span>' +
                        (meta ? '<span class="sc-diff-meta">' + escapeHtml(meta) + '</span>' : '') +
                    '</div>';
                });
                html += '</div>';
            }

            if (diff.indexes.length > 0) {
                html += '<div class="sc-diff-section">' +
                    '<div class="sc-diff-section-title">Indexes</div>';
                diff.indexes.forEach(function(idx) {
                    var symbol = idx.action === 'add' ? '+' : '-';
                    var desc = (idx.unique ? 'unique ' : '') + idx.columns.join(', ');
                    html += '<div class="sc-diff-row">' +
                        '<span class="sc-diff-action ' + idx.action + '">' + symbol + '</span>' +
                        '<span>' + escapeHtml(desc) + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            if (diff.foreignKeys.length > 0) {
                html += '<div class="sc-diff-section">' +
                    '<div class="sc-diff-section-title">Foreign Keys</div>';
                diff.foreignKeys.forEach(function(fk) {
                    var symbol = fk.action === 'add' ? '+' : '-';
                    var desc = fk.column + ' \u2192 ' + fk.foreignTable + '.' + fk.foreignColumn;
                    html += '<div class="sc-diff-row">' +
                        '<span class="sc-diff-action ' + fk.action + '">' + symbol + '</span>' +
                        '<span>' + escapeHtml(desc) + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }

            var flags = [];
            if (diff.addTimestamps) flags.push('+timestamps');
            if (diff.dropTimestamps) flags.push('-timestamps');
            if (diff.addSoftDeletes) flags.push('+softDeletes');
            if (diff.dropSoftDeletes) flags.push('-softDeletes');
            if (flags.length > 0) {
                html += '<div class="sc-diff-section">' +
                    '<div class="sc-diff-section-title">Flags</div>' +
                    '<div class="sc-diff-row"><span>' + escapeHtml(flags.join(', ')) + '</span></div>' +
                '</div>';
            }

            return html;
        }

        function doMigratePreviewAndWrite(andRun) {
            fetch('/_schema-craft/api/migrate/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({}),
            })
            .then(handleResponse)
            .then(function(data) {
                if (!data.files || data.files.length === 0) {
                    showToast(data.message || 'Nothing to migrate.', 'info');
                    return;
                }
                var confirmLabel = andRun ? 'Generate & Run Migrations' : 'Write Migration Files';
                showFilePreviewModal(data.files, confirmLabel, function() {
                    var endpoint = andRun ? '/_schema-craft/api/migrate/run' : '/_schema-craft/api/migrate';
                    fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({}),
                    })
                    .then(handleResponse)
                    .then(function(result) {
                        if (result.success) {
                            showToast(result.message, 'success');
                            if (result.migrateOutput) {
                                showToast('Migrate output: ' + result.migrateOutput, 'info');
                            }
                            // Refresh status
                            statusInitialized = false;
                            statusData = null;
                            initStatusTab();
                        } else {
                            showToast(result.message || 'Migration failed.', 'error');
                        }
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                }, {
                    endpoint: 'POST /_schema-craft/api/migrate/preview',
                    request: {},
                    response: data,
                });
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        window._migrateTable = function(tableName) {
            fetch('/_schema-craft/api/migrate/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ tables: [tableName] }),
            })
            .then(handleResponse)
            .then(function(data) {
                if (!data.files || data.files.length === 0) {
                    showToast('No changes for ' + tableName + '.', 'info');
                    return;
                }
                showFilePreviewModal(data.files, 'Write Migration', function() {
                    fetch('/_schema-craft/api/migrate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ tables: [tableName] }),
                    })
                    .then(handleResponse)
                    .then(function(result) {
                        if (result.success) {
                            showToast(result.message, 'success');
                            statusInitialized = false;
                            statusData = null;
                            initStatusTab();
                        } else {
                            showToast(result.message || 'Migration failed.', 'error');
                        }
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                }, {
                    endpoint: 'POST /_schema-craft/api/migrate/preview',
                    request: { tables: [tableName] },
                    response: data,
                });
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        };

        // ── Generate Tab ────────────────────────────────

                        '<div class="gen-sidebar-header">' +

        function switchGenView(view) {
            // SDK generation is folded into the API Docs view, so an old 'sdk' selection

            if (view === 'sdk') { view = 'docs'; }

        // ── API Docs View ───────────────────────────────
        var docsData = null;

        function showDocsView(onRendered) {
            var content = document.getElementById('gen-content');
            content.innerHTML = '<div class="gen-empty-state">Loading API docs...</div>';

            fetch('/_schema-craft/api/api-routes?api=' + encodeURIComponent(genSelectedApi))

                .then(function(data) {
                    docsData = data;

        // Re-pull the API docs in the background after an action is added — re-renders the docs
        // content (not a page reload, so the tab/scroll survive) and restores the search filter
        // the user had typed, since renderDocsView() rebuilds the search box fresh.
        function docsRefreshPreservingSearch() {
            var searchEl = document.getElementById('docs-search');
            var query = searchEl ? searchEl.value : '';
            showDocsView(function() {
                if (!query) { return; }
                var s = document.getElementById('docs-search');
                if (s) { s.value = query; s.dispatchEvent(new Event('input')); }
            });
        }

        function renderDocsView() {
            var data = docsData;
            var content = document.getElementById('gen-content');

            // Walk data.schemas (the unified per-Resource map from SdkBuildResult). Schemas
            // with endpoints render as "groups" in the existing UX; schema-less or dep-only
            // schemas are still in the map (so renderResponseFields can resolve nested
            // relationships) but don't render route lists. Sorted alphabetically for stable UX.
            var schemaKeys = Object.keys(data.schemas || {}).sort();
            var endpointSchemaKeys = schemaKeys.filter(function(key) {
                return (data.schemas[key].endpoints || []).length > 0;
            });

            var warningCount = (data.warnings || []).length;
            var errorCount = (data.errors || []).length;
            var hasAnything = endpointSchemaKeys.length > 0 || warningCount > 0 || errorCount > 0;

            if (!hasAnything) {
                // Empty API (no endpoints yet): still offer "+ Add Action" so a brand-new API can be
                // bootstrapped here — without it, the only path was the separate Import Actions tab.
                content.innerHTML =
                    '<div class="gen-import">' +
                        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
                            '<div class="gen-import-title">API Documentation</div>' +
                            '<button class="sc-btn primary" id="docs-add-action" style="white-space:nowrap;">+ Add Action</button>' +
                        '</div>' +
                        '<div class="gen-import-subtitle">No endpoints in this API yet.' +
                            (data.routePrefix ? ' Prefix: <code>' + escapeHtml(data.routePrefix) + '</code>.' : '') +
                            ' Click <strong>+ Add Action</strong> to create your first one, or ' +
                            '<a href="#" id="docs-goto-import" style="color:var(--accent);text-decoration:underline;">Import Actions</a> to register existing ones.</div>' +
                    '</div>';
                var emptyAddBtn = document.getElementById('docs-add-action');
                if (emptyAddBtn) {
                    emptyAddBtn.addEventListener('click', function() { genLaunchActionModal(null, docsRefreshPreservingSearch); });
                }
                var gotoLink = document.getElementById('docs-goto-import');
                if (gotoLink) {
                    gotoLink.addEventListener('click', function(e) { e.preventDefault(); switchGenView('import'); });
                }
                return;
            }

            var groupsHtml = '';
            var totalEndpoints = 0;

            endpointSchemaKeys.forEach(function(modelKey, gIdx) {
                var schema = data.schemas[modelKey];
                var endpoints = schema.endpoints || [];
                totalEndpoints += endpoints.length;

                var endpointsHtml = '';
                endpoints.forEach(function(ep) {
                    var methods = ep.method.split('|');
                    var primaryMethod = methods[0].toLowerCase();
                    var methodLabel = methods.join(' | ');
                    var label = ep.label || ep.action || '';
                    var relCount = ep.relationships ? ep.relationships.length : 0;
                    var ruleCount = ep.rules ? Object.keys(ep.rules).length : 0;

                    // Source badge
                    var sourceBadge = '';
                    if (ep.source === 'action') {
                        sourceBadge = '<span class="docs-endpoint-badge" style="background:var(--accent-dim);color:var(--accent);">Action</span>';
                    } else if (ep.source === 'controller') {
                        sourceBadge = '<span class="docs-endpoint-badge" style="background:var(--info-dim);color:var(--info);">Controller</span>';
                    } else {
                        sourceBadge = '<span class="docs-endpoint-badge" style="background:var(--bg-tertiary);color:var(--text-muted);">Closure</span>';
                    }

                    // Quick "open the action/source file in PhpStorm" jump straight from the row —
                    // stopPropagation in the icon keeps it from also opening the detail modal.
                    var epOpenIcon = (ep.sourceFiles && ep.sourceFiles.length)
                        ? ideIconForPath(ep.sourceFiles[0].path, 'Open ' + (ep.sourceFiles[0].label || 'source'))
                        : '';

                    endpointsHtml +=
                        '<div class="docs-endpoint-row" data-docs-ep=\'' + escapeAttr(JSON.stringify(ep)) + '\' ' +
                            'data-docs-model="' + escapeAttr(modelKey) + '">' +
                            '<span class="gen-import-action-method ' + primaryMethod + '">' + escapeHtml(methodLabel) + '</span>' +
                            '<span class="docs-endpoint-path">' + escapeHtml(ep.path) + '</span>' +
                            '<span class="docs-endpoint-label">' + escapeHtml(label) + '</span>' +
                            sourceBadge +
                            (ruleCount > 0 ? '<span class="docs-endpoint-badge params">' + ruleCount + ' rule' + (ruleCount !== 1 ? 's' : '') + '</span>' : '') +
                            (relCount > 0 ? '<span class="docs-endpoint-badge rels">' + relCount + ' rel' + (relCount !== 1 ? 's' : '') + '</span>' : '') +
                            (ep.responseUndocumented ? '<span class="docs-endpoint-badge" style="background:var(--warning-dim,#3a2a00);color:var(--warning,#f0a500);">⚠ response</span>' : '') +
                            epOpenIcon +
                        '</div>';
                });

                groupsHtml +=
                    '<div class="gen-import-group docs-group" data-docs-group="' + gIdx + '">' +
                        '<div class="gen-import-group-header" data-docs-toggle="' + gIdx + '">' +
                            '<span class="gen-import-group-toggle open">&#9654;</span>' +
                            '<span class="gen-import-group-name">' + escapeHtml(modelKey) + '</span>' +
                            '<span class="gen-import-group-count">' + endpoints.length + ' endpoint' + (endpoints.length !== 1 ? 's' : '') + '</span>' +
                            // Only entities (schemas tied to a model) can have actions generated; a
                            // data-shape group (no model) shows no "+ Add". isEntity comes from the payload.
                            (schema.isEntity ? '<button class="sc-btn sm docs-group-add" data-add-schema="' + escapeAttr(schema.schemaClass || '') + '" style="margin-left:auto;" title="Add an action to ' + escapeAttr(modelKey) + '">+ Add</button>' : '') +
                        '</div>' +
                        '<div class="gen-import-group-body open" data-docs-body="' + gIdx + '">' +
                            endpointsHtml +
                        '</div>' +
                    '</div>';
            });

            // Issues section (replaces the old "Other Routes" / unassigned UI). The unified
            // payload surfaces route-level concerns as warnings + errors from SdkContextBuilder
            // — same set of issues the SDK pipeline would surface, rendered consistently here.
            var diagnosticsHtml = '';
            if (warningCount > 0 || errorCount > 0) {
                var diagIdx = endpointSchemaKeys.length;
                var diagItems = '';
                (data.errors || []).forEach(function(e) {
                    diagItems +=
                        '<div class="docs-endpoint-row" style="cursor:default;">' +
                            '<span class="docs-endpoint-badge" style="background:var(--error-dim,#3a0000);color:var(--error,#f85149);">error</span>' +
                            '<span class="docs-endpoint-path">' + escapeHtml(e.route) + '</span>' +
                            '<span class="docs-endpoint-label">' + escapeHtml(e.message) + '</span>' +
                        '</div>';
                });
                (data.warnings || []).forEach(function(w) {
                    diagItems +=
                        '<div class="docs-endpoint-row" style="cursor:default;">' +
                            '<span class="docs-endpoint-badge" style="background:var(--warning-dim,#3a2a00);color:var(--warning,#f0a500);">warning</span>' +
                            '<span class="docs-endpoint-path">' + escapeHtml(w.route) + '</span>' +
                            '<span class="docs-endpoint-label">' + escapeHtml(w.message) + '</span>' +
                        '</div>';
                });

                var diagSummary = '';
                if (errorCount > 0) diagSummary += errorCount + ' error' + (errorCount !== 1 ? 's' : '');
                if (errorCount > 0 && warningCount > 0) diagSummary += ', ';
                if (warningCount > 0) diagSummary += warningCount + ' warning' + (warningCount !== 1 ? 's' : '');

                diagnosticsHtml =
                    '<div class="gen-import-group docs-group" data-docs-group="' + diagIdx + '">' +
                        '<div class="gen-import-group-header" data-docs-toggle="' + diagIdx + '">' +
                            '<span class="gen-import-group-toggle open">&#9654;</span>' +
                            '<span class="gen-import-group-name" style="color:var(--text-muted);">Issues</span>' +
                            '<span class="gen-import-group-count">' + diagSummary + '</span>' +
                        '</div>' +
                        '<div class="gen-import-group-body open" data-docs-body="' + diagIdx + '">' +
                            diagItems +
                        '</div>' +
                    '</div>';
            }

            var groupCount = endpointSchemaKeys.length + ((warningCount + errorCount) > 0 ? 1 : 0);

            // SDK readiness — computed from the unified payload (no extra request). Undocumented
            // endpoints get excluded from the generated SDK; we surface them here and gate the
            // Generate SDK button until they're addressed. Errors (resource misconfigurations
            // surfaced by SdkContextBuilder) also block readiness.
            var sdkIssues = [];
            endpointSchemaKeys.forEach(function(modelKey) {
                (data.schemas[modelKey].endpoints || []).forEach(function(ep) {
                    if (ep.responseUndocumented) {
                        sdkIssues.push({ route: ep.method + ' ' + ep.path, model: modelKey });
                    }
                });
            });
            var sdkReady = sdkIssues.length === 0 && errorCount === 0;

            // Compose the readiness bar from the actual blockers, not a single hardcoded message.
            // Three independent signals can be present in any combination:
            //   - sdkIssues: in-group endpoints flagged responseUndocumented (will be excluded if shipped)
            //   - errorCount: route-level errors from the build (e.g., Resource without #[ResourceSchema])
            //   - warningCount: route-level warnings from the build (e.g., route with no #[ApiResponse])
            // The previous text was hardcoded to talk about sdkIssues even when sdkIssues=0 and the
            // actual blocker was errorCount — producing the misleading "⚠ 0 endpoints undocumented".
            var barMessage = '';
            var barColor;
            var barIcon;
            var gateTitle;
            if (sdkReady && warningCount === 0) {
                barColor = 'var(--success,#3fb950)';
                barIcon = '✓';
                barMessage = 'All endpoints documented — ready to generate the SDK.';
                gateTitle = '';
            } else if (sdkReady && warningCount > 0) {
                // Truly ready (no per-endpoint undocumented + no errors), but route-level warnings
                // are surfaced below. SDK is still generatable; warnings are informational.
                barColor = 'var(--success,#3fb950)';
                barIcon = '✓';
                barMessage = 'All endpoints documented — ready to generate the SDK. '
                    + warningCount + ' non-blocking route warning' + (warningCount !== 1 ? 's' : '')
                    + ' below (informational; SDK generation will proceed).';
                gateTitle = '';
            } else if (sdkIssues.length > 0) {
                // Per-endpoint undocumented case — actionable: add #[ApiResponse] or typed resource return.
                barColor = 'var(--warning,#f0a500)';
                barIcon = '⚠';
                barMessage = sdkIssues.length + ' endpoint' + (sdkIssues.length !== 1 ? 's are' : ' is')
                    + ' undocumented and will be excluded. Add <code>#[ApiResponse]</code> or a typed resource return to include '
                    + (sdkIssues.length !== 1 ? 'them' : 'it') + '.';
                if (errorCount > 0) {
                    barMessage += ' Plus ' + errorCount + ' route-level error'
                        + (errorCount !== 1 ? 's' : '') + ' below.';
                }
                gateTitle = 'Document the endpoints listed below to generate the SDK';
            } else if (errorCount > 0) {
                // Route-level errors (not in-group undocumented). Different fix path: the route's
                // resource is misconfigured (typically a Resource without #[ResourceSchema], or a
                // manual JsonResource the scanner can't introspect). See the Issues section below.
                barColor = 'var(--error,#f85149)';
                barIcon = '⛔';
                barMessage = errorCount + ' route-level error' + (errorCount !== 1 ? 's' : '')
                    + ' prevent' + (errorCount !== 1 ? '' : 's') + ' SDK generation — see Issues below.'
                    + (warningCount > 0 ? ' (' + warningCount + ' route warning'
                        + (warningCount !== 1 ? 's' : '') + ' also below.)' : '');
                gateTitle = 'Resolve the route-level errors listed below to generate the SDK';
            }

            // When the gate fails (route warnings/errors block strict SDK gen), still offer a
            // "Generate anyway" override. The preview-changes modal protects the actual write —
            // the developer reviews diffs before commit. Force mode flips failOnMissingRoutes
            // off in the backend; warnings + errors stay loud in the response and below the bar.
            var forceBtnHtml = sdkReady
                ? ''
                : '<button class="sc-btn" id="docs-gen-sdk-force-btn" title="Generate the SDK from documented routes only; surface warnings + errors but proceed. Preview the diff before commit." style="white-space:nowrap;background:var(--warning-dim,#3a2a00);color:var(--warning,#f0a500);border-color:var(--warning,#f0a500);">⚠ Generate anyway</button>';

            var sdkBarHtml =
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);">' +
                    '<div style="font-size:13px;line-height:1.5;">' +
                        '<span style="color:' + barColor + ';">' + barIcon + ' ' + barMessage + '</span>' +
                    '</div>' +
                    '<div style="display:flex;gap:8px;align-items:center;">' +
                        forceBtnHtml +
                        '<button class="sc-btn primary" id="docs-gen-sdk-btn"' + (sdkReady ? '' : ' disabled title="' + escapeAttr(gateTitle) + '"') + ' style="white-space:nowrap;">📦 Generate SDK</button>' +
                    '</div>' +
                '</div>' +
                (sdkIssues.length
                    ? '<div style="margin-bottom:16px;font-size:12px;color:var(--text-muted);">' +
                        sdkIssues.map(function(i) { return '<div style="padding:2px 0;"><code>' + escapeHtml(i.route) + '</code> in ' + escapeHtml(i.model) + '</div>'; }).join('') +
                      '</div>'
                    : '') +
                '<div id="gen-sdk-diagnostics"></div>';

            content.innerHTML =
                '<div class="gen-import">' +
                    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
                        '<div class="gen-import-title">API Documentation</div>' +
                        '<button class="sc-btn primary" id="docs-add-action" style="white-space:nowrap;">+ Add Action</button>' +
                    '</div>' +
                    '<div class="gen-import-subtitle">' + totalEndpoints + ' registered endpoint' + (totalEndpoints !== 1 ? 's' : '') + ' across ' +
                        groupCount + ' group' + (groupCount !== 1 ? 's' : '') + ' in the <strong>' + escapeHtml(data.apiName) + '</strong> API.' +
                        (data.routeFile ? ' Route file: <code>' + escapeHtml(data.routeFile) + '</code>' : '') + '</div>' +
                    sdkBarHtml +
                    '<div style="margin-bottom:16px;">' +
                        '<input type="search" id="docs-search" placeholder="Search endpoints..." style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);font-size:13px;outline:none;">' +
                    '</div>' +
                    groupsHtml +
                    diagnosticsHtml +
                '</div>';

            // Toggle group expand/collapse
            content.querySelectorAll('[data-docs-toggle]').forEach(function(header) {
                header.addEventListener('click', function() {
                    var idx = header.dataset.docsToggle;
                    var body = content.querySelector('[data-docs-body="' + idx + '"]');
                    var toggle = header.querySelector('.gen-import-group-toggle');
                    body.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
            });

            // "Add Action" (top) — open the generator modal with no schema preselected.
            var addActionBtn = document.getElementById('docs-add-action');
            if (addActionBtn) {
                addActionBtn.addEventListener('click', function() {
                    genLaunchActionModal(null, docsRefreshPreservingSearch);
                });
            }

            // Per-group "+ Add" — open the modal with this group's schema preselected. stopPropagation
            // so the click doesn't also toggle the group's expand/collapse.
            content.querySelectorAll('.docs-group-add').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    genLaunchActionModal(btn.dataset.addSchema || null, docsRefreshPreservingSearch);
                });
            });

            // Search filter
            document.getElementById('docs-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                content.querySelectorAll('.docs-group').forEach(function(group) {
                    var groupName = group.querySelector('.gen-import-group-name').textContent.toLowerCase();
                    var groupMatch = !query || groupName.indexOf(query) !== -1;

                    var hasVisible = false;
                    group.querySelectorAll('.docs-endpoint-row').forEach(function(row) {
                        var path = row.querySelector('.docs-endpoint-path').textContent.toLowerCase();
                        var label = row.querySelector('.docs-endpoint-label').textContent.toLowerCase();
                        var methodEl = row.querySelector('.gen-import-action-method');
                        var method = methodEl ? methodEl.textContent.toLowerCase() : '';
                        var visible = groupMatch || path.indexOf(query) !== -1 || label.indexOf(query) !== -1 || method.indexOf(query) !== -1;
                        row.style.display = visible ? '' : 'none';
                        if (visible) hasVisible = true;
                    });

                    group.style.display = hasVisible ? '' : 'none';
                });
            });

            // Click endpoint to open detail modal — filtered to rows that carry endpoint data
            // (the issues section uses the same row class but has no data-docs-ep, so it stays
            // non-clickable). The modal looks up the response schema by modelKey from docsData.
            content.querySelectorAll('.docs-endpoint-row[data-docs-ep]').forEach(function(row) {
                row.addEventListener('click', function() {
                    var ep = JSON.parse(row.dataset.docsEp);
                    var modelKey = ep.responseModelName || row.dataset.docsModel;
                    showEndpointDetailModal(ep, modelKey, ep.responseCollection || false);
                });
            });

            // "Generate SDK" button — only wired when documentation-complete (gated above).
            var docsSdkBtn = document.getElementById('docs-gen-sdk-btn');
            if (docsSdkBtn && !docsSdkBtn.disabled) {
                docsSdkBtn.addEventListener('click', function() { generateSdkFromDocs(false); });
            }
            var docsSdkForceBtn = document.getElementById('docs-gen-sdk-force-btn');
            if (docsSdkForceBtn) {
                docsSdkForceBtn.addEventListener('click', function() { generateSdkFromDocs(true); });
            }
        }

        /**
         * Build a "open in IDE" icon link for a FQCN, returning empty string when the FQCN
         * isn't in docsData.classSources (synthesized DTO names, primitives, missing files).
         *
         * Uses the same phpstorm://open?file=... URL scheme + SVG glyph as the file-preview
         * IDE button, so the click behavior is consistent across the app. Stays softly visible
         * at rest (via .api-ide-btn opacity) since the API docs panel doesn't have row-hover
         * affordance to reveal otherwise-hidden controls.
         *
         * @param {string} fqcn  Fully qualified class name to resolve
         * @param {string} title Tooltip text — typically "Open <ClassName>"
         * @returns {string} HTML for an anchor, or "" when the FQCN has no resolved source
         */
        function ideIconForClass(fqcn, title) {
            if (!fqcn || !docsData || !docsData.classSources) {
                return '';
            }
            return ideIconForPath(docsData.classSources[fqcn], title);
        }

        /**
         * Build an "open in IDE" icon link from a raw file path (relative to the project, as the
         * server emits them in sourceFiles[].path / classSources). Same glyph + phpstorm:// scheme
         * as ideIconForClass — use this when you already hold a path rather than a class FQCN
         * (endpoint source files, action/request files). Returns "" for an empty path.
         */
        function ideIconForPath(path, title) {
            if (!path) {
                return '';
            }
            var url = 'phpstorm://open?file=' + encodeURIComponent(path);
            return '<a class="api-ide-btn" href="' + url + '" title="' + escapeAttr(title || 'Open in PhpStorm') + '" onclick="event.stopPropagation()">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>' +
                '<polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>';
        }

        /**
         * Render the closed-option set for a bitmask or enum column.
         *
         * Wire shape from EndpointEnricher::optionsForType():
         *   { kind: 'bitmask' | 'enum', values: [{ value, name?, label, description? }, ...] }
         *
         * Layout: one-line hint based on kind ("any combination" for bitmask, "one of" for enum),
         * then a value/label/description table. Description column collapses (— placeholder) when
         * no descriptions are declared, so simple enums don't waste vertical space on empty cells.
         *
         * @param {{kind: string, values: Array}} options
         * @returns {string} HTML string
         */
        function renderOptions(options) {
            if (!options || !options.values || options.values.length === 0) {
                return '';
            }

            var hint = options.kind === 'bitmask'
                ? 'Any combination of:'
                : (options.kind === 'enum' ? 'One of:' : 'Options:');

            var html = '<div class="ep-options-header" style="padding:6px 10px;font-size:11px;color:var(--text-secondary);">' +
                escapeHtml(hint) +
                ' <span class="ep-rule-tag" style="margin-left:6px;">' + escapeHtml(options.kind) + '</span>' +
                '</div>';

            html += '<table class="ep-field-table" style="margin:4px 8px;">' +
                '<thead><tr><th>Value</th><th>Label</th><th>Description</th></tr></thead>' +
                '<tbody>';

            options.values.forEach(function(opt) {
                var valueDisplay = (opt.name && opt.name !== String(opt.value))
                    ? escapeHtml(String(opt.value)) + ' <span style="color:var(--text-muted);font-size:11px;">(' + escapeHtml(opt.name) + ')</span>'
                    : escapeHtml(String(opt.value));
                var description = opt.description
                    ? escapeHtml(opt.description)
                    : '<span style="color:var(--text-muted);">—</span>';
                html += '<tr>' +
                    '<td class="ep-field-type">' + valueDisplay + '</td>' +
                    '<td class="ep-field-name">' + escapeHtml(opt.label || '') + '</td>' +
                    '<td>' + description + '</td>' +
                '</tr>';
            });

            html += '</tbody></table>';

            return html;
        }

        /**
         * Render response fields (columns + relationships) as HTML.
         *
         * Consumes the unified API docs payload: looks up the schema by key in docsData.schemas
         * and renders its columns + relationships. Relationships are walked by following the
         * relatedResource FQCN to its entry in docsData.schemas \u2014 the visualizer and the SDK
         * pipeline now consume the same map identically; there is no separate `relatedFields`
         * payload anymore. Cycle-safe via the visited Set (mirrors EndpointEnricher's $visited).
         *
         * Only badges the contract actually delivers are rendered: nullable, computed, and
         * innerDtoName (for rich-type columns). The 8 schema-level badge code paths (primary,
         * autoIncrement, unique, unsigned, cast, managed, length, default) were removed \u2014 those
         * are runtime DB concerns, not API documentation concerns; the Resource layer doesn't
         * expose them. See the align-visualizer-data-consumption-with-sdk-pipeline task.
         *
         * @param {string} schemaKey  Bare model name key into docsData.schemas (no "Resource" suffix).
         * @param {number} depth      Nesting depth (0 = top level).
         * @param {Set}    visited    Cycle-safety accumulator; pass `new Set()` at top level.
         * @returns {string} HTML string
         */
        function renderResponseFields(schemaKey, depth, visited) {
            depth = depth || 0;
            visited = visited || new Set();

            if (visited.has(schemaKey)) {
                return '<div class="ep-rel-body" style="padding:6px 12px;font-size:11px;color:var(--text-muted);font-style:italic;">(cycle &mdash; ' + escapeHtml(schemaKey) + ' already shown above)</div>';
            }
            visited.add(schemaKey);

            var schema = docsData && docsData.schemas ? docsData.schemas[schemaKey] : null;
            if (!schema) {
                return '<div class="ep-rel-body" style="padding:6px 12px;font-size:11px;color:var(--text-muted);">Unknown Resource: ' + escapeHtml(schemaKey) + '</div>';
            }

            var html = '';
            var indent = depth > 0 ? 'margin-left:' + (depth * 12) + 'px;' : '';

            // Split columns into expandable vs flat. A column is expandable when EITHER it has
            // an inner DTO whose fields are documented (JSON / bitmask wrappers) OR it carries
            // a closed-option set (bitmask flags, enum cases). Expandable rows become `<details>`
            // blocks that mirror the relationship UI; flat scalars stay in the field table.
            // Bitmask columns hit both signals \u2014 the expand body shows the wire-shape DTO AND
            // the option set, in that order.
            var flatColumns = [];
            var richColumns = [];
            (schema.columns || []).forEach(function(col) {
