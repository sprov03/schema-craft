        function doFilamentAction(schemaClass, previewOnly) {
            var payload = {
                schema: schemaClass,
                withPolicy: document.getElementById('gen-filament-policy-cb').checked,
                force: document.getElementById('gen-filament-force-cb').checked,
            };

            if (previewOnly) {
                fetch('/_schema-craft/api/filament/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }
                    showFilePreviewModal(data.files, 'Generate Filament', function() {
                        doFilamentWrite(payload);
                    });
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            } else {
                doFilamentWrite(payload);
            }
        }

        function doFilamentWrite(payload) {
            fetch('/_schema-craft/api/filament/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
            })
            .then(handleResponse)
            .then(function(data) {
                if (data.success) {
                    showToast(data.message, 'success');
                } else {
                    showToast(data.message || 'Filament generation failed.', 'error');
                }
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        function doFilamentAllAction(previewOnly) {
            var schemas = (generateConfig && generateConfig.schemas) ? generateConfig.schemas : [];
            if (!schemas.length) { showToast('No schemas found.', 'error'); return; }

            var withPolicy = document.getElementById('gen-filament-policy-cb').checked;
            var force = document.getElementById('gen-filament-force-cb').checked;

            if (previewOnly) {
                // Preview all by collecting files from each schema
                var allFiles = [];
                var remaining = schemas.length;
                var hadError = false;

                schemas.forEach(function(s) {
                    fetch('/_schema-craft/api/filament/preview', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ schema: s.class, withPolicy: withPolicy }),
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        if (data.success && data.files) {
                            allFiles = allFiles.concat(data.files);
                        }
                        remaining--;
                        if (remaining === 0 && !hadError) {
                            showFilePreviewModal(allFiles, 'Generate All Filament', function() {
                                doFilamentGenerateAll(schemas, withPolicy, force);
                            });
                        }
                    })
                    .catch(function(e) {
                        hadError = true;
                        showToast('Error previewing: ' + e.message, 'error');
                    });
                });
            } else {
                doFilamentGenerateAll(schemas, withPolicy, force);
            }
        }

        function doFilamentGenerateAll(schemas, withPolicy, force) {
            var remaining = schemas.length;
            var totalCreated = 0;

            schemas.forEach(function(s) {
                fetch('/_schema-craft/api/filament/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ schema: s.class, withPolicy: withPolicy, force: force }),
                })
                .then(handleResponse)
                .then(function(data) {
                    if (data.success && data.files) {
                        totalCreated += data.files.filter(function(f) { return f.created; }).length;
                    }
                    remaining--;
                    if (remaining === 0) {
                        showToast(totalCreated + ' Filament file(s) created.', 'success');
                    }
                })
                .catch(function() { remaining--; });
            });
        }

        // ── Schema Editor ─────────────────────────────────
        var SchemaEditor = {
            state: null,
            isNew: false,
            originalClass: null,
            dbConnection: null,
            activeTab: 'columns',
            editingIndex: null,
            editingType: null,
            overlayEl: null,
            availableModels: [],

            openNew: function(dbConnection) {
                this.isNew = true;
                this.originalClass = null;
                this.dbConnection = dbConnection;
                this.state = {
                    schemaName: '',
                    schemaNamespace: 'App\\Schemas',
                    modelNamespace: 'App\\Models',
                    tableName: null,
                    connection: null,
                    hasTimestamps: true,
                    hasSoftDeletes: false,
                    columns: [
                        { name: 'id', phpType: 'int', typeOverride: null, columnType: null, nullable: false, primary: true, autoIncrement: true, unsigned: false, unique: false, index: false, fillable: false, hidden: false, length: null, precision: null, scale: null, default: null, hasDefault: false, expressionDefault: null, castClass: null, renamedFrom: null, rules: null }
                    ],
                    relationships: [],
                    compositeIndexes: []
                };
                this.activeTab = 'columns';
                this.editingIndex = null;
                this.loadModels();
                this.render();
            },

            openEdit: function(schemaClass, dbConn) {
                var self = this;
                self.isNew = false;
                self.originalClass = schemaClass;
                self.dbConnection = dbConn;
                self.activeTab = 'columns';
                self.editingIndex = null;

                var url = '/_schema-craft/api/schema/detail?schema=' + encodeURIComponent(schemaClass);
                if (dbConn) url += '&db_connection=' + encodeURIComponent(dbConn);

                fetch(url)
                    .then(handleResponse)
                    .then(function(data) {
                        if (!data.success) { showToast(data.message || 'Failed to load schema', 'error'); return; }
                        self.state = {
                            schemaName: data.schemaName,
                            schemaNamespace: data.schemaNamespace,
                            modelNamespace: data.modelNamespace,
                            tableName: data.customTableName || null,
                            connection: data.connection || null,
                            hasTimestamps: data.hasTimestamps,
                            hasSoftDeletes: data.hasSoftDeletes,
                            columns: data.columns || [],
                            relationships: data.relationships || [],
                            compositeIndexes: data.compositeIndexes || []
                        };
                        self.loadModels();
                        self.render();
                    })
                    .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            loadModels: function() {
                var self = this;
                var url = '/_schema-craft/api/schema/available-models';
                if (self.dbConnection && self.dbConnection !== 'all') url += '?db_connection=' + encodeURIComponent(self.dbConnection);
                fetch(url).then(handleResponse).then(function(data) {
                    self.availableModels = data.models || [];
                    // Re-render relationship forms if open
                    if (self.activeTab === 'relationships' && self.overlayEl) {
                        self.renderBody();
                    }
                }).catch(function() {});
            },

            close: function() {
                if (this.overlayEl) { this.overlayEl.remove(); this.overlayEl = null; }
                this.state = null;
            },

            render: function() {
                var self = this;
                if (self.overlayEl) self.overlayEl.remove();

                var overlay = document.createElement('div');
                overlay.className = 'se-overlay';
                self.overlayEl = overlay;

                var title = self.isNew ? 'New Schema' : 'Edit ' + self.state.schemaName;

                overlay.innerHTML =
                    '<div class="se-modal">' +
                        '<div class="se-header">' +
                            '<span class="se-header-title">' + escapeHtml(title) + '</span>' +
                            '<button class="se-header-close se-close-btn">&times;</button>' +
                        '</div>' +
                        '<div class="se-tabs" id="se-tabs"></div>' +
                        '<div class="se-body" id="se-body"></div>' +
                        '<div class="se-footer">' +
                            '<button class="sc-btn" id="se-cancel">Cancel</button>' +
                            '<button class="sc-btn" id="se-preview">Preview</button>' +
                            '<button class="sc-btn primary" id="se-save">Save</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(overlay);

                // Close handlers
                overlay.querySelector('.se-close-btn').addEventListener('click', function() { self.close(); });
                overlay.querySelector('#se-cancel').addEventListener('click', function() { self.close(); });
                overlay.addEventListener('click', function(e) { if (e.target === overlay) self.close(); });
                document.addEventListener('keydown', function onEsc(e) {
                    if (e.key === 'Escape' && self.overlayEl) {
                        self.close();
                        document.removeEventListener('keydown', onEsc);
                    }
                });

                overlay.querySelector('#se-preview').addEventListener('click', function() { self.doPreview(); });
                overlay.querySelector('#se-save').addEventListener('click', function() { self.doSave(); });

                self.renderTabs();
                self.renderBody();
            },

            renderTabs: function() {
                var self = this;
                var tabs = document.getElementById('se-tabs');
                if (!tabs) return;
                var colCount = self.state.columns.length;
                var relCount = self.state.relationships.length;

                tabs.innerHTML =
                    '<button class="se-tab' + (self.activeTab === 'columns' ? ' active' : '') + '" data-se-tab="columns">Columns <span class="se-tab-count">' + colCount + '</span></button>' +
                    '<button class="se-tab' + (self.activeTab === 'relationships' ? ' active' : '') + '" data-se-tab="relationships">Relationships <span class="se-tab-count">' + relCount + '</span></button>' +
                    '<button class="se-tab' + (self.activeTab === 'settings' ? ' active' : '') + '" data-se-tab="settings">Settings</button>';

                tabs.querySelectorAll('.se-tab').forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        self.commitOpenEdit();
                        self.activeTab = tab.dataset.seTab;
                        self.editingIndex = null;
                        self.renderTabs();
                        self.renderBody();
                    });
                });
            },

            renderBody: function() {
                var body = document.getElementById('se-body');
                if (!body) return;
                if (this.activeTab === 'columns') this.renderColumnsList(body);
                else if (this.activeTab === 'relationships') this.renderRelationshipsList(body);
                else if (this.activeTab === 'settings') this.renderSettings(body);
            },

            // ── Columns Tab ──
            renderColumnsList: function(body) {
                var self = this;
                var html = '';

                if (self.state.columns.length === 0) {
                    html = '<div class="se-empty">No columns defined. Add one below.</div>';
                } else {
                    self.state.columns.forEach(function(col, i) {
                        var badges = '';
                        if (col.primary) badges += '<span class="se-constraint-badge pk">PK</span>';
                        if (col.autoIncrement) badges += '<span class="se-constraint-badge ai">AI</span>';
                        if (col.nullable) badges += '<span class="se-constraint-badge nullable">Null</span>';
                        if (col.unique) badges += '<span class="se-constraint-badge unique">Unique</span>';
                        if (col.index) badges += '<span class="se-constraint-badge idx">Index</span>';
                        if (col.fillable) badges += '<span class="se-constraint-badge fillable">Fill</span>';
                        if (col.hidden) badges += '<span class="se-constraint-badge hidden">Hide</span>';

                        var typeLabel = col.typeOverride || col.columnType || col.phpType;

                        html += '<div class="se-item-row' + (self.editingIndex === i && self.editingType === 'column' ? ' active' : '') + '" data-se-col-idx="' + i + '">' +
                            '<span class="se-item-name">' + escapeHtml(col.name) + '</span>' +
                            '<span class="se-type-badge">' + escapeHtml(typeLabel) + '</span>' +
                            badges +
                            '<span class="se-item-actions">' +
                                '<button class="se-item-btn se-remove-col" data-idx="' + i + '" title="Remove">&times;</button>' +
                            '</span>' +
                        '</div>';

                        if (self.editingIndex === i && self.editingType === 'column') {
                            html += self.renderColumnEditForm(col, i);
                        }
                    });
                }

                html += '<button class="se-add-btn" id="se-add-column">+ Add Column</button>';
                body.innerHTML = html;

                // Bind row clicks to toggle edit form
                body.querySelectorAll('.se-item-row[data-se-col-idx]').forEach(function(row) {
                    row.addEventListener('click', function(e) {
                        if (e.target.closest('.se-item-btn')) return;
                        var idx = parseInt(row.dataset.seColIdx, 10);
                        self.commitOpenEdit();
                        if (self.editingIndex === idx && self.editingType === 'column') {
                            self.editingIndex = null; self.editingType = null;
                        } else {
                            self.editingIndex = idx; self.editingType = 'column';
                        }
                        self.renderBody();
                    });
                });

                // Remove buttons
                body.querySelectorAll('.se-remove-col').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var idx = parseInt(btn.dataset.idx, 10);
                        self.state.columns.splice(idx, 1);
                        if (self.editingIndex === idx) { self.editingIndex = null; self.editingType = null; }
                        else if (self.editingIndex > idx) self.editingIndex--;
                        self.renderTabs();
                        self.renderBody();
                    });
                });

                // Add column
                document.getElementById('se-add-column').addEventListener('click', function() {
                    self.commitOpenEdit();
                    self.state.columns.push({
                        name: '', phpType: 'string', typeOverride: null, columnType: null,
                        nullable: false, primary: false, autoIncrement: false, unsigned: false,
                        unique: false, index: false, fillable: true, hidden: false,
                        length: null, precision: null, scale: null, default: null, hasDefault: false,
                        expressionDefault: null, castClass: null, renamedFrom: null, rules: null
                    });
                    self.editingIndex = self.state.columns.length - 1;
                    self.editingType = 'column';
                    self.renderTabs();
                    self.renderBody();
                    // Focus the name field
                    var nameInput = document.getElementById('se-col-name');
                    if (nameInput) nameInput.focus();
                });
            },

                        '<label class="se-check"><input type="checkbox" data-field="hasDefault"' + (col.hasDefault ? ' checked' : '') + '> Has Default</label>' +
                    '</div></div>' +
