                    if (hidden.value) {
                        // Restore the label for the currently selected option
                        var match = options.find(function(opt) { return opt.value === hidden.value; });
                        if (match) { input.value = buildLabel(match); }
                    } else if (!allowCustom) {
                        // Non-custom: clear the input so the user knows nothing is selected
                        input.value = '';
                    }
                    // allow-custom: keep whatever the user typed
                }

                function selectOption(val) {
                    var match = options.find(function(opt) { return opt.value === val; });
                    if (!match) { return; }
                    hidden.value = val;
                    input.value = buildLabel(match);
                    dropdown.style.display = 'none';
                    widget.dispatchEvent(new CustomEvent('sc:select', { bubbles: true, detail: { value: val } }));
                }

                function moveFocus(dir) {
                    var opts = dropdown.querySelectorAll('.sc-filter-select-option');
                    if (!opts.length) { return; }
                    opts.forEach(function(o) { o.classList.remove('focused'); });
                    focusIdx = Math.max(0, Math.min(opts.length - 1, focusIdx + dir));
                    opts[focusIdx].classList.add('focused');
                    opts[focusIdx].scrollIntoView({ block: 'nearest' });
                }

                input.addEventListener('focus', openDropdown);

                input.addEventListener('input', function() {
                    hidden.value = '';  // clear selection when typing
                    renderOptions(input.value);
                    dropdown.style.display = 'block';
                });

                input.addEventListener('keydown', function(e) {
                    var vim = e.metaKey || e.ctrlKey;
                    // ArrowDown / Cmd+J — move focus down
                    if (e.key === 'ArrowDown' || (vim && e.key === 'j')) {
                        e.preventDefault(); e.stopPropagation(); moveFocus(1);
                    // ArrowUp / Cmd+K — move focus up
                    } else if (e.key === 'ArrowUp' || (vim && e.key === 'k')) {
                        e.preventDefault(); e.stopPropagation(); moveFocus(-1);
                    // Enter — commit focused option
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        var focused = dropdown.querySelector('.sc-filter-select-option.focused');
                        if (focused) { selectOption(focused.dataset.value); }
                    // Escape — close dropdown
                    } else if (e.key === 'Escape') {
                        closeDropdown();
                    // Cmd+H — cursor left
                    } else if (vim && e.key === 'h') {
                        e.preventDefault(); e.stopPropagation();
                        var p = input.selectionStart;
                        input.setSelectionRange(Math.max(0, p - 1), Math.max(0, p - 1));
                    // Cmd+L — cursor right
                    } else if (vim && e.key === 'l') {
                        e.preventDefault(); e.stopPropagation();
                        var p = input.selectionStart;
                        input.setSelectionRange(Math.min(input.value.length, p + 1), Math.min(input.value.length, p + 1));
                    }
                });

                dropdown.addEventListener('mousedown', function(e) {
                    var opt = e.target.closest('.sc-filter-select-option');
                    if (opt) { e.preventDefault(); selectOption(opt.dataset.value); }
                });

                document.addEventListener('mousedown', function(e) {
                    if (!widget.contains(e.target)) { closeDropdown(); }
                });

                // Pre-fill default if a value is already set
                if (hidden.value) {
                    var preset = options.find(function(opt) { return opt.value === hidden.value; });
                    if (preset) { input.value = buildLabel(preset); }
                }

                // Open immediately — show all options on render
                openDropdown();
            });
        }

        function genBindStepEvents(step, container) {
            // Filterable selects
            genInitFilterSelect(container);

            // API registration widget: toggle each row's resource picker with its checkbox, and
            // wire "+ New" to the create-resource overlay scoped to that row's API.
            if (step.renderAs === 'apiRegistration') {
                container.querySelectorAll('.genr-apireg-row').forEach(function(row) {
                    var cb = row.querySelector('.genr-api-cb');
                    var sel = row.querySelector('.genr-api-resource');
                    var newBtn = row.querySelector('.genr-api-new');

                    cb.addEventListener('change', function() {
                        sel.disabled = !cb.checked;
                        newBtn.disabled = !cb.checked;
                    });

                    newBtn.addEventListener('click', function() {
                        var api = newBtn.dataset.api;
                        var schema = newBtn.dataset.schema;
                        if (!schema) { showToast('Select a schema earlier in the wizard first.', 'warning'); return; }

                        // Fetch the API's schema groups so the overlay has columns/relationships +
                        // related-resource options for this schema, then create under this API.
                        fetch('/_schema-craft/api/available-actions?api=' + encodeURIComponent(api), { headers: { 'Accept': 'application/json' } })
                            .then(handleResponse)
                            .then(function(data) {
                                var group = (data.groups || []).find(function(g) { return g.schema === schema; });
                                if (!group) { showToast('Schema not found in API ' + api + '.', 'error'); return; }
                                openCreateResourceOverlay(group, data.groups.indexOf(group), data, function(resource) {
                                    if (!resource) { return; }
                                    var opt = document.createElement('option');
                                    opt.value = resource.class;
                                    opt.textContent = resource.name;
                                    sel.appendChild(opt);
                                    sel.value = resource.class;
                                }, api);
                            })
                            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
                    });
                });
            }

            // Schema selector with column/relationship selection: fetch and render checkboxes
            // after the user picks a schema from the dropdown.
            if (step.type === 'schemaSelector' && (step.selectColumns || step.selectRelationships)) {
                var schemaSelectorWrapper = container.querySelector('#genr-step-field');
                if (schemaSelectorWrapper) {
                    schemaSelectorWrapper.addEventListener('sc:select', function(e) {
                        var schemaClass = e.detail.value;
                        var optionsDiv = schemaSelectorWrapper.querySelector('#genr-schema-options');
                        if (!optionsDiv) { return; }
                        optionsDiv.style.display = 'block';
                        optionsDiv.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">Loading…</div>';

                        fetch('/_schema-craft/api/generators/schema-info?' + new URLSearchParams({ class: schemaClass }).toString(), {
                            headers: { 'X-Requested-With': 'XMLHttpRequest' }
                        })
                        .then(handleResponse)
                        .then(function(data) {
                            var btnStyle = 'background:none;border:none;cursor:pointer;font-size:11px;color:var(--accent);padding:0 4px;';
                            var html = '';
                            if (step.selectColumns && data.columns && data.columns.length) {
                                html += '<div style="margin-bottom:10px;">';
                                html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
                                    '<span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Columns</span>' +
                                    '<span>' +
                                        '<button type="button" class="sc-select-all-cols" style="' + btnStyle + '">Select All</button>' +
                                        '<span style="color:var(--border);font-size:10px;">|</span>' +
                                        '<button type="button" class="sc-deselect-all-cols" style="' + btnStyle + '">Deselect All</button>' +
                                    '</span>' +
                                '</div>';
                                data.columns.forEach(function(col) {
                                    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;">' +
                                        '<input type="checkbox" class="genr-schema-col-cb" data-col="' + escapeAttr(col.name) + '">' +
                                        '<span style="font-size:12px;font-family:var(--font-mono);">' + escapeHtml(col.name) + '</span>' +
                                        '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(col.type) + ')</span>' +
                                    '</label>';
                                });
                                html += '</div>';
                            }
                            if (step.selectRelationships && data.relationships && data.relationships.length) {
                                html += '<div>';
                                html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
                                    '<span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Relationships</span>' +
                                    '<span>' +
                                        '<button type="button" class="sc-select-children-rels" style="' + btnStyle + '">Select Children</button>' +
                                        '<span style="color:var(--border);font-size:10px;">|</span>' +
                                        '<button type="button" class="sc-select-all-rels" style="' + btnStyle + '">Select All</button>' +
                                        '<span style="color:var(--border);font-size:10px;">|</span>' +
                                        '<button type="button" class="sc-deselect-all-rels" style="' + btnStyle + '">Deselect All</button>' +
                                    '</span>' +
                                '</div>';
                                data.relationships.forEach(function(rel) {
                                    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;">' +
                                        '<input type="checkbox" class="genr-schema-rel-cb" data-rel="' + escapeAttr(rel.name) + '" data-collection="' + (rel.isCollection ? '1' : '0') + '">' +
                                        '<span style="font-size:12px;font-family:var(--font-mono);">' + escapeHtml(rel.name) + '</span>' +
                                        '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(rel.type) + ')</span>' +
                                    '</label>';
                                });
                                html += '</div>';
                            }
                            optionsDiv.innerHTML = html || '<div style="color:var(--text-muted);font-size:12px;">No columns found.</div>';

                            // Select All / Deselect All for schemaSelector
                            optionsDiv.addEventListener('click', function(ev) {
                                var btn = ev.target;
                                if (btn.classList.contains('sc-select-all-cols')) {
                                    optionsDiv.querySelectorAll('.genr-schema-col-cb').forEach(function(cb) { cb.checked = true; });
                                } else if (btn.classList.contains('sc-deselect-all-cols')) {
                                    optionsDiv.querySelectorAll('.genr-schema-col-cb').forEach(function(cb) { cb.checked = false; });
                                } else if (btn.classList.contains('sc-select-children-rels')) {
                                    optionsDiv.querySelectorAll('.genr-schema-rel-cb').forEach(function(cb) { cb.checked = cb.dataset.collection === '1'; });
                                } else if (btn.classList.contains('sc-select-all-rels')) {
                                    optionsDiv.querySelectorAll('.genr-schema-rel-cb').forEach(function(cb) { cb.checked = true; });
                                } else if (btn.classList.contains('sc-deselect-all-rels')) {
                                    optionsDiv.querySelectorAll('.genr-schema-rel-cb').forEach(function(cb) { cb.checked = false; });
                                }
                            });
                        })
                        .catch(function() {
                            optionsDiv.innerHTML = '<div style="color:var(--danger);font-size:12px;">Failed to load schema info.</div>';
                        });
                    });
                }
            }

            // Cmd/Ctrl+vim navigation for native <select> and plain text inputs.
            // Note: sc-filter-select inputs handle vim keys in their own listener.
            container.addEventListener('keydown', function(e) {
                if (!e.metaKey && !e.ctrlKey) { return; }
                var key = e.key;
                var target = e.target;

                // j/k — navigate native <select> options (filter-selects handle their own)
                if (key === 'j' || key === 'k') {
                    var sel = target.closest('select');
                    if (!sel) { return; }
                    e.preventDefault();
                    sel.selectedIndex = Math.max(0, Math.min(sel.options.length - 1, sel.selectedIndex + (key === 'j' ? 1 : -1)));
                    return;
                }

                // h/l — cursor left/right in plain text inputs (filter-selects handle their own)
                if (key === 'h' || key === 'l') {
                    var textEl = target.closest('input[type=text], input[type=search], textarea');
                    if (!textEl || textEl.closest('.sc-filter-select')) { return; }
                    e.preventDefault();
                    var pos = textEl.selectionStart;
                    var newPos = key === 'h' ? Math.max(0, pos - 1) : Math.min(textEl.value.length, pos + 1);
                    textEl.setSelectionRange(newPos, newPos);
                }
            });

            // Field picker: expand relationship groups
            if (step.type === 'schemaFieldPicker' || step.renderAs === 'fieldPicker') {
                container.addEventListener('click', function(e) {
                    var toggle = e.target.closest('.fp-rel-toggle');
                    if (!toggle) { return; }
                    var row = toggle.closest('.fp-rel-row');
                    var children = row && row.nextElementSibling;
                    if (children && children.classList.contains('fp-rel-children')) {
                        var isOpen = children.style.display !== 'none';
                        children.style.display = isOpen ? 'none' : 'block';
                        toggle.textContent = isOpen ? '▶' : '▼';
                        if (!isOpen && !children.dataset.loaded) {
                            children.dataset.loaded = '1';
                            genLoadRelatedSchema(row.dataset.model, row.dataset.prefix, children);
                        }
                    }
                });
            }

            // Nested field selector: expand relationship rows + Select All/Deselect All
            if (step.type === 'nestedFieldSelector') {
                container.addEventListener('click', function(e) {
                    var btnStyle = 'background:none;border:none;cursor:pointer;font-size:11px;color:var(--accent);padding:0 4px;';

                    // Select All / Deselect All for top-level columns
                    if (e.target.classList.contains('nfs-select-all') && e.target.dataset.target === 'cols') {
                        container.querySelectorAll('.nfs-col-cb').forEach(function(cb) { cb.checked = true; });
                        return;
                    }
                    if (e.target.classList.contains('nfs-deselect-all') && e.target.dataset.target === 'cols') {
                        container.querySelectorAll('.nfs-col-cb').forEach(function(cb) { cb.checked = false; });
                        return;
                    }
                    if (e.target.classList.contains('nfs-select-required') && e.target.dataset.target === 'cols') {
                        container.querySelectorAll('.nfs-col-cb').forEach(function(cb) { cb.checked = cb.dataset.nullable === '0' && cb.dataset.hasDefault === '0'; });
                        return;
                    }

                    // Select All / Deselect All for relationship sub-fields
                    if (e.target.classList.contains('nfs-select-all') && e.target.dataset.target === 'rel-fields') {
                        var relRow = e.target.closest('.nfs-rel-row');
                        if (relRow) { relRow.querySelectorAll('.nfs-field-cb').forEach(function(cb) { cb.checked = true; }); }
                        return;
                    }
                    if (e.target.classList.contains('nfs-deselect-all') && e.target.dataset.target === 'rel-fields') {
                        var relRow = e.target.closest('.nfs-rel-row');
                        if (relRow) { relRow.querySelectorAll('.nfs-field-cb').forEach(function(cb) { cb.checked = false; }); }
                        return;
                    }

                    // Expand / collapse relationship row
                    var header = e.target.closest('.nfs-rel-header');
                    if (!header) { return; }
                    var row = header.closest('.nfs-rel-row');
                    if (!row) { return; }
                    var fieldsDiv = row.querySelector('.nfs-rel-fields');
                    var toggle = row.querySelector('.nfs-rel-toggle');
                    if (!fieldsDiv) { return; }

                    var isOpen = fieldsDiv.style.display !== 'none';
                    fieldsDiv.style.display = isOpen ? 'none' : 'block';
                    if (toggle) { toggle.textContent = isOpen ? '▶' : '▼'; }

                    if (!isOpen && !fieldsDiv.dataset.loaded) {
                        fieldsDiv.dataset.loaded = '1';
                        fieldsDiv.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Loading…</div>';

                        fetch('/_schema-craft/api/generators/related-schema?' + new URLSearchParams({ model: row.dataset.model }).toString())
                            .then(handleResponse)
                            .then(function(data) {
                                var cols = (data.columns || []);
                                if (!cols.length) {
                                    fieldsDiv.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">No fields found.</div>';
                                    return;
                                }
                                var relName = row.dataset.rel;
                                var fieldHtml = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
                                    '<span></span>' +
                                    '<span>' +
                                        '<button type="button" class="nfs-select-all" data-target="rel-fields" style="' + btnStyle + '">Select All</button>' +
                                        '<span style="color:var(--border);font-size:10px;">|</span>' +
                                        '<button type="button" class="nfs-deselect-all" data-target="rel-fields" style="' + btnStyle + '">Deselect All</button>' +
                                    '</span>' +
                                '</div>';
                                cols.forEach(function(col) {
                                    fieldHtml += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;">' +
                                        '<input type="checkbox" class="nfs-field-cb" data-col="' + escapeAttr(col.name) + '">' +
                                        '<span style="font-size:12px;font-family:var(--font-mono);">' + escapeHtml(col.name) + '</span>' +
                                        '<span style="font-size:11px;color:var(--text-muted);">(' + escapeHtml(col.type) + ')</span>' +
                                    '</label>';
                                });
                                fieldsDiv.innerHTML = fieldHtml;
                            })
                            .catch(function() {
                                fieldsDiv.innerHTML = '<div style="color:var(--danger);font-size:11px;padding:4px 0;">Failed to load.</div>';
                            });
                    }
                });
            }
        }

        // ── Field picker ───────────────────────────────────────────────────────

        function genBuildFieldPickerHtml(step) {
            var columns = step.columns || [];
            var relationships = step.relationships || [];

            var html = '<div id="genr-step-field" class="fp-picker">';

            if (columns.length) {
                html += '<div class="fp-section-title">Columns</div>';
                columns.forEach(function(col) {
                    html += '<label class="fp-col-row">' +
                        '<input type="checkbox" class="fp-col-cb" data-path="' + escapeAttr(col.name) + '" checked>' +
                        '<span class="fp-col-name">' + escapeHtml(col.name) + '</span>' +
                        '<span class="fp-col-type">' + escapeHtml(col.type) + '</span>' +
                    '</label>';
                });
            }

            if (relationships.length) {
                html += '<div class="fp-section-title" style="margin-top:12px;">Relationships</div>';
                relationships.forEach(function(rel) {
                    var prefix = rel.isCollection ? rel.name + '.*.' : rel.name + '.';
                    html += '<div class="fp-rel-row" data-model="' + escapeAttr(rel.relatedModel) + '" data-prefix="' + escapeAttr(prefix) + '">' +
                        '<span class="fp-rel-toggle">▶</span>' +
                        '<span class="fp-rel-name">' + escapeHtml(rel.name) + '</span>' +
                        '<span class="fp-rel-type">' + escapeHtml(rel.type) + '</span>' +
                    '</div>' +
                    '<div class="fp-rel-children" style="display:none;padding-left:20px;"></div>';
                });
            }

            if (!columns.length && !relationships.length) {
                html += '<div style="color:var(--text-muted);font-size:12px;">No fields available.</div>';
            }

            html += '</div>';
            return html;
        }

        function genLoadRelatedSchema(modelFqcn, prefix, container) {
            container.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Loading…</div>';

            fetch('/_schema-craft/api/generators/related-schema?' + new URLSearchParams({ model: modelFqcn }).toString())
                .then(handleResponse)
                .then(function(data) {
                    var cols = data.columns || [];
                    var rels = data.relationships || [];
                    var html = '';

                    cols.forEach(function(col) {
                        var path = prefix + col.name;
                        html += '<label class="fp-col-row">' +
                            '<input type="checkbox" class="fp-col-cb" data-path="' + escapeAttr(path) + '">' +
                            '<span class="fp-col-name">' + escapeHtml(col.name) + '</span>' +
                            '<span class="fp-col-type">' + escapeHtml(col.type) + '</span>' +
                        '</label>';
                    });

                    rels.forEach(function(rel) {
                        var childPrefix = prefix + (rel.isCollection ? rel.name + '.*.' : rel.name + '.');
                        html += '<div class="fp-rel-row" data-model="' + escapeAttr(rel.relatedModel) + '" data-prefix="' + escapeAttr(childPrefix) + '">' +
                            '<span class="fp-rel-toggle">▶</span>' +
                            '<span class="fp-rel-name">' + escapeHtml(rel.name) + '</span>' +
                            '<span class="fp-rel-type">' + escapeHtml(rel.type) + '</span>' +
                        '</div>' +
                        '<div class="fp-rel-children" style="display:none;padding-left:20px;"></div>';
                    });

                    if (!cols.length && !rels.length) {
                        html = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">No fields found.</div>';
                    }

                    container.innerHTML = html;

                    // Bind expand events on the newly rendered rows (delegate up)
                    container.addEventListener('click', function(e) {
                        var toggle = e.target.closest('.fp-rel-toggle');
                        if (!toggle) { return; }
                        var row = toggle.closest('.fp-rel-row');
                        var children = row && row.nextElementSibling;
                        if (children && children.classList.contains('fp-rel-children')) {
                            var isOpen = children.style.display !== 'none';
                            children.style.display = isOpen ? 'none' : 'block';
                            toggle.textContent = isOpen ? '▶' : '▼';
                            if (!isOpen && !children.dataset.loaded) {
                                children.dataset.loaded = '1';
                                genLoadRelatedSchema(row.dataset.model, row.dataset.prefix, children);
                            }
                        }
                    });
                })
                .catch(function() {
                    container.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Failed to load.</div>';
                });
        }

        // ── Value collection ────────────────────────────────────────────────────

        function genCollectStepValue(step, container) {
            var type = step.type;

            if (type === 'schemaSelector') {
                var wrapper = container.querySelector('#genr-step-field');
                var hiddenSel = wrapper ? wrapper.querySelector('.sc-filter-select-value') : null;
                var schemaClass = hiddenSel ? hiddenSel.value : '';
                if (!schemaClass) { return ''; }
                var needsCols = wrapper && wrapper.dataset.selectColumns === '1';
                var needsRels = wrapper && wrapper.dataset.selectRelationships === '1';
                if (!needsCols && !needsRels) { return schemaClass; }
                var result = { class: schemaClass };
                if (needsCols) {
                    var selCols = [];
                    (wrapper || container).querySelectorAll('.genr-schema-col-cb:checked').forEach(function(cb) { selCols.push(cb.dataset.col); });
                    result.selectedColumns = selCols;
                }
                if (needsRels) {
                    var selRels = [];
                    (wrapper || container).querySelectorAll('.genr-schema-rel-cb:checked').forEach(function(cb) { selRels.push(cb.dataset.rel); });
                    result.selectedRelationships = selRels;
                }
                return result;
            }

            if (type === 'text') {
                var el = container.querySelector('#genr-step-field');
                return el ? el.value : '';
            }

            if (type === 'boolean') {
                var cb = container.querySelector('#genr-step-field');
                return cb ? cb.checked : false;
            }

            if (type === 'select') {
                var sel2 = container.querySelector('#genr-step-field');
                return sel2 ? sel2.value : '';
            }

            if (type === 'multiselect') {
                var msSel = container.querySelector('#genr-step-field');
                if (!msSel) { return []; }
                return Array.from(msSel.selectedOptions).map(function(o) { return o.value; });
            }

            if (type === 'schemaColumn') {
                var sel3 = container.querySelector('#genr-step-field');
                return sel3 ? sel3.value : '';
            }

            if (type === 'schemaColumnCombobox') {
                var cbWidget = container.querySelector('#genr-step-field.sc-filter-select');
                if (!cbWidget) { return ''; }
                var cbHidden = cbWidget.querySelector('.sc-filter-select-value');
                var cbInput  = cbWidget.querySelector('.sc-filter-select-input');
                // Use selected option value if set, otherwise fall back to typed text
                return (cbHidden && cbHidden.value) ? cbHidden.value : (cbInput ? cbInput.value : '');
            }

            if (type === 'schemaColumns') {
                var checked = [];
                container.querySelectorAll('.genr-cols-cb:checked').forEach(function(cb2) {
                    checked.push(cb2.dataset.col);
                });
                return checked;
            }

            if (type === 'selectResourceDirectory') {
                var dirHidden = container.querySelector('#genr-step-field .sc-filter-select-value');
                return dirHidden ? dirHidden.value : '';
            }

            if (type === 'filamentPlacements' || step.renderAs === 'collection') {
                var items = [];
                container.querySelectorAll('.genr-collection[data-collection-key="genr-step-collection"] .genr-collection-item').forEach(function(item) {
                    var itemData = {};
                    item.querySelectorAll('.genr-collection-field').forEach(function(el) {
                        itemData[el.dataset.fieldKey] = el.value;
                    });
                    items.push(itemData);
                });
                return items;
            }

            if (type === 'schemaFieldPicker' || step.renderAs === 'fieldPicker') {
                var paths = [];
                container.querySelectorAll('.fp-col-cb:checked').forEach(function(cb3) {
                    paths.push(cb3.dataset.path);
                });
                return paths;
            }

            if (type === 'nestedFieldSelector') {
                // Collect top-level column names
                var nfsCols = [];
                container.querySelectorAll('.nfs-col-cb:checked').forEach(function(cb) { nfsCols.push(cb.dataset.col); });

                // Collect relationship sub-fields — only for expanded (loaded) relationships
                var nfsRels = {};
                container.querySelectorAll('.nfs-rel-row').forEach(function(row) {
                    var fieldsDiv = row.querySelector('.nfs-rel-fields');
                    if (!fieldsDiv || !fieldsDiv.dataset.loaded) { return; }
                    var relName = row.dataset.rel;
                    var fields = [];
                    fieldsDiv.querySelectorAll('.nfs-field-cb:checked').forEach(function(cb) { fields.push(cb.dataset.col); });
                    if (fields.length) { nfsRels[relName] = { fields: fields }; }
                });

                return { columns: nfsCols, relationships: nfsRels };
            }

            if (step.renderAs === 'apiRegistration') {
                // { apiName => resourceFqcn } for checked rows that picked a resource.
                var apiMap = {};
                container.querySelectorAll('.genr-apireg-row').forEach(function(row) {
                    var cb = row.querySelector('.genr-api-cb');
                    if (!cb || !cb.checked) { return; }
                    var sel = row.querySelector('.genr-api-resource');
                    if (sel && sel.value) { apiMap[row.dataset.api] = sel.value; }
                });
                return apiMap;
            }

            // Fallback: text
            var fallback = container.querySelector('#genr-step-field');
            return fallback ? fallback.value : '';
        }

        function genDisplayValue(step, value) {
            if (value === null || value === undefined) { return '—'; }
            if (typeof value === 'boolean') { return value ? 'Yes' : 'No'; }
            if (step.renderAs === 'apiRegistration' && value && typeof value === 'object') {
                var apiCount = Object.keys(value).length;
                return apiCount ? apiCount + ' API' + (apiCount !== 1 ? 's' : '') : '(none)';
            }
            if (Array.isArray(value)) {
                if (!value.length) { return '(none)'; }
                return value.length + ' item' + (value.length !== 1 ? 's' : '');
            }
            if (typeof value === 'object') {
                if (value.class) { return shortName(value.class); }
                // nestedFieldSelector value: {columns: [...], relationships: {...}}
                if (Array.isArray(value.columns)) {
                    var colCount = value.columns.length;
                    var relCount = Object.keys(value.relationships || {}).length;
                    var parts = [];
                    if (colCount) { parts.push(colCount + ' column' + (colCount !== 1 ? 's' : '')); }
                    if (relCount) { parts.push(relCount + ' relationship' + (relCount !== 1 ? 's' : '')); }
                    return parts.length ? parts.join(', ') : '(none)';
                }
                return JSON.stringify(value);
            }
            return String(value);
        }

        // ── Collection helpers (shared with filamentPlacements) ─────────────────

        function renderCollectionSubField(field, selectedValue) {
            if (field.type === 'groupedSelect') {
                var html = '<select class="sc-input genr-collection-field" data-field-key="' + escapeAttr(field.key) + '">';
                html += '<option value="">— Select —</option>';
                (field.groups || []).forEach(function(group) {
                    html += '<optgroup label="' + escapeAttr(group.label) + '">';
                    (group.options || []).forEach(function(opt) {
                        var selected = (selectedValue !== undefined && opt.value === selectedValue) ? ' selected' : '';
                        html += '<option value="' + escapeAttr(opt.value) + '"' + selected + '>' + escapeHtml(opt.label) + '</option>';
                    });
                    html += '</optgroup>';
                });
                html += '</select>';
                return html;
            }
            if (field.type === 'text') {
                return '<input type="text" class="sc-input genr-collection-field" data-field-key="' + escapeAttr(field.key) + '" value="">';
            }
            return '';
        }

        function renderCollectionItem(fields, values) {
            values = values || {};
            var fieldsHtml = fields.map(function(f) {
                return renderCollectionSubField(f, values[f.key]);
            }).join('');
            return '<div class="genr-collection-item">' +
                fieldsHtml +
                '<button type="button" class="genr-collection-remove" title="Remove">&times;</button>' +
            '</div>';
        }

        function renderCollectionInput(input) {
            var fields = input.fields || [];
            var addLabel = input.addLabel || 'Add Item';
            var key = input.key || 'collection';

            // Check if any field is a groupedSelect with options — if so, offer Select All
            var allOptions = [];
            var selectAllFieldKey = null;
            fields.forEach(function(f) {
                if (f.type === 'groupedSelect' && f.groups && f.groups.length > 0) {
                    selectAllFieldKey = f.key;
                    f.groups.forEach(function(g) {
                        (g.options || []).forEach(function(opt) {
                            allOptions.push({ key: f.key, value: opt.value });
                        });
                    });
                }
            });

            // Pre-populate with defaultItems if provided (e.g. filamentPlacements pre-selects all slots)
            var defaultItems = input.defaultItems || [];
            var initialItemsHtml = '';
            defaultItems.forEach(function(values) {
                initialItemsHtml += renderCollectionItem(fields, values);
            });

            var html = '<div class="genr-collection" data-collection-key="' + escapeAttr(key) + '" data-fields="' + escapeAttr(JSON.stringify(fields)) + '">' + initialItemsHtml + '</div>';
            html += '<div style="display:flex;gap:6px;margin-top:8px;">';
            html += '<button type="button" class="sc-btn sm genr-collection-add" data-collection-key="' + escapeAttr(key) + '">+ ' + escapeHtml(addLabel) + '</button>';
            if (allOptions.length > 0) {
                html += '<button type="button" class="sc-btn sm genr-collection-select-all" data-collection-key="' + escapeAttr(key) + '" data-all-options="' + escapeAttr(JSON.stringify(allOptions)) + '" style="border-color:var(--accent);color:var(--accent);">Select All (' + allOptions.length + ')</button>';
            }
            html += '</div>';
            return html;
        }

        // Disable already-selected values across all rows in a collection so duplicates can't be chosen.
        function syncCollectionSelectOptions(collectionEl) {
            var selects = collectionEl.querySelectorAll('select.genr-collection-field');
            var selectedByKey = {};

            // Collect selected values grouped by field key
            selects.forEach(function(sel) {
                var k = sel.dataset.fieldKey;
                if (!selectedByKey[k]) { selectedByKey[k] = []; }
                if (sel.value) { selectedByKey[k].push(sel.value); }
            });

            // For each select, disable options that are taken by OTHER rows
            selects.forEach(function(sel) {
                var k = sel.dataset.fieldKey;
                var takenByOthers = (selectedByKey[k] || []).filter(function(v) { return v !== sel.value; });
                sel.querySelectorAll('option').forEach(function(opt) {
                    opt.disabled = opt.value && takenByOthers.indexOf(opt.value) !== -1;
                });
            });
        }

        function bindCollectionEvents(container) {
            // Sync duplicate-prevention on any pre-populated items (from defaultItems)
            container.querySelectorAll('.genr-collection').forEach(function(collectionEl) {
                if (collectionEl.querySelector('.genr-collection-item')) {
                    syncCollectionSelectOptions(collectionEl);
                }
            });

            container.querySelectorAll('.genr-collection-add').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var key = btn.dataset.collectionKey;
                    var collectionEl = container.querySelector('.genr-collection[data-collection-key="' + key + '"]');
                    if (!collectionEl) { return; }
                    var fields = JSON.parse(collectionEl.dataset.fields || '[]');
                    collectionEl.insertAdjacentHTML('beforeend', renderCollectionItem(fields));
                    syncCollectionSelectOptions(collectionEl);
                });
            });

            container.querySelectorAll('.genr-collection-select-all').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var key = btn.dataset.collectionKey;
                    var collectionEl = container.querySelector('.genr-collection[data-collection-key="' + key + '"]');
                    if (!collectionEl) { return; }
                    var fields = JSON.parse(collectionEl.dataset.fields || '[]');
                    var allOptions = JSON.parse(btn.dataset.allOptions || '[]');
                    collectionEl.innerHTML = '';
                    allOptions.forEach(function(opt) {
                        var values = {};
                        values[opt.key] = opt.value;
                        collectionEl.insertAdjacentHTML('beforeend', renderCollectionItem(fields, values));
                    });
                    syncCollectionSelectOptions(collectionEl);
                });
            });

            container.addEventListener('change', function(e) {
                if (e.target.classList.contains('genr-collection-field') && e.target.tagName === 'SELECT') {
                    var collectionEl = e.target.closest('.genr-collection');
                    if (collectionEl) { syncCollectionSelectOptions(collectionEl); }
                }
            });

            container.addEventListener('click', function(e) {
                if (e.target.classList.contains('genr-collection-remove')) {
                    var collectionEl = e.target.closest('.genr-collection');
                    e.target.closest('.genr-collection-item').remove();
                    if (collectionEl) { syncCollectionSelectOptions(collectionEl); }
                }
            });
        }

        // ── Preview & Run ────────────────────────────────────────────────────────

        function genPreview() {
            fetch('/_schema-craft/api/generators/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify({ generator: genWizard.generatorClass, accumulated: genWizard.accumulated }),
            })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }
                    showFilePreviewModal(data.files, 'Generate Files', genRun, {
                        endpoint: 'POST /_schema-craft/api/generators/preview',
                        request: { generator: genWizard.generatorClass, accumulated: genWizard.accumulated },
                        response: data,
                    });
                })
                .catch(function(e) { showToast('Preview error: ' + e.message, 'error'); });
        }

        function genRun(confirmedFiles) {
            var payload = { generator: genWizard.generatorClass, accumulated: genWizard.accumulated, force: false };
            var skipFiles = (confirmedFiles || []).filter(function(f) { return f.skip; }).map(function(f) { return f.path; });
            if (skipFiles.length > 0) { payload.skipFiles = skipFiles; }
            fetch('/_schema-craft/api/generators/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify(payload),
            })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Generation failed.', 'error'); return; }
                    var msg = data.message || 'Files generated.';
                    if (skipFiles.length > 0) { msg += ' ' + skipFiles.length + ' skipped.'; }
                    showToast(msg, 'success');

                    // Modal launch (API Docs "Add Action"): close the modal and let the caller
                    // refresh in place (e.g. re-pull the docs) now that the endpoint exists.
                    if (genModalOverlay) {
                        var done = genModalOnComplete;
                        genCloseModal();
                        if (done) { done(); }
                    }
                })
                .catch(function(e) { showToast('Generation error: ' + e.message, 'error'); });
        }


        // ── Docs Tab ──────────────────────────────────────
        var docsInitialized = false;
        var docsDocuments = null; // array of { name, slug, sections: [{title, slug, content}] }
        var docsSearchTerm = '';
        var docsSearchTimeout = null;

        function initDocsTab() {
            if (docsInitialized) return;
            docsInitialized = true;

            var section = document.getElementById('docs-tab');
            section.innerHTML =
                '<div class="docs-sidebar">' +
                    '<div class="docs-search">' +
                        '<input type="search" id="docs-search-input" placeholder="Search documentation...">' +
                    '</div>' +
                    '<div class="docs-toc-count" id="docs-toc-count"></div>' +
                    '<ul class="docs-toc-list" id="docs-toc-list"></ul>' +
                '</div>' +
                '<div class="docs-content" id="docs-content">' +
                    '<div class="docs-empty">Loading documentation...</div>' +
                '</div>';

            document.getElementById('docs-search-input').addEventListener('input', function(e) {
                clearTimeout(docsSearchTimeout);
                docsSearchTimeout = setTimeout(function() {
                    docsSearchTerm = e.target.value.trim().toLowerCase();
                    renderDocsToc();
                    renderDocsContent();
                }, 200);
            });

            document.getElementById('docs-content').addEventListener('scroll', docsTrackScroll);

            loadDocsData();
        }

        function loadDocsData() {
            fetch('/_schema-craft/api/docs')
                .then(handleResponse)
                .then(function(data) {
                    docsDocuments = data.documents || [];
                    renderDocsToc();
                    renderDocsContent();
                })
                .catch(function(e) {
                    document.getElementById('docs-content').innerHTML =
                        '<div class="docs-empty">Failed to load documentation: ' + escapeHtml(e.message) + '</div>';
                });
        }

        /** Build a flat list of all sections across all documents, with doc context. */
        function docsAllSections() {
            if (!docsDocuments) return [];
            var all = [];
            docsDocuments.forEach(function(doc) {
                doc.sections.forEach(function(s) {
                    all.push({
                        docName: doc.name,
                        docSlug: doc.slug,
                        title: s.title,
                        slug: doc.slug + '--' + s.slug,
                        content: s.content
                    });
                });
            });
            return all;
        }

        /** Filter documents and their sections by search term. Returns filtered doc array. */
        function docsFilteredDocuments() {
            if (!docsDocuments) return [];
            if (!docsSearchTerm) return docsDocuments;

            var filtered = [];
            docsDocuments.forEach(function(doc) {
                var matchingSections = doc.sections.filter(function(s) {
                    return s.title.toLowerCase().indexOf(docsSearchTerm) !== -1 ||
                           s.content.toLowerCase().indexOf(docsSearchTerm) !== -1;
                });
                if (matchingSections.length > 0) {
                    filtered.push({
                        name: doc.name,
                        slug: doc.slug,
                        sections: matchingSections
                    });
                }
            });
            return filtered;
        }

        function renderDocsToc() {
            var list = document.getElementById('docs-toc-list');
            var countEl = document.getElementById('docs-toc-count');
            var filteredDocs = docsFilteredDocuments();

            if (!docsDocuments) {
                list.innerHTML = '';
                countEl.textContent = '';
                return;
            }

            var allSections = docsAllSections();
            var filteredTotal = 0;
            filteredDocs.forEach(function(d) { filteredTotal += d.sections.length; });

            if (docsSearchTerm) {
                countEl.textContent = filteredTotal + ' of ' + allSections.length + ' sections';
            } else {
                countEl.textContent = allSections.length + ' sections';
            }

            var html = '';
            filteredDocs.forEach(function(doc) {
                html += '<li class="docs-toc-group" data-doc-slug="' + escapeAttr(doc.slug) + '">';
                html += '<div class="docs-toc-group-header">' +
                    '<span class="docs-toc-chevron">&#9660;</span> ' +
                    escapeHtml(doc.name) +
                    '</div>';
                html += '<ul class="docs-toc-group-items">';
                doc.sections.forEach(function(s) {
                    var fullSlug = doc.slug + '--' + s.slug;
                    html += '<li class="docs-toc-item" data-slug="' + escapeAttr(fullSlug) + '">' +
                        escapeHtml(s.title) + '</li>';
                });
                html += '</ul></li>';
            });
            list.innerHTML = html;

            // Group header click → toggle collapse
            list.querySelectorAll('.docs-toc-group-header').forEach(function(header) {
                header.addEventListener('click', function() {
                    header.parentElement.classList.toggle('collapsed');
                });
            });

            // Section item click → scroll to section
            list.querySelectorAll('.docs-toc-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    var slug = item.dataset.slug;
                    var target = document.getElementById('doc-' + slug);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        }

        function renderDocsContent() {
            var container = document.getElementById('docs-content');
            var filteredDocs = docsFilteredDocuments();

            if (!docsDocuments) {
                container.innerHTML = '<div class="docs-empty">Loading documentation...</div>';
                return;
            }

            if (filteredDocs.length === 0) {
                container.innerHTML = '<div class="docs-empty">No sections match &ldquo;' +
                    escapeHtml(docsSearchTerm) + '&rdquo;</div>';
                return;
            }

            if (typeof marked === 'undefined') {
                container.innerHTML = '<div class="docs-empty">Documentation requires an internet connection for markdown rendering.<br><br>The <code>marked.js</code> library could not be loaded from CDN.</div>';
                return;
            }

            marked.setOptions({ gfm: true, breaks: false });

            var html = '';
            filteredDocs.forEach(function(doc) {
                html += '<div class="docs-doc-divider">';
                html += '<div class="docs-article">';
                doc.sections.forEach(function(s) {
                    var fullSlug = doc.slug + '--' + s.slug;
                    html += '<div class="docs-section" id="doc-' + escapeAttr(fullSlug) + '">';
                    html += marked.parse(s.content);
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            });

            container.innerHTML = html;

            // Add copy buttons to code blocks
            container.querySelectorAll('pre').forEach(function(pre) {
                var btn = document.createElement('button');
                btn.className = 'docs-copy-btn';
                btn.textContent = 'Copy';
                btn.addEventListener('click', function() {
                    var code = pre.querySelector('code');
                    if (code) {
                        navigator.clipboard.writeText(code.textContent).then(function() {
                            btn.textContent = 'Copied!';
                            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
                        });
                    }
                });
                pre.appendChild(btn);
            });

            if (docsSearchTerm) {
                docsHighlightMatches(container, docsSearchTerm);
            }
        }

        function docsHighlightMatches(root, term) {
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            var nodesToReplace = [];

            while (walker.nextNode()) {
                var node = walker.currentNode;
                var parent = node.parentElement;
                if (parent && (parent.tagName === 'CODE' || parent.tagName === 'PRE' ||
                    parent.classList.contains('docs-copy-btn'))) {
                    continue;
                }
                var idx = node.textContent.toLowerCase().indexOf(term);
                if (idx !== -1) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(function(node) {
                var text = node.textContent;
                var lowerText = text.toLowerCase();
                var frag = document.createDocumentFragment();
                var lastIdx = 0;
                var idx = lowerText.indexOf(term, lastIdx);

                while (idx !== -1) {
                    if (idx > lastIdx) {
                        frag.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
                    }
                    var mark = document.createElement('mark');
                    mark.className = 'docs-highlight';
                    mark.textContent = text.substring(idx, idx + term.length);
                    frag.appendChild(mark);
                    lastIdx = idx + term.length;
                    idx = lowerText.indexOf(term, lastIdx);
                }

                if (lastIdx < text.length) {
                    frag.appendChild(document.createTextNode(text.substring(lastIdx)));
                }

                node.parentNode.replaceChild(frag, node);
            });
        }

        function docsTrackScroll() {
            var container = document.getElementById('docs-content');
            var sections = container.querySelectorAll('.docs-section');
            var tocItems = document.querySelectorAll('.docs-toc-item');
            var scrollTop = container.scrollTop;
            var activeSlug = null;

            sections.forEach(function(sec) {
                if (sec.offsetTop - container.offsetTop <= scrollTop + 80) {
                    activeSlug = sec.id.replace('doc-', '');
                }
            });

            tocItems.forEach(function(item) {
                item.classList.toggle('active', item.dataset.slug === activeSlug);
            });
        }

        // ── Helpers ────────────────────────────────────────
        function shortName(fqcn) { return fqcn.split('\\').pop(); }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;');
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
