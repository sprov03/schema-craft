                    '<div class="se-row">' +
                        '<div class="se-field"><label>Rules</label><input type="text" value="' + escapeAttr(col.rules ? col.rules.join(', ') : '') + '" data-field="rules" placeholder="required, email, max:255"></div>' +
                        '<div class="se-field"><label>Renamed From</label><input type="text" value="' + escapeAttr(col.renamedFrom || '') + '" data-field="renamedFrom" placeholder="old_column_name"></div>' +
                    '</div>' +
                '</div>';
            },

            // ── Relationships Tab ──
            renderRelationshipsList: function(body) {
                var self = this;
                var html = '';

                if (self.state.relationships.length === 0) {
                    html = '<div class="se-empty">No relationships defined. Add one below.</div>';
                } else {
                    self.state.relationships.forEach(function(rel, i) {
                        var badges = '';
                        if (rel.nullable) badges += '<span class="se-constraint-badge nullable">Null</span>';
                        if (rel.index) badges += '<span class="se-constraint-badge idx">Index</span>';
                        if (rel.with) badges += '<span class="se-constraint-badge fillable">Eager</span>';
                        var modelShort = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';

                        html += '<div class="se-item-row' + (self.editingIndex === i && self.editingType === 'rel' ? ' active' : '') + '" data-se-rel-idx="' + i + '">' +
                            '<span class="se-item-name">' + escapeHtml(rel.name) + '</span>' +
                            '<span class="se-type-badge">' + escapeHtml(rel.type) + '</span>' +
                            (modelShort ? '<span class="se-constraint-badge">' + escapeHtml(modelShort) + '</span>' : '') +
                            badges +
                            '<span class="se-item-actions">' +
                                '<button class="se-item-btn se-remove-rel" data-idx="' + i + '" title="Remove">&times;</button>' +
                            '</span>' +
                        '</div>';

                        if (self.editingIndex === i && self.editingType === 'rel') {
                            html += self.renderRelationshipEditForm(rel, i);
                        }
                    });
                }

                html += '<button class="se-add-btn" id="se-add-rel">+ Add Relationship</button>';
                body.innerHTML = html;

                // Bind row clicks
                body.querySelectorAll('.se-item-row[data-se-rel-idx]').forEach(function(row) {
                    row.addEventListener('click', function(e) {
                        if (e.target.closest('.se-item-btn')) return;
                        var idx = parseInt(row.dataset.seRelIdx, 10);
                        self.commitOpenEdit();
                        if (self.editingIndex === idx && self.editingType === 'rel') {
                            self.editingIndex = null; self.editingType = null;
                        } else {
                            self.editingIndex = idx; self.editingType = 'rel';
                        }
                        self.renderBody();
                    });
                });

                // Remove buttons
                body.querySelectorAll('.se-remove-rel').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var idx = parseInt(btn.dataset.idx, 10);
                        self.state.relationships.splice(idx, 1);
                        if (self.editingIndex === idx) { self.editingIndex = null; self.editingType = null; }
                        else if (self.editingIndex > idx) self.editingIndex--;
                        self.renderTabs();
                        self.renderBody();
                    });
                });

                // Add relationship
                document.getElementById('se-add-rel').addEventListener('click', function() {
                    self.commitOpenEdit();
                    self.state.relationships.push({
                        name: '', type: 'belongsTo', relatedModel: '',
                        nullable: false, foreignColumn: null, onDelete: null, onUpdate: null,
                        noConstraint: false, pivotTable: null, pivotColumns: null,
                        morphName: null, pivotModel: null, index: false, columnType: null, with: false
                    });
                    self.editingIndex = self.state.relationships.length - 1;
                    self.editingType = 'rel';
                    self.renderTabs();
                    self.renderBody();
                    var nameInput = document.getElementById('se-rel-name');
                    if (nameInput) nameInput.focus();
                });
            },

            renderRelationshipEditForm: function(rel, idx) {
                var self = this;
                var relTypes = ['belongsTo', 'hasOne', 'hasMany', 'belongsToMany', 'morphTo', 'morphOne', 'morphMany', 'morphToMany'];
                var relTypeHtml = relTypes.map(function(t) {
                    return '<option value="' + t + '"' + (rel.type === t ? ' selected' : '') + '>' + t + '</option>';
                }).join('');

                var modelHtml = '<option value="">(select model)</option>';
                self.availableModels.forEach(function(m) {
                    modelHtml += '<option value="' + escapeAttr(m) + '"' + (rel.relatedModel === m ? ' selected' : '') + '>' + m.split('\\').pop() + ' (' + m + ')</option>';
                });

                var isMorphTo = rel.type === 'morphTo';
                var isBelongsTo = rel.type === 'belongsTo';
                var isBTM = rel.type === 'belongsToMany';
                var isMorphX = ['morphOne', 'morphMany', 'morphToMany'].indexOf(rel.type) !== -1;
                var needsMorphName = isMorphTo || isMorphX;

                var onDeleteOptions = ['', 'cascade', 'restrict', 'set null', 'no action'];
                var onDeleteHtml = onDeleteOptions.map(function(o) {
                    var label = o || '(none)';
                    return '<option value="' + o + '"' + ((rel.onDelete || '') === o ? ' selected' : '') + '>' + label + '</option>';
                }).join('');
                var onUpdateHtml = onDeleteOptions.map(function(o) {
                    var label = o || '(none)';
                    return '<option value="' + o + '"' + ((rel.onUpdate || '') === o ? ' selected' : '') + '>' + label + '</option>';
                }).join('');

                var html = '<div class="se-edit-form" data-se-edit-idx="' + idx + '" data-se-edit-type="rel">' +
                    '<div class="se-row">' +
                        '<div class="se-field" style="flex:2"><label>Name</label><input type="text" id="se-rel-name" value="' + escapeAttr(rel.name) + '" data-field="name"></div>' +
                        '<div class="se-field"><label>Type</label><select data-field="type">' + relTypeHtml + '</select></div>' +
                    '</div>';

                if (!isMorphTo) {
                    html += '<div class="se-row">' +
                        '<div class="se-field" style="flex:2"><label>Related Model</label><select data-field="relatedModel">' + modelHtml + '</select></div>' +
                    '</div>';
                }

                if (needsMorphName) {
                    html += '<div class="se-row"><div class="se-field"><label>Morph Name</label><input type="text" value="' + escapeAttr(rel.morphName || '') + '" data-field="morphName" placeholder="e.g. commentable"></div></div>';
                }

                if (isBelongsTo) {
                    html += '<div class="se-row">' +
                        '<div class="se-field"><label>On Delete</label><select data-field="onDelete">' + onDeleteHtml + '</select></div>' +
                        '<div class="se-field"><label>On Update</label><select data-field="onUpdate">' + onUpdateHtml + '</select></div>' +
                        '<div class="se-field"><label>Foreign Column</label><input type="text" value="' + escapeAttr(rel.foreignColumn || '') + '" data-field="foreignColumn" placeholder="custom_fk_id"></div>' +
                    '</div>' +
                    '<div class="se-row"><div class="se-field"><label>Column Type</label><input type="text" value="' + escapeAttr(rel.columnType || '') + '" data-field="columnType" placeholder="e.g. unsignedInteger"></div></div>';
                }

                if (isBTM) {
                    html += '<div class="se-row">' +
                        '<div class="se-field"><label>Pivot Table</label><input type="text" value="' + escapeAttr(rel.pivotTable || '') + '" data-field="pivotTable" placeholder="auto-detected"></div>' +
                        '<div class="se-field"><label>Pivot Model</label><input type="text" value="' + escapeAttr(rel.pivotModel || '') + '" data-field="pivotModel" placeholder="App\\Models\\FooPivot"></div>' +
                    '</div>' +
                    '<div class="se-row"><div class="se-field"><label>Pivot Columns (JSON)</label><input type="text" value="' + escapeAttr(rel.pivotColumns ? JSON.stringify(rel.pivotColumns) : '') + '" data-field="pivotColumns" placeholder=\'{"role":"string"}\'></div></div>';
                }

                if (isMorphTo) {
                    html += '<div class="se-row"><div class="se-field"><label>Column Type</label><input type="text" value="' + escapeAttr(rel.columnType || '') + '" data-field="columnType" placeholder="e.g. unsignedInteger"></div></div>';
                }

                html += '<div class="se-row"><div class="se-checks">';
                if (isBelongsTo || isMorphTo) {
                    html += '<label class="se-check"><input type="checkbox" data-field="nullable"' + (rel.nullable ? ' checked' : '') + '> Nullable</label>';
                    html += '<label class="se-check"><input type="checkbox" data-field="index"' + (rel.index ? ' checked' : '') + '> Index</label>';
                }
                if (isBelongsTo) {
                    html += '<label class="se-check"><input type="checkbox" data-field="noConstraint"' + (rel.noConstraint ? ' checked' : '') + '> No Constraint</label>';
                }
                html += '<label class="se-check"><input type="checkbox" data-field="with"' + (rel.with ? ' checked' : '') + '> Eager Load</label>';
                html += '</div></div>';

                html += '</div>';
                return html;
            },

            // ── Settings Tab ──
            renderSettings: function(body) {
                var self = this;
                var s = self.state;
                var html = '<div class="se-section"><div class="se-section-title">Identity</div>' +
                    '<div class="se-row">' +
                        '<div class="se-field" style="flex:2"><label>Schema Name</label><input type="text" id="se-set-name" value="' + escapeAttr(s.schemaName) + '"></div>' +
                        '<div class="se-field"><label>Table Name</label><input type="text" id="se-set-table" value="' + escapeAttr(s.tableName || '') + '" placeholder="(convention-based)"></div>' +
                    '</div>' +
                    '<div class="se-row">' +
                        '<div class="se-field"><label>Schema Namespace</label><input type="text" id="se-set-sns" value="' + escapeAttr(s.schemaNamespace) + '"></div>' +
                        '<div class="se-field"><label>Model Namespace</label><input type="text" id="se-set-mns" value="' + escapeAttr(s.modelNamespace) + '"></div>' +
                        '<div class="se-field"><label>Connection</label><input type="text" id="se-set-conn" value="' + escapeAttr(s.connection || '') + '" placeholder="(default)"></div>' +
                    '</div>' +
                '</div>' +
                '<div class="se-section"><div class="se-section-title">Traits</div>' +
                    '<div class="se-row"><div class="se-checks">' +
                        '<label class="se-check"><input type="checkbox" id="se-set-ts"' + (s.hasTimestamps ? ' checked' : '') + '> Timestamps (created_at, updated_at)</label>' +
                        '<label class="se-check"><input type="checkbox" id="se-set-sd"' + (s.hasSoftDeletes ? ' checked' : '') + '> Soft Deletes (deleted_at)</label>' +
                    '</div></div>' +
                '</div>' +
                '<div class="se-section"><div class="se-section-title">Composite Indexes</div>';

                if (s.compositeIndexes.length > 0) {
                    s.compositeIndexes.forEach(function(ci, i) {
                        html += '<div class="se-composite-row">' +
                            '<span class="se-composite-cols">' + escapeHtml(ci.join(', ')) + '</span>' +
                            '<button class="se-item-btn se-remove-ci" data-idx="' + i + '" title="Remove">&times;</button>' +
                        '</div>';
                    });
                }

                // Get column names for composite index picker
                var colNames = s.columns.map(function(c) { return c.name; }).filter(function(n) { return n; });
                html += '<div class="se-row" style="gap:8px;align-items:flex-end;">' +
                    '<div class="se-field" style="flex:3"><label>Add Composite Index</label><input type="text" id="se-ci-input" placeholder="col1, col2, col3"></div>' +
                    '<button class="sc-btn sm" id="se-add-ci" style="margin-bottom:0;height:33px;">Add</button>' +
                '</div>';

                html += '</div>';
                body.innerHTML = html;

                // Bind settings changes
                var settingsFields = [
                    { id: 'se-set-name', key: 'schemaName' },
                    { id: 'se-set-table', key: 'tableName', nullable: true },
                    { id: 'se-set-sns', key: 'schemaNamespace' },
                    { id: 'se-set-mns', key: 'modelNamespace' },
                    { id: 'se-set-conn', key: 'connection', nullable: true }
                ];
                settingsFields.forEach(function(sf) {
                    var el = document.getElementById(sf.id);
                    if (!el) return;
                    el.addEventListener('change', function() {
                        s[sf.key] = sf.nullable && !el.value ? null : el.value;
                        if (sf.key === 'schemaName') {
                            var titleEl = self.overlayEl.querySelector('.se-header-title');
                            if (titleEl) titleEl.textContent = (self.isNew ? 'New Schema' : 'Edit ') + (s.schemaName || '');
                        }
                    });
                });

                document.getElementById('se-set-ts').addEventListener('change', function() { s.hasTimestamps = this.checked; });
                document.getElementById('se-set-sd').addEventListener('change', function() { s.hasSoftDeletes = this.checked; });

                // Remove composite indexes
                body.querySelectorAll('.se-remove-ci').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        s.compositeIndexes.splice(parseInt(btn.dataset.idx, 10), 1);
                        self.renderBody();
                    });
                });

                // Add composite index
                document.getElementById('se-add-ci').addEventListener('click', function() {
                    var val = document.getElementById('se-ci-input').value.trim();
                    if (!val) return;
                    var cols = val.split(',').map(function(c) { return c.trim(); }).filter(Boolean);
                    if (cols.length < 2) { showToast('Composite index needs at least 2 columns', 'warning'); return; }
                    s.compositeIndexes.push(cols);
                    self.renderBody();
                });
            },

            // ── Commit open edit form values back to state ──
            commitOpenEdit: function() {
                if (this.editingIndex === null) return;
                var form = this.overlayEl ? this.overlayEl.querySelector('.se-edit-form') : null;
                if (!form) return;

                var item = this.editingType === 'column'
                    ? this.state.columns[this.editingIndex]
                    : this.state.relationships[this.editingIndex];
                if (!item) return;

                form.querySelectorAll('[data-field]').forEach(function(el) {
                    var field = el.dataset.field;
                    if (el.type === 'checkbox') {
                        item[field] = el.checked;
                    } else if (el.type === 'number') {
                        item[field] = el.value ? parseInt(el.value, 10) : null;
                    } else if (field === 'rules') {
                        var val = el.value.trim();
                        item[field] = val ? val.split(',').map(function(r) { return r.trim(); }).filter(Boolean) : null;
                    } else if (field === 'pivotColumns') {
                        try { item[field] = el.value ? JSON.parse(el.value) : null; } catch(e) { item[field] = null; }
                    } else if (field === 'default') {
                        item[field] = el.value;
                    } else {
                        item[field] = el.value || null;
                    }
                });
            },

            // ── Build payload for API ──
            buildPayload: function() {
                this.commitOpenEdit();
                var s = this.state;
                if (!s.schemaName) { showToast('Schema name is required', 'warning'); return null; }
                // Ensure schemaName ends with Schema
                if (s.schemaName.indexOf('Schema') === -1) {
                    s.schemaName = s.schemaName + 'Schema';
                }
                return {
                    schemaName: s.schemaName,
                    schemaNamespace: s.schemaNamespace,
                    modelNamespace: s.modelNamespace,
                    tableName: s.tableName || null,
                    connection: s.connection || null,
                    hasTimestamps: s.hasTimestamps,
                    hasSoftDeletes: s.hasSoftDeletes,
                    columns: s.columns,
                    relationships: s.relationships,
                    compositeIndexes: s.compositeIndexes,
                    createModel: true
                };
            },

            doPreview: function() {
                var payload = this.buildPayload();
                if (!payload) return;
                fetch('/_schema-craft/api/schema/save/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Preview failed', 'error'); return; }
                    showFilePreviewModal(data.files, function() { SchemaEditor.doSave(); }, 'Save Files');
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            doSave: function() {
                var self = this;
                var payload = self.buildPayload();
                if (!payload) return;
                fetch('/_schema-craft/api/schema/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Save failed', 'error'); return; }
                    showToast(data.message || 'Schema saved', 'success');
                    self.close();
                    self.promptRegenerateExtras(payload);
                    loadDatabaseTables();
                    refreshSchemaData();
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
            },

            promptRegenerateExtras: function(payload) {
                // Convention: table name from schema name
                var modelName = payload.schemaName.replace(/Schema$/, '');
                var tableName = modelName.replace(/([a-z])([A-Z])/g, '$1_$2').toLowerCase();
                tableName = tableName.replace(/([A-Z]+)/g, function(m) { return m.toLowerCase(); });
                // Simple pluralize
                if (!tableName.endsWith('s')) tableName += 's';

                showConfirmDialog(
                    'Regenerate Extras?',
                    'Would you like to regenerate Factory, Model Test, and Service for ' + modelName + '?',
                    function() {
                        var conn = SchemaEditor.dbConnection;
                        if (conn === 'all') conn = null;
                        fetch('/_schema-craft/api/schema/import/extras', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({
                                tables: [tableName],
                                createFactory: true,
                                createModelTest: true,
                                createService: true,
                                force: true,
                                db_connection: conn
                            })
                        })
                        .then(handleResponse)
                        .then(function(data) {
                            if (data.success) {
                                var s = data.summary || {};
                                var parts = [];
                                if (s.factories > 0) parts.push(s.factories + ' factory');
                                if (s.tests > 0) parts.push(s.tests + ' test');
                                if (s.services > 0) parts.push(s.services + ' service');
                                showToast(parts.join(', ') + ' generated', 'success');
                            }
                        })
                        .catch(function() {});
                    }
                );
            }
        };

        // ── Actions Tab ────────────────────────────────────
        var actionsInitialized = false;
        var actionsConfig = null;
        var actSelectedSchema = null;
        var actSelectedView = null;

        function initActionsTab() {
            if (actionsInitialized) return;
            actionsInitialized = true;
            loadSharedConnections(function() {
                loadActionsConfig(function() {
                    renderActionsMain();
                });
            });
        }

        function loadActionsConfig(callback) {
            fetch('/_schema-craft/api/actions/config')
                .then(handleResponse)
                .then(function(data) {
                    actionsConfig = data;
                    if (callback) callback();
                })
                .catch(function(e) { showToast('Failed to load actions config: ' + e.message, 'error'); });
        }

        function renderActionsMain() {
            var container = document.getElementById('actions-tab');

            var schemas = [];
            if (actionsConfig && actionsConfig.schemas) {
                schemas = actionsConfig.schemas;
            }

            var schemaListHtml = '';
            schemas.forEach(function(s) {
                var count = s.actions ? s.actions.length : 0;
                schemaListHtml += '<li class="gen-stack-item" data-schema="' + escapeAttr(s.class) + '">' +
                    '<span class="gen-stack-item-name">' + escapeHtml(s.modelName) + '</span>' +
                    '<span class="gen-stack-item-badge">' + count + '</span>' +
                '</li>';
            });

            if (!schemaListHtml) {
                schemaListHtml = '<li style="padding:16px;color:var(--text-muted);font-size:12px;text-align:center;">No schemas found</li>';
            }

            container.innerHTML =
                '<div class="gen-main">' +
                    '<div class="gen-sidebar">' +
                        '<div class="gen-sidebar-header" style="display:flex;align-items:center;justify-content:space-between;">' +
                            '<span class="gen-sidebar-api-name">Actions</span>' +
                            '<button class="sc-btn sm" id="act-docs-btn">Docs</button>' +
                        '</div>' +
                        '<div style="padding:8px 12px 0;">' +
                            '<select class="sc-input" id="act-db-connection" style="width:100%;padding:4px 10px;font-size:12px;"><option>Loading...</option></select>' +
                        '</div>' +
                        '<div class="gen-sidebar-section-title">Schemas</div>' +
                        '<div class="gen-sidebar-search">' +
                            '<input type="search" id="act-schema-search" placeholder="Search schemas...">' +
                        '</div>' +
                        '<ul class="gen-stack-list" id="act-schema-list">' + schemaListHtml + '</ul>' +
                    '</div>' +
                    '<div class="gen-content" id="act-content">' +
                        '<div class="gen-empty-state">Select a schema to view its actions</div>' +
                    '</div>' +
                '</div>';

            // Connection dropdown
            renderSharedConnectionDropdown('act-db-connection');
            document.getElementById('act-db-connection').addEventListener('change', function() {
                onSharedConnectionChange(this.value);
            });

            // Docs button
            document.getElementById('act-docs-btn').addEventListener('click', function() {
                showActionsDocsModal();
            });

            // Search filter
            document.getElementById('act-schema-search').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase();
                document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                    var name = item.querySelector('.gen-stack-item-name');
                    if (name) {
                        var matches = !query || name.textContent.toLowerCase().indexOf(query) !== -1;
                        item.style.display = matches ? '' : 'none';
                    }
                });
            });

            // Schema item clicks
            document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                item.addEventListener('click', function() {
                    actSelectSchema(item.dataset.schema);
                });
            });

            // Apply connection filter on initial render
            filterActionsSchemaList();

            // Restore from query params
            var params = new URLSearchParams(window.location.search);
            if (params.get('actSchema')) {
                actSelectSchema(params.get('actSchema'));
            }
        }

        function filterActionsSchemaList() {
            var conn = sharedFilterState.dbConnection;
            document.querySelectorAll('#act-schema-list .gen-stack-item[data-schema]').forEach(function(item) {
                if (!conn || conn === 'all') {
                    item.style.display = '';
                    return;
                }
                var schemaClass = item.dataset.schema;
                var schema = actionsConfig && actionsConfig.schemas
                    ? actionsConfig.schemas.find(function(s) { return s.class === schemaClass; })
                    : null;
                var matches = schema && schema.connection === conn;
                item.style.display = matches ? '' : 'none';
            });

            // If selected schema is now hidden, clear selection
            if (actSelectedSchema) {
                var selectedItem = document.querySelector('#act-schema-list .gen-stack-item[data-schema="' + actSelectedSchema + '"]');
                if (selectedItem && selectedItem.style.display === 'none') {
                    actSelectedSchema = null;
                    actSelectedView = null;
                    var content = document.getElementById('act-content');
                    if (content) content.innerHTML = '<div class="gen-empty-state">Select a schema to view its actions</div>';
                }
            }
        }

        function actSelectSchema(schemaClass) {
            actSelectedSchema = schemaClass;
            actSelectedView = 'detail';
            updateQueryParams({ actSchema: schemaClass });

            // Highlight in sidebar
            document.querySelectorAll('#act-schema-list .gen-stack-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.schema === schemaClass);
            });

            var schema = null;
            if (actionsConfig && actionsConfig.schemas) {
                schema = actionsConfig.schemas.find(function(s) { return s.class === schemaClass; });
            }
            if (!schema) { showToast('Schema not found.', 'error'); return; }

            renderActionsDetail(schema);
        }

        function renderActionsDetail(schema) {
            var content = document.getElementById('act-content');

            // Build action list (like endpoint list in Generate tab)
            var actionsHtml = '';
            if (schema.actions && schema.actions.length > 0) {
                schema.actions.forEach(function(action) {
                    var paramCount = 0;
                    actionsHtml += '<div class="act-action-item" data-action="' + escapeAttr(action.class) + '">' +
                        '<span class="gen-endpoint-method ' + action.httpMethod.toLowerCase() + '">' + action.httpMethod.toUpperCase() + '</span>' +
                        '<span class="act-action-item-name">' + escapeHtml(action.label || action.name) + '</span>' +
                        '<span class="act-action-item-params">' + escapeHtml(shortName(action.class)) + '</span>' +
                    '</div>';
                });
            }

            var badgesHtml = '';
            if (schema.hasRegistry) {
                badgesHtml += '<span class="gen-stack-badge controller">Registry</span>';
            }
            badgesHtml += '<span class="gen-stack-badge service">' + (schema.actions ? schema.actions.length : 0) + ' action' + ((schema.actions && schema.actions.length !== 1) ? 's' : '') + '</span>';

            content.innerHTML =
                '<div class="gen-stack-detail">' +
                    '<div class="gen-stack-header">' +
                        '<span class="gen-stack-title">' + escapeHtml(schema.modelName) + '</span>' +
                        '<span class="gen-stack-route-prefix">' + escapeHtml(shortName(schema.class)) + '</span>' +
                        '<div class="gen-stack-badges">' + badgesHtml + '</div>' +
                    '</div>' +
                    '<div class="gen-endpoint-section-title">Actions (' + (schema.actions ? schema.actions.length : 0) + ')</div>' +
                    '<div class="gen-endpoint-list">' +
                        (actionsHtml || '<div style="padding:16px;color:var(--text-muted);font-size:13px;">No actions defined yet.</div>') +
                    '</div>' +
                    '<div style="padding:16px 20px;border-top:1px solid var(--border);">' +
                        '<button class="sc-btn primary" id="act-new-action-btn" style="width:100%;">New Action</button>' +
                    '</div>' +
                '</div>';

            // Action item clicks — open detail modal
            content.querySelectorAll('.act-action-item[data-action]').forEach(function(item) {
                item.addEventListener('click', function() {
                    showActionDetailModal(item.dataset.action);
                });
            });

            // "New Action" opens the field picker with method + name built in
            document.getElementById('act-new-action-btn').addEventListener('click', function() {
                showFieldPickerModal(schema, '', 'put');
            });
        }

        function showActionDetailModal(actionClass) {
            fetch('/_schema-craft/api/actions/detail?action=' + encodeURIComponent(actionClass))
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) { showToast(data.message || 'Failed to load.', 'error'); return; }
                    renderActionDetailModal(data);
                })
                .catch(function(e) { showToast('Error: ' + e.message, 'error'); });
        }

        function renderActionDetailModal(action) {
            var overlay = document.createElement('div');
            overlay.className = 'fp-overlay';

            // Parameters table
            var paramsHtml = '';
            if (action.parameters && action.parameters.length > 0) {
                paramsHtml = '<table class="act-param-table">' +
                    '<thead><tr><th>Name</th><th>Type</th><th>Nullable</th><th>Kind</th></tr></thead><tbody>';
                action.parameters.forEach(function(p) {
                    var kindBadge = p.isNestedRelationship
                        ? '<span class="act-rel-type-badge' + (p.nestedRelationship && p.nestedRelationship.isCollection ? ' collection' : '') + '">' + (p.nestedRelationship ? p.nestedRelationship.relationshipType : 'Nested') + '</span>'
                        : p.isModel
                        ? '<span class="act-param-model-badge">Model</span>'
                        : '<span style="font-size:11px;color:var(--text-muted);">Scalar</span>';
                    paramsHtml += '<tr>' +
                        '<td><span class="act-param-type">' + escapeHtml(p.name) + '</span></td>' +
                        '<td><span class="act-param-type">' + escapeHtml(p.type) + '</span></td>' +
                        '<td><span style="font-size:11px;color:var(--text-muted);">' + (p.nullable ? 'Yes' : 'No') + '</span></td>' +
                        '<td>' + kindBadge + '</td>' +
                    '</tr>';
                });
                paramsHtml += '</tbody></table>';
            } else {
                paramsHtml = '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">No parameters</div>';
            }

            // Service method code block
            var serviceCodeHtml = '';
            if (action.serviceMethodCode) {
                serviceCodeHtml = '<pre class="act-service-code">' + escapeHtml(action.serviceMethodCode) + '</pre>';
            }

            // Generate / Regenerate button
            var genBtnLabel = action.serviceMethodExists ? 'Regenerate Service Method' : 'Generate Service Method';

            overlay.innerHTML =
                '<div class="fp-modal" style="max-width:700px;">' +
                    '<div class="fp-header">' +
                        '<span class="fp-header-title">' +
                            '<span class="gen-endpoint-method ' + action.httpMethod + '" style="margin-right:8px;">' + action.httpMethod.toUpperCase() + '</span>' +
                            escapeHtml(action.label || action.name) +
                        '</span>' +
                        '<div style="display:flex;gap:8px;align-items:center;">' +
                            '<button class="sc-btn sm" id="act-modal-docs">Docs</button>' +
                            '<button class="sc-btn sm" id="act-modal-edit">Edit</button>' +
                            '<button class="fp-close" id="act-modal-close">&times;</button>' +
                        '</div>' +
                    '</div>' +
                    '<div style="padding:20px;max-height:70vh;overflow-y:auto;">' +
                        '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-family:var(--font-mono);">' + escapeHtml(action.actionClass) + '</div>' +
                        (action.description ? '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;font-style:italic;">' + escapeHtml(action.description) + '</div>' : '') +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">Parameters (' + action.parameters.length + ')</div>' +
                        paramsHtml +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:20px;margin-bottom:8px;">Service Method</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
                            '<span style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);">' + escapeHtml(action.serviceMethod) + '()</span>' +
                            '<button class="sc-btn primary sm" id="act-modal-gen-service">' + escapeHtml(genBtnLabel) + '</button>' +
                        '</div>' +
                        serviceCodeHtml +
                        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:20px;margin-bottom:8px;">Filament Action</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
                            '<button class="sc-btn primary sm" id="act-modal-publish-filament">Publish Filament Action</button>' +
                            '<span style="font-size:11px;color:var(--text-muted);">Generate an explicit filamentAction() override for customization</span>' +
                        '</div>' +
                        '<pre class="act-service-code" id="act-filament-preview" style="display:none;"></pre>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            function close() { overlay.remove(); }
            overlay.querySelector('#act-modal-close').addEventListener('click', close);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });

            // Generate / Regenerate service method
            overlay.querySelector('#act-modal-gen-service').addEventListener('click', function() {
                var btn = this;

                if (action.serviceMethodExists) {
                    // Show diff preview first
                    btn.disabled = true;
                    btn.textContent = 'Loading preview...';

                    fetch('/_schema-craft/api/actions/service-preview?action=' + encodeURIComponent(action.actionClass), {
                        headers: { 'Accept': 'application/json' },
                    })
                    .then(handleResponse)
                    .then(function(data) {
                        btn.disabled = false;
                        btn.textContent = genBtnLabel;
                        if (!data.success) { showToast(data.message || 'Preview failed.', 'error'); return; }

                        var files = [{
                            path: data.servicePath,
                            content: data.newContent,
                            exists: data.exists,
                            existingContent: data.existingContent,
                        }];

                        showFilePreviewModal(files, 'Regenerate Service', function() {
                            doGenerateService(action.actionClass, btn, genBtnLabel);
                        });
                    })
                    .catch(function(e) {
                        btn.disabled = false;
                        btn.textContent = genBtnLabel;
                        showToast('Error: ' + e.message, 'error');
                    });
                } else {
                    doGenerateService(action.actionClass, btn, genBtnLabel);
                }
            });

            function doGenerateService(actionClass, btn, label) {
                btn.disabled = true;
                btn.textContent = 'Generating...';

                fetch('/_schema-craft/api/actions/generate-service', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: actionClass }),
                })
                .then(handleResponse)
                .then(function(data) {
                    btn.disabled = false;
                    btn.textContent = 'Regenerate Service Method';
                    if (data.success) {
                        showToast(data.message, 'success');
                        action.serviceMethodExists = true;
                    } else {
                        showToast(data.message || 'Generation failed.', 'error');
                    }
                })
                .catch(function(e) {
                    btn.disabled = false;
                    btn.textContent = label;
                    showToast('Error: ' + e.message, 'error');
                });
            }

            // Publish Filament Action button
            overlay.querySelector('#act-modal-publish-filament').addEventListener('click', function() {
                var btn = this;
                var previewEl = overlay.querySelector('#act-filament-preview');

                // First fetch preview
                btn.disabled = true;
                btn.textContent = 'Loading preview...';

                fetch('/_schema-craft/api/actions/filament-action-preview?action=' + encodeURIComponent(action.actionClass), {
                    headers: { 'Accept': 'application/json' },
                })
                .then(handleResponse)
                .then(function(data) {
                    if (!data.success) {
                        btn.disabled = false;
                        btn.textContent = 'Publish Filament Action';
                        showToast(data.message || 'Preview failed.', 'error');
                        return;
                    }

                    // Show the preview
                    previewEl.textContent = data.methodCode;
                    previewEl.style.display = 'block';

                    // Change button to confirm
                    btn.textContent = data.hasExistingMethod ? 'Overwrite & Publish' : 'Confirm & Publish';
                    btn.disabled = false;

                    // Replace click handler for confirmation
                    btn.onclick = function() {
                        btn.disabled = true;
                        btn.textContent = 'Publishing...';

                        fetch('/_schema-craft/api/actions/publish-filament-action', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({
                                action: action.actionClass,
                                force: data.hasExistingMethod,
                            }),
                        })
                        .then(handleResponse)
                        .then(function(result) {
                            btn.disabled = false;
                            if (result.success) {
                                btn.textContent = 'Published!';
                                btn.style.background = 'var(--success)';
                                showToast(result.message, 'success');
                            } else {
                                btn.textContent = 'Publish Filament Action';
                                showToast(result.message || 'Publish failed.', 'error');
                            }
                        })
                        .catch(function(e) {
                            btn.disabled = false;
                            btn.textContent = 'Publish Filament Action';
                            showToast('Error: ' + e.message, 'error');
                        });
                    };
                })
                .catch(function(e) {
                    btn.disabled = false;
                    btn.textContent = 'Publish Filament Action';
                    showToast('Error: ' + e.message, 'error');
                });
            });

            // Docs button — opens usage reference for this specific action
            overlay.querySelector('#act-modal-docs').addEventListener('click', function() {
                showActionsDocsModal(action);
            });

            // Edit action button
            overlay.querySelector('#act-modal-edit').addEventListener('click', function() {
                close();
                showEditActionModal(action);
            });
        }

        function showEditActionModal(action) {
            // Find the schema for this action
            var schemaClass = action.schemaClass;
            var schema = null;
            if (actionsConfig && actionsConfig.schemas) {
                schema = actionsConfig.schemas.find(function(s) { return s.class === schemaClass; });
            }
            if (!schema) {
                showToast('Schema not found for this action.', 'error');
                return;
            }

            // Derive selected columns from parameters
            var selectedColumns = [];
            var nullableOverrides = {};
            action.parameters.forEach(function(p) {
                if (p.isNestedRelationship && p.nestedRelationship) {
                    var nr = p.nestedRelationship;
                    var prefix = nr.name;
                    var wildcard = nr.isCollection ? '.*.' : '.';
                    nr.fields.forEach(function(f) {
                        selectedColumns.push(prefix + wildcard + f.name);
                    });
                } else if (p.isModel && p.foreignKeyColumn) {
                    selectedColumns.push(p.foreignKeyColumn);
                } else {
                    selectedColumns.push(p.columnName || p.name);
                }
            });

            // Open field picker with pre-populated selections
            var actionBaseName = action.name;
            showFieldPickerModal(schema, actionBaseName, action.httpMethod, {
                selectedColumns: selectedColumns,
                nullableOverrides: nullableOverrides,
                description: action.description || '',
                isEdit: true,
            });
        }

        function showFieldPickerModal(schema, actionName, httpMethod, editOptions) {
            var overlay = document.createElement('div');
            overlay.className = 'fp-overlay';

            // Separate flat columns from nested relationships
            var flatColumns = [];
            var nestedRelationships = [];
            if (schema.columns && schema.columns.length > 0) {
                schema.columns.forEach(function(col) {
                    if (col.isNestedRelationship) {
                        nestedRelationships.push(col);
                    } else {
                        flatColumns.push(col);
                    }
                });
            }

            // Build flat field items
            var fieldsHtml = '';
            flatColumns.forEach(function(col, idx) {
                var isNullable = col.nullable;
                var badges = '';
                if (col.isRelationship) badges += '<span class="act-field-badge fk">FK</span>';

                fieldsHtml += '<div class="act-field-item" data-col="' + escapeAttr(col.name) + '" data-nullable="' + (isNullable ? '1' : '0') + '">' +
                    '<input type="checkbox" id="act-fp-col-' + idx + '" value="' + escapeAttr(col.name) + '">' +
                    '<span class="act-field-item-name">' + escapeHtml(col.name) + '</span>' +
                    '<span class="act-field-item-type">' + escapeHtml(col.type) + '</span>' +
                    '<span class="act-field-item-badges">' + badges + '</span>' +
                    '<button class="act-nullable-toggle ' + (isNullable ? 'optional' : 'required') + '" data-col="' + escapeAttr(col.name) + '">' +
                        (isNullable ? 'Optional' : 'Required') +
                    '</button>' +
                '</div>';
            });

            // Build nested relationship sections
            var relHtml = '';
            if (nestedRelationships.length > 0) {
                relHtml = '<div style="margin-top:16px;">' +
                    '<span style="font-size:13px;font-weight:600;color:var(--text-primary);display:block;margin-bottom:8px;">Relationships</span>';

                nestedRelationships.forEach(function(rel) {
                    var isCollection = rel.isCollection;
                    var typeBadgeClass = isCollection ? 'act-rel-type-badge collection' : 'act-rel-type-badge';
                    var modelBaseName = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';

                    relHtml += '<div class="act-rel-group" data-rel="' + escapeAttr(rel.name) + '" data-model="' + escapeAttr(rel.relatedModel || '') + '" data-collection="' + (isCollection ? '1' : '0') + '" data-parentpath="">' +
                        '<div class="act-rel-header" data-rel="' + escapeAttr(rel.name) + '">' +
                            '<span class="act-rel-arrow">&#9654;</span>' +
                            '<span class="act-rel-name">' + escapeHtml(rel.name) + '</span>' +
                            '<span class="' + typeBadgeClass + '">' + escapeHtml(rel.type) + '</span>' +
                            '<span class="act-rel-model">' + escapeHtml(modelBaseName) + '</span>' +
                        '</div>' +
                        '<div class="act-rel-body" style="display:none;" data-rel-body="' + escapeAttr(rel.name) + '">' +
                            '<div class="act-rel-loading">Loading fields...</div>' +
                        '</div>' +
                    '</div>';
                });

                relHtml += '</div>';
            }

            var isNewAction = !editOptions || !editOptions.isEdit;
            var headerTitle = isNewAction ? 'New Action' : 'Edit Action: ' + escapeHtml(actionName);

            overlay.innerHTML =
                '<div class="fp-modal">' +
                    '<div class="fp-header">' +
                        '<span class="fp-header-title">' + headerTitle + '</span>' +
                        '<button class="fp-close" id="act-fp-close">&times;</button>' +
                    '</div>' +
                    '<div style="padding:20px;max-height:calc(80vh - 120px);overflow-y:auto;">' +
                        (isNewAction ? (
                        '<div style="display:flex;gap:10px;margin-bottom:16px;">' +
                            '<div style="flex:0 0 auto;">' +
                                '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">HTTP Method</label>' +
                                '<select class="sc-select" id="act-fp-method">' +
                                    '<option value="get"' + (httpMethod === 'get' ? ' selected' : '') + '>GET</option>' +
                                    '<option value="post"' + (httpMethod === 'post' ? ' selected' : '') + '>POST</option>' +
                                    '<option value="put"' + (httpMethod === 'put' ? ' selected' : '') + '>PUT</option>' +
                                    '<option value="delete"' + (httpMethod === 'delete' ? ' selected' : '') + '>DELETE</option>' +
                                '</select>' +
                            '</div>' +
                            '<div style="flex:1;">' +
                                '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">Action Name</label>' +
                                '<input type="text" class="sc-input" id="act-fp-name" placeholder="e.g. create, updateAddress, archive" value="' + escapeAttr(actionName) + '">' +
                            '</div>' +
                        '</div>'
                        ) : '') +
                        '<div style="margin-bottom:16px;">' +
                            '<label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;">Description (optional)</label>' +
                            '<input type="text" id="act-fp-description" placeholder="Brief description of what this action does" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text-primary);box-sizing:border-box;">' +
                        '</div>' +
                        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
                            '<span style="font-size:13px;font-weight:600;color:var(--text-primary);">Schema Columns</span>' +
                            '<div style="display:flex;gap:8px;">' +
                                '<button class="sc-btn sm" id="act-fp-all">Select All</button>' +
                                '<button class="sc-btn sm" id="act-fp-none">Clear</button>' +
                            '</div>' +
                        '</div>' +
                        '<div id="act-fp-fields" style="max-height:400px;overflow-y:auto;">' + fieldsHtml + relHtml + '</div>' +
                    '</div>' +
                    '<div class="fp-footer">' +
                        '<button class="sc-btn" id="act-fp-cancel">Cancel</button>' +
                        '<button class="sc-btn" id="act-fp-preview">Preview</button>' +
                        '<button class="sc-btn primary" id="act-fp-create">' + (editOptions && editOptions.isEdit ? 'Update Action' : 'Create Action') + '</button>' +
                    '</div>' +
                '</div>';

            document.body.appendChild(overlay);

            // Bind flat field item click/toggle behavior
            function bindFieldItemEvents(container) {
                container.querySelectorAll('.act-field-item').forEach(function(item) {
                    item.addEventListener('click', function(e) {
                        if (e.target.tagName === 'INPUT' || e.target.classList.contains('act-nullable-toggle')) return;
                        var cb = item.querySelector('input[type="checkbox"]');
                        cb.checked = !cb.checked;
                        item.classList.toggle('selected', cb.checked);
                    });
                    var cb = item.querySelector('input[type="checkbox"]');
                    cb.addEventListener('change', function() {
                        item.classList.toggle('selected', cb.checked);
                    });
                });

                container.querySelectorAll('.act-nullable-toggle').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var isOptional = btn.classList.contains('optional');
                        if (isOptional) {
                            btn.classList.remove('optional');
                            btn.classList.add('required');
                            btn.textContent = 'Required';
                        } else {
                            btn.classList.remove('required');
                            btn.classList.add('optional');
                            btn.textContent = 'Optional';
                        }
                    });
                });
            }

            bindFieldItemEvents(overlay);

            // Pre-populate selections when editing
            if (editOptions) {
                if (editOptions.description) {
                    var descInput = overlay.querySelector('#act-fp-description');
                    if (descInput) descInput.value = editOptions.description;
                }
                if (editOptions.selectedColumns) {
                    editOptions.selectedColumns.forEach(function(col) {
                        var cb = overlay.querySelector('.act-field-item input[type="checkbox"][value="' + CSS.escape(col) + '"]');
                        if (cb) {
                            cb.checked = true;
                            cb.closest('.act-field-item').classList.add('selected');
                        }
                    });
                }
            }

            // Expandable relationship headers — bind click handlers on any container
            var relSchemaCache = {};

            function bindRelHeaderEvents(container) {
                container.querySelectorAll('.act-rel-header').forEach(function(header) {
                    if (header.dataset.bound === '1') return;
                    header.dataset.bound = '1';

                    header.addEventListener('click', function() {
                        var group = header.closest('.act-rel-group');
                        var body = group.querySelector('[data-rel-body="' + header.dataset.rel + '"]');
                        var isExpanded = header.classList.contains('expanded');

                        if (isExpanded) {
                            header.classList.remove('expanded');
                            body.style.display = 'none';
                            return;
                        }

                        header.classList.add('expanded');
                        body.style.display = 'block';

                        // If already loaded, just show
                        if (body.dataset.loaded === '1') return;

                        var modelFqcn = group.dataset.model;
                        var parentPath = group.dataset.parentpath || '';
                        var isCollection = group.dataset.collection === '1';
                        var relName = header.dataset.rel;
                        var wildcard = isCollection ? '.*.' : '.';
                        var dotPrefix = parentPath ? (parentPath + relName) : relName;

                        // Check cache
                        if (relSchemaCache[modelFqcn]) {
                            renderRelatedFields(body, relSchemaCache[modelFqcn], dotPrefix, wildcard);
                            return;
                        }

                        // Fetch related schema columns
                        fetch('/_schema-craft/api/actions/related-schema?model=' + encodeURIComponent(modelFqcn), {
                            headers: { 'Accept': 'application/json' },
                        })
                        .then(handleResponse)
                        .then(function(data) {
                            if (!data.success) {
                                body.innerHTML = '<div class="act-rel-loading">No schema found for this model.</div>';
                                body.dataset.loaded = '1';
                                return;
                            }
                            relSchemaCache[modelFqcn] = data.columns;
                            renderRelatedFields(body, data.columns, dotPrefix, wildcard);
                        })
                        .catch(function() {
                            body.innerHTML = '<div class="act-rel-loading">Failed to load fields.</div>';
                            body.dataset.loaded = '1';
                        });
                    });
                });
            }

            bindRelHeaderEvents(overlay);

            function renderRelatedFields(body, columns, dotPrefix, wildcard) {
                if (!columns || columns.length === 0) {
                    body.innerHTML = '<div class="act-rel-loading">No selectable columns found.</div>';
                    body.dataset.loaded = '1';
                    return;
                }

                var html = '';
                var flatCols = columns.filter(function(c) { return !c.isNestedRelationship; });
                var nestedCols = columns.filter(function(c) { return c.isNestedRelationship; });

                // Render flat field checkboxes
                flatCols.forEach(function(col) {
                    var dotPath = dotPrefix + wildcard + col.name;
                    var isNullable = col.nullable;

                    html += '<div class="act-field-item act-nested-field" data-col="' + escapeAttr(dotPath) + '" data-nullable="' + (isNullable ? '1' : '0') + '">' +
                        '<input type="checkbox" value="' + escapeAttr(dotPath) + '">' +
                        '<span class="act-field-item-name">' + escapeHtml(col.name) + '</span>' +
                        '<span class="act-field-item-type">' + escapeHtml(col.type) + '</span>' +
                        '<span class="act-field-item-badges"></span>' +
                        '<button class="act-nullable-toggle ' + (isNullable ? 'optional' : 'required') + '" data-col="' + escapeAttr(dotPath) + '">' +
                            (isNullable ? 'Optional' : 'Required') +
                        '</button>' +
                    '</div>';
                });

                // Render nested relationship sub-groups (for deep nesting)
                nestedCols.forEach(function(rel) {
                    var isCollection = rel.isCollection;
                    var typeBadgeClass = isCollection ? 'act-rel-type-badge collection' : 'act-rel-type-badge';
                    var modelBaseName = rel.relatedModel ? rel.relatedModel.split('\\').pop() : '';
                    var childWildcard = isCollection ? '.*.' : '.';
                    // parentpath stores the accumulated dot prefix + wildcard so children can build on it
                    var childParentPath = dotPrefix + wildcard;

                    html += '<div class="act-rel-group" data-rel="' + escapeAttr(rel.name) + '" data-model="' + escapeAttr(rel.relatedModel || '') + '" data-collection="' + (isCollection ? '1' : '0') + '" data-parentpath="' + escapeAttr(childParentPath) + '">' +
                        '<div class="act-rel-header" data-rel="' + escapeAttr(rel.name) + '">' +
                            '<span class="act-rel-arrow">&#9654;</span>' +

            function getPayload() {
                // Read action name and method from modal inputs for new actions
                var currentActionName = actionName;
                var currentHttpMethod = httpMethod;
                if (isNewAction) {
                    var nameInput = overlay.querySelector('#act-fp-name');

                    var methodSelect = overlay.querySelector('#act-fp-method');
                    currentHttpMethod = methodSelect ? methodSelect.value : 'put';
                }

                var selectedColumns = [];
                var nullableOverrides = {};

                overlay.querySelectorAll('#act-fp-fields .act-field-item').forEach(function(item) {
                    var cb = item.querySelector('input[type="checkbox"]');
                    if (!cb.checked) return;

                    var colName = cb.value;
                    selectedColumns.push(colName);

                    // Check if the user changed nullable from the schema default
                    var originalNullable = item.dataset.nullable === '1';
                    var toggle = item.querySelector('.act-nullable-toggle');
                    var currentNullable = toggle.classList.contains('optional');

                    if (currentNullable !== originalNullable) {
                        nullableOverrides[colName] = currentNullable;
                    }
                });

                var descInput = overlay.querySelector('#act-fp-description');
                var description = descInput ? descInput.value.trim() : '';

                var payload = {
                    schema: schema.class,
                    actionName: currentActionName,
                    selectedColumns: selectedColumns,
                    httpMethod: currentHttpMethod,
                };

                if (description) {
                    payload.description = description;
                }

                if (Object.keys(nullableOverrides).length > 0) {
                    payload.nullableOverrides = nullableOverrides;
                }

                return payload;

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),

                .then(handleResponse)
                .then(function(data) {

                        // Close the field picker via event
                        close();

        function actDoWriteAction(payload, schema, isEdit) {
            var url = isEdit ? '/_schema-craft/api/actions/update' : '/_schema-craft/api/actions/create';
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
            })
            .then(handleResponse)
            .then(function(data) {
                if (data.success) {
                    showToast(data.message, 'success');
                    // Refresh and re-render
                    actionsInitialized = false;
                    loadActionsConfig(function() {
                        renderActionsMain();
                        actSelectSchema(schema.class);
                    });

                }
            })
            .catch(function(e) { showToast('Error: ' + e.message, 'error'); });

        function loadGeneratorsConfig(callback) {

                .then(handleResponse)
                .then(function(data) {
                    generatorsConfig = data;
                    if (callback) callback();

                '<div class="gen-main">' +
                    '<div class="gen-sidebar">' +
                        '<div class="gen-sidebar-header">' +

        function genSelectGenerator(generatorClass) {

            document.querySelectorAll('#genr-list .gen-stack-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.generator === generatorClass);

            var content = document.getElementById('genr-content');

                    schemas.forEach(function(s) {
                        schemaOpts += '<option value="' + escapeAttr(s.class) + '">' + escapeHtml(s.modelName) + ' (' + escapeHtml(shortName(s.class)) + ')</option>';
                    });
                    inputsHtml += '<select class="sc-input genr-schema-selector" data-key="' + escapeAttr(input.key) + '" ' +
                        'data-select-columns="' + (input.selectColumns ? '1' : '0') + '" ' +
                        'data-select-relationships="' + (input.selectRelationships ? '1' : '0') + '">' +

                    if (input.selectColumns) {
                        inputsHtml += '<div class="genr-selector-cols" id="genr-selector-cols-' + escapeAttr(input.key) + '" style="display:none;margin-top:8px;">' +
                            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
                                '<span style="font-size:11px;color:var(--text-muted);">Columns</span>' +
                                '<span style="display:flex;gap:6px;">' +
                                    '<button type="button" class="genr-select-all-cols" data-selector="' + escapeAttr(input.key) + '" style="font-size:10px;padding:1px 6px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);">Select All</button>' +
                                    '<button type="button" class="genr-deselect-all-cols" data-selector="' + escapeAttr(input.key) + '" style="font-size:10px;padding:1px 6px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);">Deselect All</button>' +
                                '</span>' +
                            '</div>' +
                            '<div class="genr-columns-list" id="genr-selector-cols-list-' + escapeAttr(input.key) + '"></div>' +
                        '</div>';
                    }
                    if (input.selectRelationships) {
                        inputsHtml += '<div class="genr-selector-rels" id="genr-selector-rels-' + escapeAttr(input.key) + '" style="display:none;margin-top:8px;">' +
                            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
                                '<span style="font-size:11px;color:var(--text-muted);">Relationships</span>' +
                                '<span style="display:flex;gap:6px;">' +
                                    '<button type="button" class="genr-select-all-rels" data-selector="' + escapeAttr(input.key) + '" style="font-size:10px;padding:1px 6px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);">Select All</button>' +
                                    '<button type="button" class="genr-deselect-all-rels" data-selector="' + escapeAttr(input.key) + '" style="font-size:10px;padding:1px 6px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);">Deselect All</button>' +
                                '</span>' +

                    inputsHtml += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">' +

                    Object.keys(input.options || {}).forEach(function(val) {

                } else if (input.type === 'schemaColumn') {
                    inputsHtml += '<select class="sc-input genr-input genr-schema-col-picker" data-key="' + escapeAttr(input.key) + '" data-selector-key="' + escapeAttr(input.selectorKey || 'schema') + '">' +
                        '<option value="">-- Select a column --</option>' +
                    '</select>';

                    inputsHtml += '<div class="genr-schema-cols-picker" data-key="' + escapeAttr(input.key) + '" data-selector-key="' + escapeAttr(input.selectorKey || 'schema') + '">' +
                        '<div style="font-size:11px;color:var(--text-muted);">Select a schema first</div>' +

            content.innerHTML =
                '<div class="gen-stack-detail">' +
                    '<div class="gen-stack-header">' +
                        '<span class="gen-stack-title">' + escapeHtml(generatorDef.name) + '</span>' +
                        '<span class="gen-stack-route-prefix">' + escapeHtml(shortName(generatorDef.class)) + '</span>' +
                    '</div>' +
                    '<div style="padding:20px;">' +
                        ((generatorDef.inputs && generatorDef.inputs.length > 0) ? '<div class="gen-endpoint-section-title" style="margin-bottom:12px;">Configuration</div>' + inputsHtml : '') +
                        '<div style="display:flex;gap:8px;margin-top:20px;">' +
                            '<button class="sc-btn primary" id="genr-preview-btn">Preview</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            // Schema selector change → load columns/relationships
            content.querySelectorAll('.genr-schema-selector').forEach(function(select) {
                select.addEventListener('change', function() {
                    genLoadSelectorData(generatorDef, select.dataset.key, select.value, select.dataset.selectColumns === '1', select.dataset.selectRelationships === '1');
                });

            // Preview button
            document.getElementById('genr-preview-btn').addEventListener('click', function() {
